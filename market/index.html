<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模板市场 · VisInter-Agent v0.1</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   tokens.css —— 平台唯一视觉令牌源
   ───────────────────────────────────────────────────────────────────────
   定位：「暗黑玻璃拟态 · 冷银基调」。深黑 #08080a 上悬浮两团冷色光晕
   （左上蓝灰、右下紫灰），所有卡片/面板/输入/弹窗是一层半透明白玻璃：
   光从玻璃后面透出来，边缘靠 1px 亮线勾勒，hover 上浮并泛一圈冷光。

   为什么要有这个文件：
     七套界面此前各持一份配色。令牌集中到一处之后，全平台只有一种视觉人格，
     并且「像不像暗黑玻璃」这件事变成了可被 lint 校验的硬指标（tools/lint_ui.mjs）。

   四条硬规矩（违反即 lint 失败）：
     1. 玻璃面统一：背景 rgba(255,255,255,.06)、边框 rgba(255,255,255,.12)、
        圆角 16px、blur(20px) saturate(1.4)、黑阴影 + 顶部 1px 内亮线。
     2. 冷银唯一强调：--acc #C8CDD4，高亮 #EEF1F5。光晕只许冷色
        （蓝灰/紫灰/银，通道差 ≤ 64 且蓝≥红），禁止暖色荧光与 AI 紫。
     3. hover 三件套：背景提亮到 .10、边框提亮到 .25、上浮 3px + 冷光
        0 0 20px rgba(180,200,230,.15)。循环动画只给铸造粒子/烟雾加载器。
     4. 碑铭字体保留：平台名与卡片标题走 --serif 宽字距；正文 --sans
        小字号松行高；数字一律 tabular-nums。颗粒层保留（胶片感）。

   使用方式：
     单文件产物要求双击 file:// 可用 → 不允许运行时 @import。
     各 HTML 的 :root 必须**逐字复制**本文件的变量块；lint 会比对变量名与取值。
     通用玻璃类 .glass-card / .glass-btn / .glass-input 在本文件底部，
     组件直接挂类，不要各写一份玻璃配方。移动端 blur 自动降到 12px。
   ═══════════════════════════════════════════════════════════════════════ */

/* 碑铭衬线：Cinzel（SIL OFL，本地 woff2，见 assets/fonts/LICENSE-Cinzel.txt）。
   中文无 Cinzel 字形，自然落到宋体/思源宋体——碑铭感靠字距与字重，不靠假字体。 */
@font-face {
  font-family: "Cinzel";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("../assets/fonts/cinzel-latin-400.woff2") format("woff2");
}
@font-face {
  font-family: "Cinzel";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("../assets/fonts/cinzel-latin-700.woff2") format("woff2");
}

:root {
  /* ── 玻璃明度阶梯：半透明白膜叠在深黑上，冷光晕从后面透出来 ──────
     越靠近内容越亮。--panel 是标准玻璃面，--panel2 是膜内凹槽。 */
  --bg:        #08080a;   /* 应用底（双光晕的落点） */
  --bg-deep:   #0a0a0d;   /* 画布凹槽（节点图、时间轴）：比玻璃面更暗 */
  --panel:     rgba(255, 255, 255, 0.06);   /* 标准玻璃面 */
  --panel2:    rgba(255, 255, 255, 0.04);   /* 输入框 / 膜内凹槽 */
  --panel3:    rgba(255, 255, 255, 0.10);   /* 悬停态 */
  --panel4:    rgba(255, 255, 255, 0.14);   /* 按下 / 选中填充 */

  /* ── 分隔线：玻璃边缘的亮线（1px 半透明白）───────────────────── */
  --line:      rgba(255, 255, 255, 0.12);   /* 常规玻璃边框 */
  --line2:     rgba(255, 255, 255, 0.18);   /* 强分隔 / 输入框边框 */
  --line3:     rgba(255, 255, 255, 0.25);   /* hover / 焦点边框 */

  /* ── 文字（三级，绝不用纯白：纯白在暗底上光晕扩散）────────────── */
  --text:      #d4d8de;   /* 主文本 */
  --text-dim:  #7a8089;   /* 次要说明 */
  --text-dim2: #565c66;   /* 占位 / 禁用 */

  /* ── 唯一强调色：冷银。高亮 #eef1f5，像光扫过玻璃边缘 ─────────── */
  --acc:       #c8cdd4;
  --acc-hover: #eef1f5;
  --acc-dim:   #8a9099;
  --acc-fill:  rgba(200, 205, 212, 0.10);  /* 选中行底色 */

  /* ── 语义状态（降饱和；血红只作错误信号，不铺大面）──────────────
     --bad 太暗不能作文字色，错误文案用 --bad-ink，边框/填充用 --bad。 */
  --ok:        #7d9b84;
  --warn:      #b3985a;
  --bad:       #6b2020;
  --bad-ink:   #c98080;
  --ok-fill:   rgba(125, 155, 132, 0.12);
  --warn-fill: rgba(179, 152, 90, 0.12);
  --bad-fill:  rgba(107, 32, 32, 0.16);

  /* ── 端口/类型色（节点图专用，仅连线与 3-4px 圆点；全部压成灰调）── */
  --t-model:   #8d84a0;   /* 模型 */
  --t-latent:  #a08489;   /* 潜空间 */
  --t-image:   #a09678;   /* 图像 */
  --t-number:  #7f948c;   /* 数值 */
  --t-text:    #84909f;   /* 文本 */

  /* ── 字号（正文小字号 + 松行高；碑铭标题另走 --serif 放大）────── */
  --fz-xs: 10.5px;
  --fz-s:  11.5px;
  --fz:    12.5px;
  --fz-l:  13.5px;
  --fz-xl: 15px;
  --lh:    1.6;

  /* ── 间距（4 的倍数）─────────────────────────────────────────── */
  --sp1: 4px;  --sp2: 8px;  --sp3: 12px;  --sp4: 16px;  --sp5: 24px;

  /* ── 圆角（玻璃 16 / 按钮与输入 12 / 小件 8）──────────────────── */
  --r:   8px;
  --r2:  12px;
  --r3:  16px;       /* 卡片 / 面板 / 弹窗 */
  --r-pill: 999px;   /* 只用于状态点、计数徽标 */

  /* ── 阴影与光：黑阴影托底 + 顶部内亮线；冷光只给 hover/焦点 ────── */
  --shadow-pop: 0 8px 32px rgba(0, 0, 0, 0.3);
  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --glow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 20px rgba(180, 200, 230, 0.15);
  --glow-soft: 0 0 20px rgba(180, 200, 230, 0.08);
  --glass: rgba(255, 255, 255, 0.06);   /* 导航/顶栏/侧栏的玻璃底 */

  /* ── 玻璃配方（通用类共用；移动端 --glass-blur 自动降档）───────── */
  --glass-blur: blur(20px) saturate(1.4);
  --glass-blur-lite: blur(12px) saturate(1.3);
  --glass-hover: rgba(255, 255, 255, 0.10);
  --glass-line-hover: rgba(255, 255, 255, 0.25);
  --glow-cool: rgba(180, 200, 230, 0.15);
  /* 环境光：玻璃必须「有东西可透」。0.16 的光晕压在 #08080a 上只剩 #1a1d24，
     肉眼等于平黑——玻璃层再正确也读不出来。这里提到 0.30/0.26，
     合成后左上≈#262d39（蓝灰）、右下≈#241f2c（紫灰），仍远低于卡片明度。 */
  --amb-blue: rgba(108, 132, 172, 0.30);   /* 左上蓝灰环境光 */
  --amb-purple: rgba(132, 112, 168, 0.26); /* 右下紫灰环境光 */
  --amb-core: rgba(226, 232, 240, 0.05);   /* 中景冷白核心光，给玻璃一层极淡的迎光面 */
  --vignette: radial-gradient(120% 92% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.55) 100%);
  --sheen: linear-gradient(158deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0) 46%);

  /* ── 动效（状态切换 90-140ms；入场与铸造加载走 --t-slow）───────── */
  --t-fast: 90ms;
  --t:      140ms;
  --t-slow: 320ms;
  --ease:   cubic-bezier(0.2, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  /* ── 过渡别名（迁移垫片，不是设计决策）───────────────────────── */
  --dim:   #7a8089;
  --dim2:  #565c66;
  --acc2:  #eef1f5;

  /* ── 字体 ─────────────────────────────────────────────────────
     数字一律 tabular-nums：参数面板全是会跳动的数字，等宽数字能避免整行抖动。 */
  --sans: -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC",
          "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  --serif: "Cinzel", "Palatino Linotype", "Book Antiqua", Georgia,
           "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
}

/* ── 基础层：七个界面共用的最小复位与排版基调 ───────────────────── */
/* 底：深黑 + 两团冷色径向光晕（左上蓝灰 / 右下紫灰）+ 中景冷白核光 + 边缘压暗。
   fixed 不随滚动漂移。光晕是玻璃的「景」——没有它们，blur 透出来的只是一片死黑。 */
html {
  background-color: var(--bg);
  background-image:
    radial-gradient(78% 62% at 6% -4%, var(--amb-blue) 0%, rgba(108, 132, 172, 0) 68%),
    radial-gradient(70% 58% at 104% 102%, var(--amb-purple) 0%, rgba(132, 112, 168, 0) 68%),
    radial-gradient(60% 46% at 50% 34%, var(--amb-core) 0%, rgba(226, 232, 240, 0) 70%),
    radial-gradient(120% 92% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.55) 100%);
  background-repeat: no-repeat;
  background-attachment: fixed;
}
body {
  background: transparent;
  color: var(--text);
  font: var(--fz)/var(--lh) var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
/* 胶片颗粒：极细噪点铺满视口，不拦截指针；4% 透明度只够"感觉到"不够"看到" */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.045;
  mix-blend-mode: overlay;
  background: url("../assets/grain.png") repeat;
  background-size: 160px 160px;
}

/* ── 通用玻璃类：组件直接挂类，配方只此一份 ─────────────────────── */
.glass-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 可交互玻璃卡：hover 提亮 + 上浮 3px + 冷光（风格卡/作品卡/模板卡） */
.glass-card.hoverable {
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.glass-card.hoverable:hover {
  background: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
.glass-btn {
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
              box-shadow var(--t) var(--ease), color var(--t) var(--ease);
}
.glass-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: var(--glass-line-hover);
  color: var(--acc-hover);
  box-shadow: 0 0 20px var(--glow-cool);
}
.glass-input {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease),
              background var(--t) var(--ease);
}
.glass-input:focus {
  outline: none;
  border-color: var(--glass-line-hover);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: var(--glow);
}
.glass-input::placeholder { color: var(--text-dim2); }

/* 移动端：blur 降到 12px，避免大面积毛玻璃拖垮帧率 */
@media (max-width: 900px) {
  :root { --glass-blur: blur(12px) saturate(1.3); }
}

/* 碑铭体：平台名、卡片标题、章节题字共用 */
.serif {
  font-family: var(--serif);
  letter-spacing: 0.14em;
  font-weight: 700;
}

/* 数字等宽：所有数值读数都用它 */
.num, kbd, code, .mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 焦点环：冷银描边 + 一圈极淡冷光，键盘可达 */
:focus-visible {
  outline: 1px solid var(--acc);
  outline-offset: 2px;
  box-shadow: 0 0 0 3px rgba(180, 200, 230, 0.12);
}

/* 滚动条：细、暗、玻璃亮线 thumb，hover 提亮；不用系统默认蓝条 */
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--line2); border-radius: var(--r); }
*::-webkit-scrollbar-thumb:hover { background: var(--acc-dim); }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-corner { background: transparent; }

/* 选区：银的低透明填充，不用系统蓝 */
::selection { background: var(--acc-fill); color: var(--acc-hover); }

/* ── 玻璃族第二批：弹窗 / 浮条 / 侧栏 / 凹槽 / 胶囊 ──────────────────
   同一套配方，只是圆角与投影档位不同。组件直接挂类，别再复写 blur。 */
.glass-modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
.glass-toast {
  background: var(--glass-hover);
  border: 1px solid var(--glass-line-hover);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
/* 悬浮工具条：画布顶部/参数板顶部那种横条，圆角 16 贴在内容之上 */
.glass-toolbar {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 侧栏 / 导航栏：从贴边条改成悬浮玻璃板（margin 16 + 圆角 16） */
.glass-rail {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 凹槽：画布底、代码块、时间轴这类「玻璃板里的暗面」，不铺毛玻璃 */
.glass-well {
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.glass-chip {
  background: var(--panel2);
  border: 1px solid var(--line2);
  border-radius: var(--r2);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
}

/* 玻璃卡顶部迎光：一层极淡的白到透明的斜向渐变，让平面看出弧面 */
.glass-card, .glass-modal, .glass-rail, .panel {
  background-image: var(--sheen);
  background-repeat: no-repeat;
}

/* ── 无 backdrop-filter 的浏览器：把膜加厚一档，至少不塌成纯黑 ──────── */
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass-card, .glass-modal, .glass-rail, .glass-toolbar { background-color: rgba(255, 255, 255, 0.10); }
  .glass-toast { background-color: rgba(255, 255, 255, 0.14); }
}

/* ── 移动端：blur 降到 12px；小控件直接关掉毛玻璃，省一次合成 ────────── */
@media (max-width: 900px) {
  :root { --glass-blur: blur(12px) saturate(1.3); }
  .glass-btn, .glass-chip, .glass-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background-color: rgba(255, 255, 255, 0.09);
  }
}

/* ── 尊重系统设置：减少动效 / 减少透明 ─────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .glass-card.hoverable:hover, .glass-btn:hover { transform: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .glass-card, .glass-modal, .glass-rail, .glass-toolbar, .glass-toast, .glass-chip, .glass-btn, .glass-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background-color: rgba(24, 26, 30, 0.92);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   module-ui.css —— 功能模块入口的共享骨架
   ───────────────────────────────────────────────────────────────────────
   定位：market / plugins / quality / server 四个入口共用同一套外壳结构
   （顶栏 / 左列表 / 右详情 / 底部口径条），差异只在中间的「内容形态」。

   视觉人格：暗黑玻璃拟态 · 冷银基调（ui/tokens.css 为唯一令牌源）。
     - 顶栏 / 侧栏 / 详情区头 / 底部口径条：四块悬浮玻璃板，统一 margin 16 + 圆角 16 + blur 20
     - 侧栏：#08080a 上的半透明白膜（.body > .aside，比 skin 的 .aside 高一级）
     - 选中态：左侧 2px 冷银竖线 + 一圈冷银亮边，不做亮色填充、不引入彩色
     - 按钮：玻璃底 rgba(255,255,255,.1) + 1px 亮边 + 冷白字，圆角 12；输入框圆角 16
     - 卡片：.06 白膜 + 0 8px 32px rgba(0,0,0,.3) + inset 0 1px 0 rgba(255,255,255,.08)
     - 凹槽：标签页与代码/日志块走 .glass-well 口径（bg-deep + 内描边，不铺毛玻璃）
     - 卡片标题：碑铭衬线（--serif）宽字距；表格行 hover 只提亮、不位移

   规矩（与 docs/09-design-system.md 一致，lint 会拦）：
     - 只用 ui/tokens.css 的变量，不新增色值
     - 圆角只走 --r / --r2 / --r3 / --r-pill（卡片上限 16px）
     - 光晕只给冷色（--glow / --glow-soft / --glow-cool），投影只给中性黑
   ═══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: transparent; color: var(--text); font: var(--fz)/var(--lh) var(--sans); }
a { color: var(--acc); text-decoration: none; }
a:hover { color: var(--acc-hover); }

/* ── 页面骨架：悬浮玻璃顶栏 + 主体 + 口径条 24 ───────────────────── */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr) 24px; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: var(--sp3);
  margin: var(--sp4) var(--sp4) 0; min-height: 38px;
  padding: 0 var(--sp3);
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line); border-radius: var(--r3);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
  position: relative; z-index: 5;
}
.topbar .brand { display: flex; align-items: baseline; gap: var(--sp2); }
.topbar .brand b {
  font-family: var(--serif); font-size: var(--fz-l); font-weight: 700;
  letter-spacing: 0.18em; color: var(--acc);
}
.topbar .brand span { font-size: var(--fz-xs); color: var(--text-dim2); letter-spacing: 0.08em; }
.topbar .spacer { flex: 1; }
.topbar .crumbs { font-size: var(--fz-s); color: var(--text-dim); }
.topbar .crumbs i { color: var(--text-dim2); font-style: normal; padding: 0 var(--sp1); }

.body { display: grid; grid-template-columns: var(--col, 320px) minmax(0, 1fr); min-height: 0; }
.body.no-aside { grid-template-columns: minmax(0, 1fr); }

/* 侧栏：贴边条 → 悬浮玻璃板（margin 16 / 圆角 16 / blur 20 / 边框 rgba(255,255,255,.12)）。
   选择器写在 .body > .aside：glass-skin.css 里 .aside 只留膜（background-color: transparent，
   玻璃底色交给页面），这里比它高一级，底色与迎光面由骨架自己给，两边不互相覆盖。 */
.body > .aside {
  display: flex; flex-direction: column; min-height: 0;
  margin: var(--sp4) 0 var(--sp4) var(--sp4);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  background-color: var(--glass);
  background-image: var(--sheen);
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
  overflow: hidden;   /* 内部滚到底也不露直角 */
}
.aside-h {
  display: flex; align-items: center; gap: var(--sp2); height: 28px; padding: 0 var(--sp2);
  border-bottom: 1px solid var(--line); font-size: var(--fz-xs); color: var(--text-dim);
  letter-spacing: 0.12em; flex: 0 0 auto;
}
.aside-h .spacer { flex: 1; }
.aside-b { flex: 1; min-height: 0; overflow: auto; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: transparent; }
/* 详情区头：悬浮玻璃条，与左栏板同一条基线（左 16 / 上 16），下沿不画分隔线 */
.main-h {
  display: flex; align-items: center; gap: var(--sp2);
  margin: var(--sp4) var(--sp4) 0;
  padding: var(--sp2) var(--sp3); min-height: 34px; flex: 0 0 auto;
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--glass);
  background-image: var(--sheen);
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
.main-h h2 {
  margin: 0; font-family: var(--serif); font-size: var(--fz-l); font-weight: 700;
  letter-spacing: 0.12em; color: var(--acc);
}
.main-h .sub { font-size: var(--fz-xs); color: var(--text-dim); }
.main-h .spacer { flex: 1; }
.main-b { flex: 1; min-height: 0; overflow: auto; padding: var(--sp3) var(--sp4); }
/* 底部口径条：悬浮玻璃条（统计/说明常驻在这里），左右与主体内容同一列线 */
.main-f {
  flex: 0 0 auto; margin: var(--sp3) var(--sp4) var(--sp4);
  padding: var(--sp2) var(--sp3); font-size: var(--fz-xs); color: var(--text-dim);
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--glass);
  background-image: var(--sheen);
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}

/* 全平台口径条（最底一行）：细玻璃条，不做大圆角，只提亮到膜上 */
.statusbar {
  display: flex; align-items: center; gap: var(--sp3); padding: 0 var(--sp4);
  background-color: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  border-top: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  font-size: var(--fz-xs); color: var(--text-dim2);
}
.statusbar .spacer { flex: 1; }
.statusbar .num { color: var(--text-dim); }

/* ── 列表行（左栏主力形态）───────────────────────────────────────── */
.list { display: flex; flex-direction: column; }
.list .row {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto;
  align-items: center; gap: var(--sp2);
  padding: 0 var(--sp2); min-height: 28px; cursor: pointer;
  border-bottom: 1px solid var(--line); color: var(--text);
  transition: background var(--t-fast) var(--ease);
}
.list .row:hover { background: var(--panel3); }
/* 选中 = 左 2px 冷银竖线 + 一圈冷银亮边 + 极淡银底；全程冷银，不用任何彩色 */
.list .row[aria-selected="true"] {
  background: var(--acc-fill);
  box-shadow: inset 2px 0 0 var(--acc), inset 0 0 0 1px var(--glass-line-hover);
  color: var(--acc-hover);
}
.list .row[aria-selected="true"]:hover { background: var(--panel3); }
.list .row .t { font-size: var(--fz); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .row .s { font-size: var(--fz-xs); color: var(--text-dim2); }
.list .row .ico { display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
.list .row[aria-selected="true"] .ico { color: var(--acc); }
.list .sect {
  padding: var(--sp2) var(--sp2) var(--sp1); font-size: var(--fz-xs); color: var(--text-dim2);
  letter-spacing: 0.12em; border-bottom: 1px solid var(--line); background: transparent;
}
.list .empty-row { padding: var(--sp3); color: var(--text-dim2); font-size: var(--fz-s); }

/* ── 徽标与状态点 ────────────────────────────────────────────────── */
.dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--text-dim2); flex: 0 0 auto; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.dot.acc { background: var(--acc); }
.dot.off { background: var(--line2); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 17px; padding: 0 6px;
  border: 1px solid var(--line2); border-radius: var(--r); background: var(--panel2);
  font-size: var(--fz-xs); color: var(--text-dim); white-space: nowrap;
}
.badge.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-fill); }
.badge.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-fill); }
.badge.bad { border-color: var(--bad); color: var(--bad-ink); background: var(--bad-fill); }
.badge.acc { border-color: var(--acc-dim); color: var(--acc); background: var(--acc-fill); }
.badge.pill { border-radius: var(--r-pill); }

/* ── 按钮：玻璃底 + 1px 亮边 + 冷白字；hover 提亮泛冷光 ───────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 26px; padding: 0 11px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line); border-radius: var(--r2); background: rgba(255, 255, 255, 0.10);
  color: var(--text); font: var(--fz-s)/1 var(--sans); letter-spacing: 0.06em;
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              box-shadow var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.btn:hover { background: rgba(255, 255, 255, 0.14); border-color: var(--glass-line-hover); color: var(--acc-hover); box-shadow: 0 0 20px var(--glow-cool); }
.btn:active { background: var(--panel4); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
/* 主操作：不是实心色块，而是亮边更亮一档的玻璃碑牌 */
.btn.acc { background: var(--panel3); border-color: var(--acc-dim); color: var(--acc-hover); letter-spacing: 0.12em; }
.btn.acc:hover { background: var(--panel4); border-color: var(--acc-hover); box-shadow: var(--glow); }
.btn.mini { height: 21px; padding: 0 7px; font-size: var(--fz-xs); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); -webkit-backdrop-filter: none; backdrop-filter: none; }
.btn.ghost:hover { background: var(--panel3); color: var(--text); box-shadow: none; }

/* ── 表单：膜内凹槽 + 1px 亮边；圆角 16（按钮 12，两者别混）────────── */
.input, .select, .textarea {
  height: 26px; padding: 0 8px; color: var(--text);
  background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r3);
  font: var(--fz-s)/1 var(--sans); outline: none;
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.textarea { height: auto; padding: 5px 6px; font-family: var(--mono); resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--acc-hover); box-shadow: var(--glow); }
.input::placeholder { color: var(--text-dim2); }
label.field { display: flex; flex-direction: column; gap: var(--sp1); font-size: var(--fz-xs); color: var(--text-dim); }

/* ── 键值对 / 表格 ───────────────────────────────────────────────── */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px var(--sp3); font-size: var(--fz-s); }
.kv dt { color: var(--text-dim); }
.kv dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.kv dd.num { color: var(--text); }

.tbl { width: 100%; border-collapse: collapse; font-size: var(--fz-s); }
.tbl th, .tbl td { text-align: left; padding: 0 var(--sp2); height: 26px; border-bottom: 1px solid var(--line); }
/* 行 hover 只提亮膜内底色：行高/padding/transform 一律不动，258 行才不抖 */
.tbl td { transition: background-color var(--t-fast) var(--ease); }
.tbl th { color: var(--text-dim); font-weight: 500; font-size: var(--fz-xs); letter-spacing: 0.08em; background: var(--panel2); }
.tbl tr:hover td { background-color: var(--glass-hover); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.mono { font-family: var(--mono); font-size: var(--fz-xs); color: var(--text-dim); }

/* ── 面板 / 卡片：半透明白 .06 + 1px 冷灰边 + 0 8px 32px rgba(0,0,0,.3)
      + inset 0 1px 0 rgba(255,255,255,.08)。四行数值全部来自令牌：
      --panel / --line / --shadow-pop / --shadow-inset，改令牌即全站生效。 */
.panel {
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--panel);
  background-image: var(--sheen);   /* 顶部迎光斜向渐变：平面看出弧面 */
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 网格里的卡片才上浮（市场概览卡 / 服务面板）；整幅区块例如 quality 的检查项不动，
   否则鼠标划过正文时整块跳动。hover 只加 background-color，保住迎光面。 */
.grid2 > .panel, .grid3 > .panel {
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.grid2 > .panel:hover, .grid3 > .panel:hover {
  background-color: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
.panel + .panel { margin-top: var(--sp3); }
.panel-h {
  display: flex; align-items: center; gap: var(--sp2); height: 28px; padding: 0 var(--sp2);
  border-bottom: 1px solid var(--line); font-size: var(--fz-xs); color: var(--text-dim); letter-spacing: 0.12em;
}
.panel-h .spacer { flex: 1; }
.panel-b { padding: var(--sp3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp3); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp3); }
@media (max-width: 1100px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* ── 空态与提示 ──────────────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp2);
  padding: var(--sp4); border: 1px dashed var(--line2); border-radius: var(--r3);
  color: var(--text-dim); font-size: var(--fz-s); background: var(--panel);
}
.empty b { color: var(--text); font-weight: 600; }
.hint { font-size: var(--fz-xs); color: var(--text-dim2); }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }

/* ── 标签页（详情区切换）：膜内凹槽 + 分段胶囊，不画底线（避免与凹槽边框叠成双线）── */
.tabs {
  display: flex; align-items: center; gap: 2px;
  margin: var(--sp3) var(--sp4) 0; padding: 3px;
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--bg-deep);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.tabs .tab {
  height: 24px; padding: 0 var(--sp3); cursor: pointer; border: 0; border-radius: var(--r2);
  background: transparent; color: var(--text-dim);
  font: var(--fz-s)/1 var(--sans); letter-spacing: 0.06em;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.tabs .tab:hover { color: var(--text); background-color: var(--panel2); }
.tabs .tab[aria-selected="true"] {
  color: var(--acc-hover); background-color: var(--panel3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* ── 进度条（银条；只做状态显示）────────────────────────────────── */
.bar { height: 4px; background: var(--panel4); border-radius: var(--r); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc); }
.bar.ok > i { background: var(--ok); }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }

/* ── 代码/日志块：.glass-well 口径（膜内凹槽，不铺毛玻璃）──────────────
   长文本上再叠一层 backdrop-filter 是纯浪费帧率，凹槽靠 bg-deep + 内描边成像。 */
.code {
  margin: 0; padding: var(--sp2);
  background-color: var(--bg-deep);
  border: 1px solid var(--line); border-radius: var(--r2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  font-family: var(--mono); font-size: var(--fz-xs);
  color: var(--text-dim); overflow: auto; max-height: 220px; white-space: pre-wrap; word-break: break-all;
}
.code .k { color: var(--t-text); }
.code .ok { color: var(--ok); }
.code .bad { color: var(--bad-ink); }

/* ── 窄屏（≤900px）：悬浮板全部取消外边距、贴边全宽，卡片不再上浮 ─────
   blur 的降档在 tokens.css 的 @media (max-width:900px) 里（--glass-blur →
   blur(12px)），骨架一律引用 var(--glass-blur)，所以这里不用再写一遍 blur。 */
@media (max-width: 900px) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .body > .aside {
    margin: 0; border-width: 0 0 1px; border-radius: 0; box-shadow: none;
    max-height: 42vh;   /* 侧栏变成顶部条带，内部照旧滚动 */
  }
  .topbar { margin: var(--sp2) 0 0; border-width: 0 0 1px; border-radius: 0; }
  .main-h { margin: var(--sp2) 0 0; border-width: 0 0 1px; border-radius: 0; box-shadow: none; }
  .main-b { padding: var(--sp3); }
  .main-f { margin: 0; border-width: 1px 0 0; border-radius: 0; box-shadow: none; }
  .statusbar { padding: 0 var(--sp3); }
  .tabs { margin: var(--sp2) 0 0; border-width: 0 0 1px; border-radius: 0; }
  .grid2, .grid3 { gap: var(--sp2); }
  /* 卡片不再上浮：hover 只提亮，位移与冷光一起收掉 */
  .grid2 > .panel:hover, .grid3 > .panel:hover {
    transform: none;
    box-shadow: var(--shadow-pop), var(--shadow-inset);
  }
}
/* ═══════════════════════════════════════════════════════════════════════
   glass-skin.css —— 玻璃映射层（最后一遍）
   ───────────────────────────────────────────────────────────────────────
   定位：ui/tokens.css 定义「玻璃是什么」，本文件负责「把各页已经写好的
   组件选择器映射到那套配方上」。页面源件里只留自己的结构与排版，不再各写
   一份 background/border/blur/shadow。

   为什么单独一层而不是逐组件改：
     七个页面 + 帧检视器共 543KB 源，卡片族有 40 多个类名，逐个改一遍既容易
     漏、又会在下一次改令牌时全部失配。映射层只做增量：圆角补齐、hover 三件套、
     侧栏悬浮、弹窗居中、控件玻璃化。谁想加新卡片，挂 .glass-card 即可。

   注入位置：每个页面 <style> 的最后一行（构建期替换 /*__SKIN__*\/）。
     放在最后 = 同权重规则里一定赢，所以整份文件不需要一个 !important。

   三条规矩：
     1. 只写「页面自己的类名 → 玻璃配方」，不新增色值，全部走 var()。
     2. 不改布局栅格（列宽/行高/顺序由各页自持）；只加外边距让它浮起来。
     3. 循环动画、彩色光晕、纯白文字一律不写（tools/lint_ui.mjs 会拦）。
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 1. 悬浮侧栏：贴边条 → 悬浮玻璃板（margin 16 / 圆角 16 / blur 20）── */
#sidenav,
nav#rail,
#pRail,
aside,
.aside {
  margin: var(--sp4) 0 var(--sp4) var(--sp4);
  border: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-radius: var(--r3);
  background-color: var(--glass);      /* 膜必须由本层给：页面侧多为 transparent，靠 skin 兜底 */
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 侧栏内部滚到底时的圆角不露直角 */
#sidenav, nav#rail, #pRail, aside { overflow-y: auto; }

/* ── 2. 圆角补齐：还停在 12px 的卡片族一律抬到 16px ───────────────── */
.card,
.style-card,
.ai-card,
.gen-card,
.work-item,
.opt,
.honest,
.summary,
.reco,
.prow,
.np-row,
.legend,
.tip,
#toast,
.toast,
.loaded,
.errcard,
.svc,
.node,
.wp,
.stage-chip,
.field,
.empty {
  border-radius: var(--r3);
}

/* 输入框：规范要求 16px（按钮 12px，别混） */
select,
input[type="text"],
input[type="search"],
input[type="number"],
input[type="password"],
input[type="url"],
textarea {
  border-radius: var(--r3);
}

/* ── 3. hover 三件套：提亮 + 亮边 + 上浮 3px + 一圈冷光 ────────────── */
.card,
.style-card,
.work-item,
.opt,
.np-row,
.loaded {
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.card:hover,
.style-card:hover,
.work-item:hover,
.opt:hover,
.np-row:hover,
.loaded:hover {
  background-color: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);

.summary,

.honest:hover,
.summary:hover,
.svc:hover {
  background-color: var(--glass-hover);
  border-color: var(--glass-line-hover);
}

/* 列表行 / 参数行：只在膜内提亮，不上浮（上浮会让 258 行变成果冻） */
.row:hover,
.list .row:hover,
.prow:hover,
.tier-head:hover,
.wstep:hover,
.rail-item:hover,
.nav-item:hover,
.wi-acts:hover {
  background-color: var(--glass-hover);
}

/* ── 4. 悬浮工具条 / 弹窗 / Toast ─────────────────────────────────── */
/* 画布顶部与参数板顶部的横条：同一条玻璃，圆角 16 */
#canvasTop,
.canvas-tools,
.toolbar,
.board-head,
.main-h,
.viewhead {
  border-radius: var(--r3);
}
#canvasTop,
.canvas-tools,
.toolbar {
  background-color: var(--glass);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}

/* 弹窗：居中 + 玻璃 + 16px；遮罩压暗但不铺纯黑 */
.wiz,
.modal,
.dialog,
.panel-pop {
  background-color: var(--panel);
  background-image: var(--sheen);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 弹层遮罩只负责压暗与居中，毛玻璃档位交给页面自己（app 用 10px）。
   这里若再写一份 blur(2px)，同权重且 skin 在后，会把页面的遮罩糊没了。 */
#wizard,
#forgeOverlay {
  display: grid;
  place-items: center;
}

/* Toast：玻璃胶囊，居中偏下 */
#toast,
.toast {
  background-color: var(--glass-hover);
  border: 1px solid var(--glass-line-hover);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}

/* ── 5. 画布：区域是深色凹槽，节点与属性面板是玻璃 ────────────────── */
#nodeWrap {
  margin: 0 var(--sp4) var(--sp4);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  background-color: var(--bg-deep);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  overflow: hidden;
}
#nodeWrap .legend,
#nodeWrap .node,
#estimator {
  background-color: var(--panel);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
#nodeWrap .node:hover {
  border-color: var(--glass-line-hover);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);

/* ── 6. 表单控件：滑块轨道是膜内凹槽，拇指是一颗冷银 ─────────────── */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  height: 18px;
  background: transparent;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--panel4);
  box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.35);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px; height: 13px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--acc);
  border: 1px solid var(--acc-hover);
  box-shadow: 0 0 10px var(--glow-cool);
  transition: background-color var(--t) var(--ease), box-shadow var(--t) var(--ease);

input[type="range"]:hover::-webkit-slider-thumb { background: var(--acc-hover); }
input[type="range"]::-moz-range-track {

}
input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--acc); border: 1px solid var(--acc-hover);
}

/* ── 7. 细节：风格图标去彩（emoji 只作字形，不作彩色贴纸）─────────── */
.sc-emoji,
.wi-emoji,
.style-ico {
  filter: grayscale(0.72) contrast(0.94);
  opacity: 0.92;

/* 底部口径条 / 状态栏：细玻璃条，不做大圆角 */
#statusbar,
.statusbar,
footer {

}

/* 代码块 / 日志：膜内凹槽，别铺毛玻璃（长文本 blur 很贵） */
.code,
pre,
.gout {
  background-color: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r2);

/* ── 8. 窄屏：侧栏取消外边距，改为贴边全宽；卡片不再上浮 ─────────── */

.dir-diff { color: var(--text-dim); }

.tab-note { margin: 0 0 var(--sp2); display: flex; gap: var(--sp2); align-items: baseline; flex-wrap: wrap; }
.code.mk-raw { max-height: none; }

    }
    var tagChips = (t.tags && t.tags.length)
      ? '<span class="chips">' + t.tags.map(function (x) { return '<span class="badge">' + esc(x) + '</span>'; }).join('') + '</span>'
      : '<span class="hint">无标签</span>';
    var basic = kv([
      ['名称', esc(t.name)],
      ['版本', 'v' + esc(t.version)],
      ['作者', esc(t.author || '未署名')],
      ['许可', esc(LICENSE_CN[t.license] || t.license || '—') + ' <span class="hint">' + esc(t.license || '') + '</span>'],
      ['标签', tagChips + ' <span class="hint">共 ' + num(t.tags ? t.tags.length : 0) + ' 个</span>'],
      ['创建时间', '<span title="' + esc(t.created) + '">' + esc(dayStr(t.created)) + '</span>'],
      ['包文件', '<span class="mono">' + esc(t.file) + '</span>'],
      ['包体积', '<span class="num">' + esc(bytes(t.size_bytes)) + '</span>'],
      ['checksum', '<span class="mono">' + esc(t.checksum) + '</span>']
    ]) + '<div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="hint">板块主张</span>' +
      '<span class="chips">' + stageChips + '</span></div>';

    /* 2. 兼容性 */
    var compat = t.compat || {};
    var sameReg = compat.registry_version === regVer;
    var overTested = compat.max_tested && regVer && cmpVer(regVer, compat.max_tested) > 0;
    var compatBody = kv([
      ['引擎平台', '<span class="mono">' + esc(compat.platform || '—') + '</span>'],
      ['打包注册表', '<span class="mono">' + esc(compat.registry_version || '—') + '</span>'],
      ['当前注册表', '<span class="mono">' + esc(regVer || '—') + '</span>'],
      ['最低平台', '<span class="mono">' + esc(compat.min_platform || '—') + '</span>'],
      ['实测上限', '<span class="mono">' + esc(compat.max_tested || '—') + '</span>']
    ]) + '<div class="chips" style="margin-top:8px">' +
      (sameReg ? badge('ok', '注册表版本一致', true) : badge('bad', '注册表版本不一致：安装会被 verify 拒绝', true)) +
      (overTested ? badge('warn', '当前平台高于作者实测版本，可用但需复核估算', true) : '') +
      '</div>';

    /* 3. 定价 */
    var pr = t.pricing || {};
    var share = pr.share ? ('作者 ' + num(pr.share.creator_pct) + '% / 平台 ' + num(pr.share.platform_pct) + '%') : '—';
    var priceBody = kv([
      ['模式', esc(LICENSE_CN[pr.mode] || pr.mode || '—') + ' <span class="hint">' + esc(pr.mode || '') + '</span>'],
      ['自报价', pr.price_cny === null || pr.price_cny === undefined ? '—' : '<span class="num">' + num(pr.price_cny) + '</span> <span class="hint">元</span>'],
      ['质量分档', esc(pr.band || '—') + ' <span class="hint">质量分 ' + num(pr.rule_quality) + ' · 档上限 ' + num(pr.band_max) + ' · 档基价 ' + num(pr.band_price) + ' 元</span>'],
      ['规则建议', pr.suggestion ? ('<span class="num">' + num(pr.suggestion.price_cny) + '</span> <span class="hint">元（pack.suggestPrice 现算）</span>') : '—'],
      ['分成', esc(share)]
    ]) + (pr.basis ? '<div class="hint" style="margin-top:6px">分成基数：' + esc(pr.basis) + '</div>' : '') +
      '<div class="chips" style="margin-top:8px">' +
      (pr.matches_rule ? badge('ok', '自报价与定价规则一致', true) : badge('warn', '自报价与规则建议不同（以包内报价为准）', true)) +
      '</div>';

    /* 4. 签名 */
    var sig = t.signature || {};
    var v = sig.verify || { ok: false, reason: 'unknown' };
    var sigState = !sig.present ? badge('warn', '未签名', true) : (v.ok ? badge('ok', '摘要一致', true) : badge('bad', '验签未通过', true));
    var sigBody = '<div class="sig-line">' + sigState + '<span class="hint">' + esc(sig.reason_text || '') + '</span></div>' +
      kv([
        ['算法', '<span class="mono">' + esc(sig.algo || '—') + '</span>'],
        ['key_id', '<span class="mono">' + esc(sig.key_id || '—') + '</span>'],
        ['签名时间', esc(dayStr(sig.signed_at))],
        ['签发声明', '<span class="mono">' + esc(sig.issuer || '—') + '</span>'],
        ['密钥来源', esc(sig.secret_source || '仓库里没有可用密钥')]
      ]) +
      '<div class="hint" style="margin-top:6px">验签只证明「文件内容与签名时的内容逐字节一致」，不证明签发方身份：演示密钥写在仓库里，谁都能重签。</div>';

    /* 5. 血缘 */
    var lin = t.lineage || {};
    var from = lin.resolved || [];
    var linHtml;
    if (!from.length) {
      linHtml = '<div class="hint">derived_from 为空 —— 没有上游模板，按原创处理。</div>';
    } else {
      linHtml = '<div class="chips">';
      for (var d = 0; d < from.length; d++) {
        linHtml += '<span class="badge">' + esc(from[d].id) + (from[d].name ? '<i class="hint"> · ' + esc(from[d].name) + '</i>' : '<i class="hint"> · 本地快照无此包</i>') + '</span>';
      }
      linHtml += '</div>';
    }
    var lineageBody = linHtml + kv([
      ['parent_checksum', '<span class="mono">' + esc(lin.parent_checksum || 'null') + '</span>'],
      ['origin', '<span class="mono">' + esc(lin.origin || '—') + '</span>']
    ]);

    /* 6. 估算 */
    var em = t.estimate_meta || null;
    var devName = em ? em.device : '—';
    if (em && state.snap && state.snap.devices) {
      for (var q = 0; q < state.snap.devices.length; q++) if (state.snap.devices[q].id === em.device) devName = em.device + ' · ' + state.snap.devices[q].name;
    }
    var estBody = em ? (kv([
      ['设备档', esc(devName)],
      ['峰值显存', '<span class="num">' + miB(em.peak_mib) + '</span> <span class="hint">/ ' + miB(em.usable_mib) + ' 可用</span>'],
      ['占用比', '<span class="num">' + (em.ratio * 100).toFixed(1) + '%</span>'],
      ['显存档位', esc(STATE_CN[em.state] || em.state) + ' <span class="hint">' + esc(em.state) + '</span>'],
      ['主导板块', '<span class="mono">' + esc(stageNames[em.dominant] ? stageNames[em.dominant].name : em.dominant) + '</span>'],
      ['单格耗时', '<span class="num">' + esc(secs(em.shot_sec)) + '</span>'],
      ['单集耗时', '<span class="num">' + esc(secs(em.episode_sec)) + '</span>'],
      ['质量分', '<span class="num">' + num(em.quality) + '</span>'],
      ['单集成本', '<span class="num">' + num(em.cost_episode_yuan, 3) + '</span> <span class="hint">元</span>']
    ]) + '<div class="hint" style="margin-top:6px">数字来自打包时的 engine.estimate 快照，本页不重算。</div>')
      : '<div class="hint">包内没有 estimate_meta：市场列表无法直接显示显存与耗时。</div>';

    /* 7. 仓库状态 */
    var st = t.store || {};
    var repoBody = kv([
      ['安装量', '<span class="num">' + num(st.installs) + '</span>'],
      ['仓库评分', '<span class="num">' + num(st.rating ? st.rating.avg : 0, 1) + '</span> <span class="hint">分 · ' + num(st.rating ? st.rating.count : 0) + ' 人</span>'],
      ['排名分', '<span class="num">' + num(st.rank, 2) + '</span>'],
      ['索引记录', st.in_repo ? '<span class="mono">' + esc(st.file || '—') + '</span>' : '<span class="hint">索引里没有这条（安装量按 0 计）</span>'],
      ['最后更新', esc(dayStr(st.updated_at))]
    ]);

    /* 8. 结构校验 */
    var pv = t.pack_verify || { ok: false, errors: [], warnings: [] };
    var pvChips = '';
    for (var e = 0; e < (pv.errors || []).length; e++) pvChips += badge('bad', esc(pv.errors[e]), false);
    for (var w2 = 0; w2 < (pv.warnings || []).length; w2++) pvChips += badge('warn', esc(pv.warnings[w2]), false);
    var pvBody = '<div class="sig-line">' +
      (pv.ok ? badge('ok', 'pack.verify 通过', true) : badge('bad', 'pack.verify 未通过', true)) +
      '<span class="hint">结构 / registry 版本 / checksum / 值域 / 定价自洽，五项一起判</span></div>' +
      '<div class="chips" style="margin-top:8px">' + (pvChips || '<span class="hint">无告警</span>') + '</div>';

    return '<div class="grid2">' +
      panel('基本信息', badge('acc', 'id ' + esc(t.id)), basic) +
      panel('兼容性', '', compatBody) +
      panel('定价', esc(pr.mode || ''), priceBody) +
      panel('签名', '', sigBody) +
      panel('血缘', '', lineageBody) +
      panel('估算', '', estBody) +
      panel('仓库状态', '', repoBody) +
      panel('结构校验', '', pvBody) +
      '</div>';
  }

  function cmpVer(a, b) {
    var pa = String(a || '0.0.0').split('.'), pb = String(b || '0.0.0').split('.');
    for (var i = 0; i < 3; i++) {
      var x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x !== y) return x > y ? 1 : -1;
    }
    return 0;
  }

  /* ── 覆盖参数页 ─────────────────────────────────────────────────────── */
  function paramVal(v, isNum) {
    var cls = 'v' + (isNum ? ' num' : '');
    var text;
    if (typeof v === 'boolean') text = v ? 'true' : 'false';
    else if (v === null || v === undefined) text = '—';
    else text = String(v);
    var longCls = text.length > 34 ? ' long' : '';
    var shown = esc(clip(text, 90));
    return '<td class="' + cls + longCls + '" title="' + esc(text) + '">' + shown + '</td>';
  }

  function paramsHtml(t) {
    var rows = t.coverage || [];
    var coverCount = 0;
    for (var i = 0; i < rows.length; i++) if (rows[i].is_cover) coverCount++;
    var note = '<div class="tab-note"><span class="hint">values 共 <span class="num">' + rows.length + '</span> 条差异 · 其中 cover_params <span class="num">' + coverCount + '</span> 条（底色标出）</span>' +
      '<span class="hint">↑ 表示模板值高于注册表默认，↓ 表示低于，≠ 表示枚举/文本不同，相同表示与默认一致</span></div>';

    if (!rows.length) {
      return note + '<div class="empty"><b>这个模板没有参数差异</b><span>包内 values 为空，等同默认参数，列表里看不出卖点。</span></div>';
    }
    var html = note + '<table class="tbl mk-params"><thead><tr>' +
      '<th class="c-key">参数 key</th><th class="c-name">中文名</th><th class="c-stage">板块</th>' +
      '<th class="c-val">模板值</th><th class="c-def">注册表默认</th><th class="c-dir">差异</th></tr></thead><tbody>';
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var keyCell = '<td class="v"><span class="k">' + esc(row.key) + '</span>' +
        (row.is_cover ? '<span class="badge acc cover-mark">封面</span>' : '') + '</td>';
      var nameCell = '<td class="v">' + (row.in_registry ? esc(row.label || '—') : '<span class="dir-noreg">注册表未收录</span>') + '</td>';
      var stageCell = '<td class="v">' + (row.stage_name ? esc(row.stage_name) : '<span class="hint">—</span>') + '</td>';
      var t1 = paramVal(row.tpl, typeof row.tpl === 'number');
      var t2 = row.in_registry ? paramVal(row.def, typeof row.def === 'number') : '<td class="v hint">无默认值</td>';
      var dirCell = '<td class="v"><span class="' + (DIR_CLS[row.dir] || '') + '">' + esc(DIR_CN[row.dir] || row.dir) + '</span></td>';
      html += '<tr class="' + (row.is_cover ? 'is-cover' : '') + '">' + keyCell + nameCell + stageCell + t1 + t2 + dirCell + '</tr>';
    }
    html += '</tbody></table>';

    var miss = t.cover_params_missing || [];
    if (miss.length) {
      html += '<div class="hint" style="margin-top:8px">cover_params 里有 ' + miss.length + ' 条没出现在 values（与默认值相同，卡片上看不出差异）：' +
        miss.map(function (m) { return '<span class="mono">' + esc(m.key) + '</span>'; }).join('、') + '</div>';
    }
    return html;
  }

  /* ── 原始包页 ───────────────────────────────────────────────────────── */
  function rawHtml(t) {
    var note = '<div class="tab-note"><span class="hint">' + esc(t.file) + ' · 原文 <span class="num">' + num(t.manifest_chars) + '</span> 字符' +
      (t.manifest_truncated ? ' · <b>已截断</b>到前 5200 字符（完整正文见文件本身）' : ' · 未截断，全文照贴') + '</span></div>';
    return note + '<pre class="code mk-raw">' + esc(t.manifest_json || '') + '</pre>';
  }

  /* ── 详情渲染 ───────────────────────────────────────────────────────── */
  function renderDetail() {
    var body = document.getElementById('tabBody');
    var t = selected();
    if (!t) {
      body.innerHTML = state.templates.length ? '<div class="empty"><b>没有选中模板</b><span>左栏点一行即可。</span></div>' : emptySnapshotHtml();
      return;
    }
    if (t.error) {
      body.innerHTML = '<div class="empty"><b>这个包没能解析</b><span class="mono">' + esc(t.file) + '</span><span>' + esc(t.error) + '</span>' +
        '<span>重新跑 <span class="mono">node tools/snap_market.mjs</span> 看具体报错。</span></div>';
      return;
    }
    if (state.tab === 'params') body.innerHTML = paramsHtml(t);
    else if (state.tab === 'raw') body.innerHTML = rawHtml(t);
    else body.innerHTML = overviewHtml(t);
  }

  function renderTabs() {
    var tabs = document.querySelectorAll('#tabBar .tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-selected', tabs[i].getAttribute('data-tab') === state.tab ? 'true' : 'false');
    }
  }

  function renderAll() {
    renderChrome();
    renderHead();
    renderList();
    renderTabs();
    renderDetail();
    renderStars();
  }

  /* ── 交互 ───────────────────────────────────────────────────────────── */
  function select(id) {
    state.selected = id;
    renderHead();
    renderList();
    renderDetail();
    renderStars();
  }

  document.getElementById('listBox').addEventListener('click', function (ev) {
    var row = ev.target;
    while (row && row !== this && !(row.getAttribute && row.getAttribute('data-id'))) row = row.parentNode;
    if (row && row.getAttribute && row.getAttribute('data-id')) select(row.getAttribute('data-id'));
  });
  document.getElementById('listBox').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var row = ev.target;
    if (!row || !row.getAttribute || !row.getAttribute('data-id')) return;
    ev.preventDefault();
    select(row.getAttribute('data-id'));
  });

  document.getElementById('tabBar').addEventListener('click', function (ev) {
    var b = ev.target;
    while (b && b !== this && !(b.getAttribute && b.getAttribute('data-tab'))) b = b.parentNode;
    if (!b || !b.getAttribute) return;
    var tab = b.getAttribute('data-tab');
    if (!tab) return;
    state.tab = tab;
    renderTabs();
    renderDetail();
  });

  document.getElementById('mainHead').addEventListener('click', function (ev) {
    var b = ev.target;
    while (b && b !== this && b.id !== 'btnInstall') b = b.parentNode;
    if (!b || b.id !== 'btnInstall') return;
    var t = selected();
    if (!t) return;
    var idx = state.installed.indexOf(t.id);
    if (idx >= 0) {
      state.installed.splice(idx, 1);
      lsSet(K_INSTALLED, JSON.stringify(state.installed));
    } else {
      state.installed.push(t.id);
      lsSet(K_INSTALLED, JSON.stringify(state.installed));
    }
    renderHead();
    renderList();
    renderDetail();
    renderStars();
    renderChrome();
  });

  document.getElementById('stars').addEventListener('click', function (ev) {
    var b = ev.target;
    while (b && b !== this && !(b.getAttribute && b.getAttribute('data-score'))) b = b.parentNode;
    if (!b || !b.getAttribute) return;
    var score = parseInt(b.getAttribute('data-score'), 10);
    var t = selected();
    if (!t || !score) return;
    var cur = state.ratings[t.id] || { avg: 0, count: 0, sum: 0, my: 0 };
    var count = Math.max(1, cur.count || 1);
    var sum = (cur.sum || 0) - (cur.my || 0) + score;
    state.ratings[t.id] = { avg: +(sum / count).toFixed(2), count: count, sum: sum, my: score };
    lsSet(K_RATINGS, JSON.stringify(state.ratings));
    renderStars();
    renderList();
    renderDetail();
    renderChrome();
  });

  /* 导出索引：结构照 market/store.js 的 defaultIndex + entryOf，另带本地安装与评分 */
  document.getElementById('btnExport').addEventListener('click', function () {
    var now = new Date().toISOString();
    var items = [];
    var all = sorted();
    for (var i = 0; i < all.length; i++) {
      var t = all[i];
      if (t.error) continue;
      var r = ratingOf(t);
      var st = t.store || {};
      items.push({
        id: t.id,
        name: t.name,
        version: t.version,
        author: t.author,
        license: t.license,
        registry_version: t.registry_version,
        tags: t.tags || [],
        stage_focus: t.stage_focus || [],
        price_cny: t.pricing ? t.pricing.price_cny : 0,
        checksum: t.checksum,
        estimate_meta: t.estimate_meta || null,
        signed: !!(t.signature && t.signature.present),
        file: 'tpl/' + t.id + '.avptpl',
        size_bytes: t.size_bytes,
        installs: st.installs || 0,
        rating: { count: r.count, sum: +(r.avg * r.count).toFixed(2), avg: r.avg },
        raters: state.ratings[t.id] ? { local: state.ratings[t.id].my } : {},
        installed_at: isInstalled(t.id) ? (st.installed_at || now) : null,
        updated_at: now,
        rank: +rankOf(t).toFixed(3),
        local: { installed: isInstalled(t.id), rated: !!state.ratings[t.id] }
      });
    }
    var doc = {
      schema: 'ai-video-platform/market-index',
      version: 1,
      updated: now,
      items: items,
      exported_by: 'market/index.html',
      snapshot_generated_at: state.snap ? state.snap.generated_at : null,
      rank_w: W,
      note: '本地导出：安装量与仓库评分来自 market/store/index.json，rating 为本地自评分，不写入市场。'
    };
    var text = JSON.stringify(doc, null, 2) + '\n';
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'market-index.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      state.readAt = stamp();
      renderChrome();
    } catch (e) {
      window.alert('导出失败：' + e.message);
    }
  });

  /* 刷新快照：只重读构建期固化的 window.__SNAP，说明写在按钮 title 上 */
  document.getElementById('btnRefresh').addEventListener('click', function () {
    boot(window.__SNAP);
    state.readAt = stamp();
    renderAll();
  });

  /* ── 启动 ───────────────────────────────────────────────────────────── */
  function pickDefault() {
    var all = sorted();
    return all.length ? all[0].id : null;
  }

  function boot(snap) {
    state.snap = (snap && snap.templates) ? snap : null;
    state.templates = state.snap ? state.snap.templates.filter(function (t) { return t && t.id; }) : [];
    if (state.snap && state.snap.rank_w) W = state.snap.rank_w;
    state.installed = loadInstalled();
    state.ratings = loadRatings();
    if (!state.selected || !tplById(state.selected)) state.selected = pickDefault();
    renderAll();
  }

  boot(window.__SNAP);

  /* 键盘：F5 之外不做全局键；列表行 Tab 可达，tabs 是 button，评分是 button */
})();
</script>
</body>
</html>
