<style>
/* ═══════════════════════════════════════════════════════════════════════
   tokens.css —— 平台唯一视觉令牌源
   ───────────────────────────────────────────────────────────────────────
   定位：「暗黑玻璃拟态 · 冷银基调」。深黑 #08080a 上悬浮两团冷色光晕
   （左上蓝灰、右下紫灰），所有卡片/面板/输入/弹窗是一层半透明白玻璃：
   光从玻璃后面透出来，边缘靠 1px 亮线勾勒，hover 上浮并泛一圈冷光。

   为什么要有这个文件：
     七套界面此前各持一份配色。令牌集中到一处之后，全平台只有一种视觉人格，
     并且「像不像暗黑玻璃」这件事变成了可被 lint 校验的硬指标（tools/lint_ui.mjs）。

   四条硬规矩（违反即 lint 失败）：
     1. 玻璃面统一：背景 rgba(255,255,255,.06)、边框 rgba(255,255,255,.12)、
        圆角 16px、blur(20px) saturate(1.4)、黑阴影 + 顶部 1px 内亮线。
     2. 冷银唯一强调：--acc #C8CDD4，高亮 #EEF1F5。光晕只许冷色
        （蓝灰/紫灰/银，通道差 ≤ 64 且蓝≥红），禁止暖色荧光与 AI 紫。
     3. hover 三件套：背景提亮到 .10、边框提亮到 .25、上浮 3px + 冷光
        0 0 20px rgba(180,200,230,.15)。循环动画只给铸造粒子/烟雾加载器。
     4. 碑铭字体保留：平台名与卡片标题走 --serif 宽字距；正文 --sans
        小字号松行高；数字一律 tabular-nums。颗粒层保留（胶片感）。

   使用方式：
     单文件产物要求双击 file:// 可用 → 不允许运行时 @import。
     各 HTML 的 :root 必须**逐字复制**本文件的变量块；lint 会比对变量名与取值。
     通用玻璃类 .glass-card / .glass-btn / .glass-input 在本文件底部，
     组件直接挂类，不要各写一份玻璃配方。移动端 blur 自动降到 12px。
   ═══════════════════════════════════════════════════════════════════════ */

/* 碑铭衬线：Cinzel（SIL OFL，本地 woff2，见 assets/fonts/LICENSE-Cinzel.txt）。
   中文无 Cinzel 字形，自然落到宋体/思源宋体——碑铭感靠字距与字重，不靠假字体。 */
@font-face {
  font-family: "Cinzel";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("../assets/fonts/cinzel-latin-400.woff2") format("woff2");
}
@font-face {
  font-family: "Cinzel";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("../assets/fonts/cinzel-latin-700.woff2") format("woff2");
}

:root {
  /* ── 玻璃明度阶梯：半透明白膜叠在深黑上，冷光晕从后面透出来 ──────
     越靠近内容越亮。--panel 是标准玻璃面，--panel2 是膜内凹槽。 */
  --bg:        #08080a;   /* 应用底（双光晕的落点） */
  --bg-deep:   #0a0a0d;   /* 画布凹槽（节点图、时间轴）：比玻璃面更暗 */
  --panel:     rgba(255, 255, 255, 0.06);   /* 标准玻璃面 */
  --panel2:    rgba(255, 255, 255, 0.04);   /* 输入框 / 膜内凹槽 */
  --panel3:    rgba(255, 255, 255, 0.10);   /* 悬停态 */
  --panel4:    rgba(255, 255, 255, 0.14);   /* 按下 / 选中填充 */

  /* ── 分隔线：玻璃边缘的亮线（1px 半透明白）───────────────────── */
  --line:      rgba(255, 255, 255, 0.12);   /* 常规玻璃边框 */
  --line2:     rgba(255, 255, 255, 0.18);   /* 强分隔 / 输入框边框 */
  --line3:     rgba(255, 255, 255, 0.25);   /* hover / 焦点边框 */

  /* ── 文字（三级，绝不用纯白：纯白在暗底上光晕扩散）────────────── */
  --text:      #d4d8de;   /* 主文本 */
  --text-dim:  #7a8089;   /* 次要说明 */
  --text-dim2: #565c66;   /* 占位 / 禁用 */

  /* ── 唯一强调色：冷银。高亮 #eef1f5，像光扫过玻璃边缘 ─────────── */
  --acc:       #c8cdd4;
  --acc-hover: #eef1f5;
  --acc-dim:   #8a9099;
  --acc-fill:  rgba(200, 205, 212, 0.10);  /* 选中行底色 */

  /* ── 语义状态（降饱和；血红只作错误信号，不铺大面）──────────────
     --bad 太暗不能作文字色，错误文案用 --bad-ink，边框/填充用 --bad。 */
  --ok:        #7d9b84;
  --warn:      #b3985a;
  --bad:       #6b2020;
  --bad-ink:   #c98080;
  --ok-fill:   rgba(125, 155, 132, 0.12);
  --warn-fill: rgba(179, 152, 90, 0.12);
  --bad-fill:  rgba(107, 32, 32, 0.16);

  /* ── 端口/类型色（节点图专用，仅连线与 3-4px 圆点；全部压成灰调）── */
  --t-model:   #8d84a0;   /* 模型 */
  --t-latent:  #a08489;   /* 潜空间 */
  --t-image:   #a09678;   /* 图像 */
  --t-number:  #7f948c;   /* 数值 */
  --t-text:    #84909f;   /* 文本 */

  /* ── 字号（正文小字号 + 松行高；碑铭标题另走 --serif 放大）────── */
  --fz-xs: 10.5px;
  --fz-s:  11.5px;
  --fz:    12.5px;
  --fz-l:  13.5px;
  --fz-xl: 15px;
  --lh:    1.6;

  /* ── 间距（4 的倍数）─────────────────────────────────────────── */
  --sp1: 4px;  --sp2: 8px;  --sp3: 12px;  --sp4: 16px;  --sp5: 24px;

  /* ── 圆角（玻璃 16 / 按钮与输入 12 / 小件 8）──────────────────── */
  --r:   8px;
  --r2:  12px;
  --r3:  16px;       /* 卡片 / 面板 / 弹窗 */
  --r-pill: 999px;   /* 只用于状态点、计数徽标 */

  /* ── 阴影与光：黑阴影托底 + 顶部内亮线；冷光只给 hover/焦点 ────── */
  --shadow-pop: 0 8px 32px rgba(0, 0, 0, 0.3);
  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --glow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 20px rgba(180, 200, 230, 0.15);
  --glow-soft: 0 0 20px rgba(180, 200, 230, 0.08);
  --glass: rgba(255, 255, 255, 0.06);   /* 导航/顶栏/侧栏的玻璃底 */

  /* ── 玻璃配方（通用类共用；移动端 --glass-blur 自动降档）───────── */
  --glass-blur: blur(20px) saturate(1.4);
  --glass-blur-lite: blur(12px) saturate(1.3);
  --glass-hover: rgba(255, 255, 255, 0.10);
  --glass-line-hover: rgba(255, 255, 255, 0.25);
  --glow-cool: rgba(180, 200, 230, 0.15);
  /* 环境光：玻璃必须「有东西可透」。0.16 的光晕压在 #08080a 上只剩 #1a1d24，
     肉眼等于平黑——玻璃层再正确也读不出来。这里提到 0.30/0.26，
     合成后左上≈#262d39（蓝灰）、右下≈#241f2c（紫灰），仍远低于卡片明度。 */
  --amb-blue: rgba(108, 132, 172, 0.30);   /* 左上蓝灰环境光 */
  --amb-purple: rgba(132, 112, 168, 0.26); /* 右下紫灰环境光 */
  --amb-core: rgba(226, 232, 240, 0.05);   /* 中景冷白核心光，给玻璃一层极淡的迎光面 */
  --vignette: radial-gradient(120% 92% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.55) 100%);
  --sheen: linear-gradient(158deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0) 46%);

  /* ── 动效（状态切换 90-140ms；入场与铸造加载走 --t-slow）───────── */
  --t-fast: 90ms;
  --t:      140ms;
  --t-slow: 320ms;
  --ease:   cubic-bezier(0.2, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  /* ── 过渡别名（迁移垫片，不是设计决策）───────────────────────── */
  --dim:   #7a8089;
  --dim2:  #565c66;
  --acc2:  #eef1f5;

  /* ── 字体 ─────────────────────────────────────────────────────
     数字一律 tabular-nums：参数面板全是会跳动的数字，等宽数字能避免整行抖动。 */
  --sans: -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC",
          "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  --serif: "Cinzel", "Palatino Linotype", "Book Antiqua", Georgia,
           "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
}

/* ── 基础层：七个界面共用的最小复位与排版基调 ───────────────────── */
/* 底：深黑 + 两团冷色径向光晕（左上蓝灰 / 右下紫灰）+ 中景冷白核光 + 边缘压暗。
   fixed 不随滚动漂移。光晕是玻璃的「景」——没有它们，blur 透出来的只是一片死黑。 */
html {
  background-color: var(--bg);
  background-image:
    radial-gradient(78% 62% at 6% -4%, var(--amb-blue) 0%, rgba(108, 132, 172, 0) 68%),
    radial-gradient(70% 58% at 104% 102%, var(--amb-purple) 0%, rgba(132, 112, 168, 0) 68%),
    radial-gradient(60% 46% at 50% 34%, var(--amb-core) 0%, rgba(226, 232, 240, 0) 70%),
    radial-gradient(120% 92% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.55) 100%);
  background-repeat: no-repeat;
  background-attachment: fixed;
}
body {
  background: transparent;
  color: var(--text);
  font: var(--fz)/var(--lh) var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
/* 胶片颗粒：极细噪点铺满视口，不拦截指针；4% 透明度只够"感觉到"不够"看到" */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.045;
  mix-blend-mode: overlay;
  background: url("../assets/grain.png") repeat;
  background-size: 160px 160px;
}

/* ── 通用玻璃类：组件直接挂类，配方只此一份 ─────────────────────── */
.glass-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 可交互玻璃卡：hover 提亮 + 上浮 3px + 冷光（风格卡/作品卡/模板卡） */
.glass-card.hoverable {
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.glass-card.hoverable:hover {
  background: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
.glass-btn {
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
              box-shadow var(--t) var(--ease), color var(--t) var(--ease);
}
.glass-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: var(--glass-line-hover);
  color: var(--acc-hover);
  box-shadow: 0 0 20px var(--glow-cool);
}
.glass-input {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease),
              background var(--t) var(--ease);
}
.glass-input:focus {
  outline: none;
  border-color: var(--glass-line-hover);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: var(--glow);
}
.glass-input::placeholder { color: var(--text-dim2); }

/* 移动端：blur 降到 12px，避免大面积毛玻璃拖垮帧率 */
@media (max-width: 900px) {
  :root { --glass-blur: blur(12px) saturate(1.3); }
}

/* 碑铭体：平台名、卡片标题、章节题字共用 */
.serif {
  font-family: var(--serif);
  letter-spacing: 0.14em;
  font-weight: 700;
}

/* 数字等宽：所有数值读数都用它 */
.num, kbd, code, .mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 焦点环：冷银描边 + 一圈极淡冷光，键盘可达 */
:focus-visible {
  outline: 1px solid var(--acc);
  outline-offset: 2px;
  box-shadow: 0 0 0 3px rgba(180, 200, 230, 0.12);
}

/* 滚动条：细、暗、玻璃亮线 thumb，hover 提亮；不用系统默认蓝条 */
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--line2); border-radius: var(--r); }
*::-webkit-scrollbar-thumb:hover { background: var(--acc-dim); }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-corner { background: transparent; }

/* 选区：银的低透明填充，不用系统蓝 */
::selection { background: var(--acc-fill); color: var(--acc-hover); }

/* ── 玻璃族第二批：弹窗 / 浮条 / 侧栏 / 凹槽 / 胶囊 ──────────────────
   同一套配方，只是圆角与投影档位不同。组件直接挂类，别再复写 blur。 */
.glass-modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
.glass-toast {
  background: var(--glass-hover);
  border: 1px solid var(--glass-line-hover);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
/* 悬浮工具条：画布顶部/参数板顶部那种横条，圆角 16 贴在内容之上 */
.glass-toolbar {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 侧栏 / 导航栏：从贴边条改成悬浮玻璃板（margin 16 + 圆角 16） */
.glass-rail {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 凹槽：画布底、代码块、时间轴这类「玻璃板里的暗面」，不铺毛玻璃 */
.glass-well {
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.glass-chip {
  background: var(--panel2);
  border: 1px solid var(--line2);
  border-radius: var(--r2);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
}

/* 玻璃卡顶部迎光：一层极淡的白到透明的斜向渐变，让平面看出弧面 */
.glass-card, .glass-modal, .glass-rail, .panel {
  background-image: var(--sheen);
  background-repeat: no-repeat;
}

/* ── 无 backdrop-filter 的浏览器：把膜加厚一档，至少不塌成纯黑 ──────── */
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass-card, .glass-modal, .glass-rail, .glass-toolbar { background-color: rgba(255, 255, 255, 0.10); }
  .glass-toast { background-color: rgba(255, 255, 255, 0.14); }
}

/* ── 移动端：blur 降到 12px；小控件直接关掉毛玻璃，省一次合成 ────────── */
@media (max-width: 900px) {
  :root { --glass-blur: blur(12px) saturate(1.3); }
  .glass-btn, .glass-chip, .glass-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background-color: rgba(255, 255, 255, 0.09);
  }
}

/* ── 尊重系统设置：减少动效 / 减少透明 ─────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .glass-card.hoverable:hover, .glass-btn:hover { transform: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .glass-card, .glass-modal, .glass-rail, .glass-toolbar, .glass-toast, .glass-chip, .glass-btn, .glass-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background-color: rgba(24, 26, 30, 0.92);
  }
}
  /* 视觉基线抄自 web/params.src.html：同一套暗色科技感 token，保证两个界面并排演示不违和 */

/* :root 已收口到 ui/tokens.css（构建期内联） */

/* 数字等宽：所有数值读数都用它 */
.num, kbd, code, .mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 焦点环：冷银描边 + 一圈极淡银光，键盘可达 */
:focus-visible {
  outline: 1px solid var(--acc);
  outline-offset: 2px;
  box-shadow: 0 0 0 3px rgba(200, 205, 212, 0.12);
}

/* 滚动条：细、暗、银灰thumb，hover 提亮；不用系统默认蓝条 */
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--line2); border-radius: var(--r); }
*::-webkit-scrollbar-thumb:hover { background: var(--acc-dim); }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-corner { background: transparent; }

/* 选区：银的低透明填充，不用系统蓝 */
::selection { background: var(--acc-fill); color: var(--acc-hover); }

/* ── 通用玻璃类：与 ui/tokens.css 同一配方 ─────────────────────── */
.glass-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
.glass-card.hoverable {
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.glass-card.hoverable:hover {
  background: var(--glass-hover); border-color: var(--glass-line-hover); transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
.glass-btn {
  background: rgba(255, 255, 255, 0.10); border: 1px solid var(--line); border-radius: var(--r2); color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease), box-shadow var(--t) var(--ease), color var(--t) var(--ease);
}
.glass-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: var(--glass-line-hover); color: var(--acc-hover); box-shadow: 0 0 20px var(--glow-cool); }
.glass-input {
  background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r2); color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease);
}
.glass-input:focus { outline: none; border-color: var(--glass-line-hover); background: rgba(255, 255, 255, 0.07); box-shadow: var(--glow); }
.glass-input::placeholder { color: var(--text-dim2); }
@media (max-width: 900px) { /* :root 已收口到 ui/tokens.css（构建期内联） */ }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: transparent;
    color: var(--text);
    font: 13px/1.55 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    overflow: hidden;
  }
  button, select, input, textarea { font-family: inherit; }
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr) 26px; height: 100vh; }

  /* ── 顶栏：悬浮玻璃条（margin 16 / 圆角 16 / blur 20）── */
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 14px; min-width: 0;
    margin: var(--sp4) var(--sp4) 0; min-height: 44px;
    border: 1px solid var(--line); border-radius: var(--r3);
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    box-shadow: var(--shadow-pop), var(--shadow-inset);
    position: relative; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-weight: 700; letter-spacing: .14em; color: var(--acc); white-space: nowrap; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: var(--r2); display: grid; place-items: center;
    background: var(--panel2); border: 1px solid var(--line2);
  }
  .brand small { color: var(--dim2); font-weight: 400; font-family: var(--mono); font-size: 11px; }
  .spacer { flex: 1; min-width: 6px; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; background: var(--panel2); flex: none; -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite); }
  .seg button {
    background: transparent; color: var(--dim); border: 0; padding: 7px 13px; cursor: pointer;
    font-size: 12.5px; display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .seg button:hover { color: var(--text); background: var(--panel3); }
  .seg button.on {
    background: var(--panel4); color: var(--acc);
    box-shadow: inset 0 -2px 0 var(--acc);
  }
  kbd {
    font: 10px var(--mono); color: var(--dim2); border: 1px solid var(--line2); border-bottom-width: 2px;
    border-radius: var(--r); padding: 0 4px; background: var(--panel2);
  }
  .seg button.on kbd { color: var(--acc); border-color: var(--line2); }

  select, input[type=number], input[type=text], textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: var(--r2);
    padding: 5px 8px; font: 12px var(--mono); outline: none; width: 100%;
    -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite);
    transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  }
  select:focus, input:focus, textarea:focus { border-color: var(--glass-line-hover); box-shadow: var(--glow); }
  .btn {
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.10); color: var(--text); border-radius: var(--r2);
    padding: 6px 11px; font-size: 12px; cursor: pointer; white-space: nowrap; letter-spacing: .06em;
    -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite);
    transition: border-color var(--t) var(--ease), background var(--t) var(--ease), box-shadow var(--t) var(--ease), color var(--t) var(--ease);
  }
  .btn:hover { border-color: var(--glass-line-hover); background: rgba(255, 255, 255, 0.14); color: var(--acc-hover); box-shadow: 0 0 20px var(--glow-cool); }
  .btn.acc { border-color: var(--acc-dim); color: var(--acc-hover); background: var(--panel3); letter-spacing: .1em; }
  .btn.acc:hover { border-color: var(--acc-hover); color: var(--acc-hover); box-shadow: var(--glow); }
  .btn.mini { padding: 3px 8px; font-size: 11px; border-radius: var(--r2); }

  /* ── 视图容器：三视图叠放，同一份 state 换渲染 ── */
  main { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: none; min-height: 0; }
  .view.on { display: grid; }

  /* ═══════ 向导视图 ═══════ */
  #view-wizard { grid-template-columns: 236px minmax(0, 1fr); }
  #wSteps {
    border-right: 1px solid var(--line); background: var(--glass); padding: 12px 10px; overflow-y: auto;
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  }
  .wsteps-title { font: 10.5px var(--mono); color: var(--dim2); letter-spacing: 1px; text-transform: uppercase; padding: 0 6px 8px; }
  .wstep {
    display: grid; grid-template-columns: 24px 1fr; gap: 2px 9px; align-items: center;
    padding: 9px 9px; border-radius: var(--r2); cursor: pointer; border: 1px solid transparent; margin-bottom: 4px;
    color: var(--dim);
  }
  .wstep:hover { background: var(--bg); color: var(--text); }
  .wstep.on { background: var(--panel2); border-color: var(--line2); color: var(--text); }
  .wstep.done .wstep-n { background: var(--panel); color: var(--acc); border-color: var(--line2); }
  .wstep-n {
    width: 24px; height: 24px; border-radius: var(--r2); display: grid; place-items: center; grid-row: span 2;
    font: 700 11px var(--mono); background: var(--panel2); color: var(--acc2); border: 1px solid var(--line2);
  }
  .wstep.on .wstep-n { background: var(--panel2); color: var(--acc); border-color: var(--line2); }
  .wstep-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wstep-meta { font: 10.5px var(--mono); color: var(--dim2); display: flex; gap: 6px; }
  .wstep-meta .dirty { color: var(--acc); }

  #wBody { overflow-y: auto; padding: 18px 22px 150px; }
  .wcard {
    max-width: 940px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r3); padding: 18px 20px 16px;
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: var(--shadow-pop), var(--shadow-inset);
  }
  .wcard-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .stage-chip {
    width: 34px; height: 34px; border-radius: var(--r2); display: grid; place-items: center; flex: none;
    font: 700 13px var(--mono); color: var(--bg-deep);
    background: var(--panel); box-shadow: none;
  }
  .wcard-head h1 { margin: 0; font-family: var(--serif); font-size: 18px; letter-spacing: .14em; color: var(--acc); }
  .wcard-head .en { font: 11px var(--mono); color: var(--dim2); letter-spacing: .6px; }
  .wcard-say {
    color: var(--acc); font-size: 13.5px; line-height: 1.7; margin: 10px 0 4px;
    padding-left: 12px; border-left: 2px solid var(--line2);
  }
  .wcard-callout { color: var(--dim); font-size: 11.5px; margin: 6px 0 14px; padding-left: 14px; }
  .wparams { display: grid; gap: 9px; }
  .wp {
    display: grid; grid-template-columns: minmax(0, 1fr) 268px; gap: 10px 16px; align-items: center;
    padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r2);
    background: var(--panel2);
    -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite);
  }
  .wp.hit { border-color: var(--line2); background: var(--panel3); }
  .wp-label { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .wp-label b { font-size: 13px; font-weight: 600; }
  .wp-plain { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .wp-val { font: 11px var(--mono); color: var(--acc2); }
  .wp-ctrl { display: flex; align-items: center; gap: 8px; }
  .wp-ctrl input[type=range] { flex: 1; accent-color: var(--acc); min-width: 0; }
  .wp-ctrl .num { width: 68px; flex: none; text-align: right; }
  .wp.wide { grid-template-columns: minmax(0, 1fr); }
  .wp.wide textarea { min-height: 52px; resize: vertical; font-family: "Microsoft YaHei UI", monospace; }

  .wfoot { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .wfoot .grow { flex: 1; }
  .rec { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); }
  .rec-chip {
    border: 1px solid var(--line); background: var(--bg); color: var(--dim); border-radius: var(--r2);
    padding: 4px 11px; font-size: 11.5px; cursor: pointer; display: flex; gap: 6px; align-items: center;
  }
  .rec-chip:hover { color: var(--text); border-color: var(--line2); }
  .rec-chip.on { color: var(--acc); border-color: var(--line2); background: var(--bg); }
  .wprogress { max-width: 940px; margin: 14px auto 0; display: flex; gap: 5px; }
  .wprogress i { height: 3px; flex: 1; border-radius: var(--r2); background: var(--panel2); }
  .wprogress i.on { background: var(--panel); box-shadow: none; }

  /* ═══════ 参数视图 ═══════ */
  #view-params { grid-template-columns: 202px minmax(0, 1fr); }
  #pRail { border-right: 1px solid var(--line); background: var(--glass); overflow-y: auto; padding: 10px 8px; -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
  .rail-item {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: var(--r2); cursor: pointer;
    color: var(--dim); border: 1px solid transparent; margin-bottom: 4px;
  }
  .rail-item:hover { background: var(--bg); color: var(--text); }
  .rail-item.on { background: var(--acc-fill); border-color: var(--line2); color: var(--acc-hover); box-shadow: inset 2px 0 0 var(--acc); }
  .rail-code {
    width: 22px; height: 22px; border-radius: var(--r2); display: grid; place-items: center;
    font: 700 11px var(--mono); background: var(--panel2); color: var(--acc2); flex: none;
  }
  .rail-item.on .rail-code { background: var(--panel2); color: var(--acc); }
  .rail-name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-n { font: 11px var(--mono); color: var(--dim2); flex: none; }
  .rail-n.warn { color: var(--warn); }

  #pBoard { overflow-y: auto; padding: 14px 18px 160px; }
  #pBoard > .board-head, #pBoard > #paramList { max-width: 1280px; margin-left: auto; margin-right: auto; }
  .board-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .bh-left { min-width: 240px; flex: 1; }
  .board-head h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
  .board-head p { margin: 0; color: var(--dim); font-size: 12px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-left: auto; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .group-title {
    display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; color: var(--dim);
    font: 11px var(--mono); letter-spacing: 1px; text-transform: uppercase;
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .group-title b { color: var(--text); font-weight: 500; letter-spacing: 0; text-transform: none; }

  .prow {
    display: grid; grid-template-columns: minmax(0, 1fr) 252px 118px; gap: 8px 12px; align-items: center;
    padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--r2); margin-bottom: 5px;
    background: var(--bg);
  }
  .prow:hover { border-color: var(--line2); }
  .prow.custom { border-color: var(--line2); }
  .prow.hit { border-color: var(--line2); background: var(--panel); }
  .prow-meta { min-width: 0; }
  .prow-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .lbl { font-size: 12.5px; }
  .key { font: 10.5px var(--mono); color: var(--dim2); }
  .hint { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font: 10px var(--mono); padding: 1px 5px; border-radius: var(--r); border: 1px solid; white-space: nowrap; }
  .badge.auto { color: var(--acc-dim); border-color: var(--line2); background: var(--panel); cursor: help; }
  .badge.core { color: var(--acc2); border-color: var(--line2); background: var(--panel); }
  .badge.diff { color: var(--acc); border-color: var(--line2); background: var(--bg); }
  .ctrl { display: flex; align-items: center; gap: 7px; }
  .ctrl input[type=range] { flex: 1; accent-color: var(--acc); min-width: 0; }
  .num { width: 66px; text-align: right; flex: none; }
  .unit { font: 11px var(--mono); color: var(--dim2); min-width: 22px; flex: none; }
  .restore { color: var(--dim2); font-size: 11px; cursor: pointer; text-decoration: underline dotted; white-space: nowrap; flex: none; }
  .restore:hover { color: var(--acc); }
  .switch {
    width: 40px; height: 21px; border-radius: var(--r2); background: var(--panel3); border: 1px solid var(--line);
    position: relative; cursor: pointer; flex: none;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--panel4); transition: .16s;
  }
  .switch.on { background: var(--panel); border-color: var(--line2); }
  .switch.on::after { left: 21px; background: var(--acc);  }
  .prow-attach { grid-column: 1 / -1; }
  .prow-attach textarea { min-height: 42px; resize: vertical; font-family: "Microsoft YaHei UI", monospace; font-size: 12px; }

  /* impact 三联：显存/耗时/质量，条长=相对量级，数字精确 */
  .impacts { display: flex; gap: 6px; justify-content: flex-end; }
  .imp { display: flex; flex-direction: column; gap: 3px; width: 34px; }
  .imp span { font: 10px var(--mono); color: var(--dim2); text-align: center; }
  .imp i { display: block; height: 3px; border-radius: var(--r2); background: var(--panel2); overflow: hidden; }
  .imp i > b { display: block; height: 100%; border-radius: var(--r2); }
  .imp.v i > b { background: var(--acc2); }
  .imp.t i > b { background: var(--acc-dim); }
  .imp.q i > b { background: var(--acc); }
  .imp.zero span { color: var(--text-dim2); }

  .fold { border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel2); margin-top: 6px; }
  .fold > summary {
    cursor: pointer; padding: 10px 12px; font-size: 12.5px; color: var(--dim); list-style: none;
    display: flex; align-items: center; gap: 8px;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary:hover { color: var(--text); }
  .fold > summary .caret { transition: .15s; color: var(--dim2); font: 10px var(--mono); }
  .fold[open] > summary .caret { transform: rotate(90deg); }
  .fold > summary b { color: var(--text); font-weight: 600; }
  .fold-body { padding: 4px 10px 10px; }
  .empty { color: var(--dim2); font-size: 11.5px; padding: 4px 2px; }

  /* ═══════ 节点视图 ═══════ */
  #view-nodes { grid-template-columns: minmax(0, 1fr); position: absolute; }
  #nodeWrap { position: relative; overflow: hidden; background: var(--bg-deep); }
  #nodeCanvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #nodeCanvas.dragging { cursor: grabbing; }
  #nodeCanvas.linking { cursor: crosshair; }
  .node-hint {
    position: absolute; left: 14px; top: 12px; display: flex; flex-direction: column; gap: 5px;
    font: 11px var(--mono); color: var(--dim2); pointer-events: none; line-height: 1.7;
  }
  .node-hint b { color: var(--dim); font-weight: 500; }
  .node-tools { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px; }
  .legend {
    position: absolute; left: 14px; bottom: 52px; display: flex; gap: 12px; font: 10.5px var(--mono);
    color: var(--dim2); background: var(--glass); border: 1px solid var(--line); border-radius: var(--r2); padding: 4px 9px;
    -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite);
    box-shadow: var(--shadow-inset);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 16px; height: 3px; border-radius: var(--r2); display: block; }

  /* 右侧节点参数抽屉：点节点才出现，避免常驻挤占画布 */
  #nodePanel {
    position: absolute; right: 12px; top: 12px; width: 344px; max-height: calc(100% - 292px);
    display: none; flex-direction: column;
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--line2); border-radius: var(--r3); box-shadow: var(--shadow-pop), var(--shadow-inset); z-index: 20;
  }
  #nodePanel.on { display: flex; }
  .np-head { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .np-head .stage-chip { width: 26px; height: 26px; border-radius: var(--r2); font-size: 11px; box-shadow: none; }
  .np-head h3 { margin: 0; font-size: 13.5px; flex: 1; }
  .np-head .x { cursor: pointer; color: var(--dim2); font: 12px var(--mono); padding: 2px 6px; border-radius: var(--r); }
  .np-head .x:hover { color: var(--bad); background: var(--panel); }
  .np-body { overflow-y: auto; padding: 9px 11px 11px; }
  .np-row { padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r2); margin-bottom: 5px; background: var(--panel2); }
  .np-row.hit { border-color: var(--line2); }
  .np-row .np-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .np-row .np-top b { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-foot { padding: 9px 11px; border-top: 1px solid var(--line); display: flex; gap: 6px; }

  /* ═══════ 实时估算面板（右下固定） ═══════ */
  #estimator {
    position: fixed; right: 12px; bottom: 34px; width: 300px; z-index: 40;
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--line2); border-radius: var(--r3); padding: 10px 12px 11px;
    box-shadow: var(--shadow-pop), var(--shadow-inset);
    font: 12px var(--mono);
  }
  #estimator .est-head { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  #estimator .est-head .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--acc);   }
  @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  #estimator .est-head .dev { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--dim2); font-size: 10px; }
  .est-vram { display: flex; align-items: baseline; gap: 8px; margin-top: 7px; }
  .est-vram b { font-size: 26px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
  .est-vram small { font-size: 12px; color: var(--dim2); }
  .st { font: 10.5px var(--mono); padding: 1px 6px; border-radius: var(--r); border: 1px solid; }
  .st.ok { color: var(--acc); border-color: var(--line2); background: var(--bg); }
  .st.warn { color: var(--warn); border-color: var(--line2); background: var(--bg); }
  .st.block { color: var(--bad); border-color: var(--line2); background: var(--panel); }
  .bar { height: 6px; border-radius: var(--r2); background: var(--panel2); overflow: hidden; margin: 7px 0 6px; position: relative; }
  .bar > i { display: block; height: 100%; border-radius: var(--r2); transition: width .16s; }
  .bar .tick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--line3); }
  .est-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; font-size: 11px; }
  .est-grid div { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); border-bottom: 1px dashed var(--panel2); padding-bottom: 2px; }
  .est-grid b { color: var(--text); font-weight: 500; }
  .est-grid em { font-style: normal; color: var(--acc2); }
  .est-alerts { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 132px; overflow-y: auto; }
  .alert { font: 11px/1.45 "Microsoft YaHei UI", sans-serif; padding: 4px 7px; border-radius: var(--r2); display: flex; gap: 6px; align-items: flex-start; }
  .alert i { font-style: normal; flex: none; font-size: 10px; padding: 0 4px; border-radius: var(--r2); background: #00000040; }
  .alert.warn { color: var(--warn); background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--warn); }
  .alert.warn i { color: var(--warn); }
  .alert.block { color: var(--bad); background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--bad); }
  .alert.block i { color: var(--bad); }
  .alert.gray { color: var(--text); background: var(--panel); border: 1px solid var(--line2); }
  .alert.gray i { color: var(--dim); }
  .est-link { margin-top: 6px; font-size: 10.5px; color: var(--acc-dim); display: flex; gap: 6px; align-items: center; }

  /* ── 底栏 / 提示 ── */
  footer {
    border-top: 1px solid var(--line); display: flex; align-items: center; gap: 13px; padding: 0 13px;
    font: 11px var(--mono); color: var(--dim2); background: var(--glass); overflow: hidden; white-space: nowrap;
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  }
  footer .live { color: var(--acc); }
  footer b { color: var(--dim); font-weight: 500; }
  #toast {
    position: fixed; left: 50%; transform: translate(-50%, 8px); bottom: 40px; z-index: 60;
    background: var(--glass); border: 1px solid var(--line2); color: var(--acc);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    padding: 8px 13px; border-radius: var(--r2); font: 12px var(--mono);
    box-shadow: var(--shadow-pop), var(--shadow-inset);
    opacity: 0; transition: .2s; pointer-events: none; max-width: min(520px, 92vw);
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #tip {
    position: fixed; z-index: 70; pointer-events: none; max-width: 320px; opacity: 0; transition: opacity .12s;
    background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r2); padding: 7px 9px;
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    font: 11.5px/1.55 "Microsoft YaHei UI", sans-serif; color: var(--acc);
    box-shadow: var(--shadow-pop), var(--shadow-inset);
  }
  #tip.on { opacity: 1; }
  #tip b { color: var(--acc-dim); font-weight: 600; }
  #tip .was { font: 11px var(--mono); color: var(--dim); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--panel2); border-radius: var(--r2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--panel4); }

  /* ── 移动端：顶栏换行、侧栏横排、参数行单列 ── */
  @media (max-width: 900px) {
    #app { grid-template-rows: auto minmax(0, 1fr) 26px; grid-template-columns: minmax(0, 1fr); }
    header { flex-wrap: wrap; gap: 8px; padding: 8px 12px; margin: 12px 12px 0; }
    .brand small { display: none; }
    .spacer { display: none; }
    #viewSwitch { order: 7; }
    select#device { width: 100% !important; order: 8; }
    #view-wizard, #view-params { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    #wSteps, #pRail {
      display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
      border-right: 0; border-bottom: 1px solid var(--line); padding: 7px 8px; gap: 4px;
    }
    .wsteps-title { display: none; }
    .wstep { flex: none; width: auto; margin-bottom: 0; white-space: nowrap; grid-template-columns: 24px auto; }
    .wstep-n { grid-row: auto; }
    .wstep-meta { display: none; }
    .rail-item { flex: none; width: auto; margin-bottom: 0; white-space: nowrap; }
    .rail-name { flex: none; }
    #wBody { padding: 14px 12px 150px; }
    #pBoard { padding: 12px 12px 160px; }
    .bh-left { min-width: 0; }
    .toolbar { margin-left: 0; flex-wrap: wrap; }
    #nodePanel { width: min(344px, calc(100% - 24px)); }
    .node-hint { display: none; }
    #estimator { width: min(300px, calc(100vw - 24px)); }
    footer { overflow-x: auto; }
  }
  @media (max-width: 620px) {
    .wp { grid-template-columns: minmax(0, 1fr); }
    .prow { grid-template-columns: minmax(0, 1fr); }
    .impacts { justify-content: flex-start; }
    .wcard { padding: 14px 13px 12px; }
    .seg button { padding: 6px 9px; }
    .legend { display: none; }
  }

  /* ═══════════════════════════════════════════════════════════════════
     玻璃化补丁（画布页）—— 配方本体在 ui/tokens.css 与 ui/glass-skin.css。
     这里只补「画布页自己的结构」：悬浮工具条、节点抽屉、控件细节、窄屏。
     令牌只用 :root 里已有的那批，不新增色值 / 圆角档位 / 循环动画。
     ═══════════════════════════════════════════════════════════════════ */

  /* ── ① 画布工具条：裸按钮直接压在网格上 → 悬浮玻璃条（圆角 16 / blur 20 / 距边 16）──
     配方挂 .glass-toolbar，这里只管位置与密度，不重写 background/blur/shadow。 */
  .node-tools {
    left: var(--sp4);
    bottom: var(--sp4);
    gap: var(--sp1);
    padding: 5px;
  }
  .node-tools .btn:hover { box-shadow: var(--glow); }

  /* 参数视图板头工具条：同一口径的短玻璃条，避免和标题挤成一条裸线 */
  .board-head .toolbar {
    gap: var(--sp2);
    padding: 4px 5px 4px var(--sp3);
    border: 1px solid var(--line);
    border-radius: var(--r3);
    background: var(--panel2);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    box-shadow: var(--shadow-inset);
  }
  .board-head .toolbar .btn:hover { box-shadow: var(--glow); }

  /* ── ② 右侧节点属性抽屉：玻璃卡片 ──
     配方挂 .glass-card（半透明白 .06 / 1px 亮线 / 16 / blur(20) saturate(1.4) /
     0 8px 32px 黑阴影 + 顶部内亮线）；这里把原来的 --line2 边框压回常规档，
     再收紧头/身/脚的留白。 */
  #nodePanel { border-color: var(--line); }
  #nodePanel .np-head { padding: 10px var(--sp3); }
  #nodePanel .np-body { padding: var(--sp2) var(--sp3) var(--sp3); }
  #nodePanel .np-foot { padding: var(--sp2) var(--sp3); }
  /* 字段行：膜内一层；hover 只提亮、不上浮（一列十几行上浮会变成果冻） */
  #nodePanel .np-row {
    border: 1px solid var(--line);
    border-radius: var(--r2);
    background-color: var(--panel2);
    transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease);
  }
  #nodePanel .np-row:hover {
    background-color: var(--glass-hover);
    border-color: var(--glass-line-hover);
    transform: none;
    box-shadow: none;
  }
  /* 保住「被规则改写」那一档的边框层级（否则上面那条 id 选择器会把它压平） */
  #nodePanel .np-row.hit { border-color: var(--line2); }

  /* ── ③ 画布节点 ──
     节点与连线是 #nodeCanvas 里的像素（drawNode / drawEdge），DOM 里没有 .node 元素，
     CSS 触不到它们的边框与圆角。它们的配色在启动时由 TK 从 :root 读成实值
     （填充 --panel、描边 --line2、hover --line3、选中 --acc、底 --bg-deep），
     所以凹槽与面板换肤后节点会自动同调；圆角与描边宽度写在 drawNode 里，见交付说明。 */

  /* ── ④ 表单控件：滑块（膜内凹槽轨道 + 冷银拇指）配方在 glass-skin 第 6 节 ──
     这里只补原生下拉在暗底上的配色，以及开关的 hover。 */
  select option,
  select optgroup { background-color: var(--bg-deep); color: var(--text); }
  .switch { transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease); }
  .switch:hover { border-color: var(--line2); }
  .switch.on::after { box-shadow: var(--glow-soft); }

  /* ── ⑤ 窄屏（≤900）：节点抽屉从右侧竖板改底部半屏，画布上半区不被压掉；
     blur 由 :root 的 --glass-blur 自动降到 12px（上方那条媒体查询），不重复写。 ── */
  @media (max-width: 900px) {
    #nodePanel {
      top: auto;
      right: var(--sp3);
      bottom: var(--sp3);
      left: var(--sp3);
      width: auto;
      max-height: 46%;
    }
    /* 工具条挪到画布左上，避开底部抽屉 */
    .node-tools { top: var(--sp3); bottom: auto; left: var(--sp3); }
  }
/* ═══════════════════════════════════════════════════════════════════════
   glass-skin.css —— 玻璃映射层（最后一遍）
   ───────────────────────────────────────────────────────────────────────
   定位：ui/tokens.css 定义「玻璃是什么」，本文件负责「把各页已经写好的
   组件选择器映射到那套配方上」。页面源件里只留自己的结构与排版，不再各写
   一份 background/border/blur/shadow。

   为什么单独一层而不是逐组件改：
     七个页面 + 帧检视器共 543KB 源，卡片族有 40 多个类名，逐个改一遍既容易
     漏、又会在下一次改令牌时全部失配。映射层只做增量：圆角补齐、hover 三件套、
     侧栏悬浮、弹窗居中、控件玻璃化。谁想加新卡片，挂 .glass-card 即可。

   注入位置：每个页面 <style> 的最后一行（构建期替换 /*__SKIN__*\/）。
     放在最后 = 同权重规则里一定赢，所以整份文件不需要一个 !important。

   三条规矩：
     1. 只写「页面自己的类名 → 玻璃配方」，不新增色值，全部走 var()。
     2. 不改布局栅格（列宽/行高/顺序由各页自持）；只加外边距让它浮起来。
     3. 循环动画、彩色光晕、纯白文字一律不写（tools/lint_ui.mjs 会拦）。
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 1. 悬浮侧栏：贴边条 → 悬浮玻璃板（margin 16 / 圆角 16 / blur 20）── */
#sidenav,
nav#rail,
#pRail,
aside,
.aside {
  margin: var(--sp4) 0 var(--sp4) var(--sp4);
  border: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-radius: var(--r3);
  background-color: var(--glass);      /* 膜必须由本层给：页面侧多为 transparent，靠 skin 兜底 */
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 侧栏内部滚到底时的圆角不露直角 */
#sidenav, nav#rail, #pRail, aside { overflow-y: auto; }

/* ── 2. 圆角补齐：还停在 12px 的卡片族一律抬到 16px ───────────────── */
.card,
.style-card,
.ai-card,
.gen-card,
.work-item,
.opt,
.honest,
.summary,
.reco,
.prow,
.np-row,
.legend,
.tip,
#toast,
.toast,
.loaded,
.errcard,
.svc,
.node,
.wp,
.stage-chip,
.field,
.empty {
  border-radius: var(--r3);
}

/* 输入框：规范要求 16px（按钮 12px，别混） */
select,
input[type="text"],
input[type="search"],
input[type="number"],
input[type="password"],
input[type="url"],
textarea {
  border-radius: var(--r3);
}

/* ── 3. hover 三件套：提亮 + 亮边 + 上浮 3px + 一圈冷光 ────────────── */
.card,
.style-card,
.work-item,
.opt,
.np-row,
.loaded {
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.card:hover,
.style-card:hover,
.work-item:hover,
.opt:hover,
.np-row:hover,
.loaded:hover {
  background-color: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}

/* 提示块不是可点目标：.honest / .summary / .svc 只提亮，不上浮（跟着鼠标跳会很脏） */
.honest,
.summary,
.svc {
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease);
}
.honest:hover,
.summary:hover,
.svc:hover {
  background-color: var(--glass-hover);
  border-color: var(--glass-line-hover);
}

/* 列表行 / 参数行：只在膜内提亮，不上浮（上浮会让 258 行变成果冻） */
.row:hover,
.list .row:hover,
.prow:hover,
.tier-head:hover,
.wstep:hover,
.rail-item:hover,
.nav-item:hover,
.wi-acts:hover {
  background-color: var(--glass-hover);
}

/* ── 4. 悬浮工具条 / 弹窗 / Toast ─────────────────────────────────── */
/* 画布顶部与参数板顶部的横条：同一条玻璃，圆角 16 */
#canvasTop,
.canvas-tools,
.toolbar,
.board-head,
.main-h,
.viewhead {
  border-radius: var(--r3);
}
#canvasTop,
.canvas-tools,
.toolbar {
  background-color: var(--glass);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}

/* 弹窗：居中 + 玻璃 + 16px；遮罩压暗但不铺纯黑 */
.wiz,
.modal,
.dialog,
.panel-pop {
  background-color: var(--panel);
  background-image: var(--sheen);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 弹层遮罩只负责压暗与居中，毛玻璃档位交给页面自己（app 用 10px）。
   这里若再写一份 blur(2px)，同权重且 skin 在后，会把页面的遮罩糊没了。 */
#wizard,
#forgeOverlay {
  display: grid;
  place-items: center;
}

/* Toast：玻璃胶囊，居中偏下 */
#toast,
.toast {
  background-color: var(--glass-hover);
  border: 1px solid var(--glass-line-hover);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}

/* ── 5. 画布：区域是深色凹槽，节点与属性面板是玻璃 ────────────────── */
#nodeWrap {
  margin: 0 var(--sp4) var(--sp4);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  background-color: var(--bg-deep);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  overflow: hidden;
}
#nodeWrap .legend,
#nodeWrap .node,
#estimator {
  background-color: var(--panel);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
#nodeWrap .node:hover {
  border-color: var(--glass-line-hover);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}

/* ── 6. 表单控件：滑块轨道是膜内凹槽，拇指是一颗冷银 ─────────────── */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  height: 18px;
  background: transparent;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--panel4);
  box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.35);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px; height: 13px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--acc);
  border: 1px solid var(--acc-hover);
  box-shadow: 0 0 10px var(--glow-cool);
  transition: background-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
input[type="range"]:hover::-webkit-slider-thumb { background: var(--acc-hover); }
input[type="range"]::-moz-range-track {
  height: 4px; border-radius: var(--r-pill); background: var(--panel4);
}
input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--acc); border: 1px solid var(--acc-hover);
}

/* ── 7. 细节：风格图标去彩（emoji 只作字形，不作彩色贴纸）─────────── */
.sc-emoji,
.wi-emoji,
.style-ico {
  filter: grayscale(0.72) contrast(0.94);
  opacity: 0.92;
}

/* 底部口径条 / 状态栏：细玻璃条，不做大圆角 */
#statusbar,
.statusbar,
footer {
  background-color: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* 代码块 / 日志：膜内凹槽，别铺毛玻璃（长文本 blur 很贵） */
.code,
pre,
.gout {
  background-color: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r2);
}

/* ── 8. 窄屏：侧栏取消外边距，改为贴边全宽；卡片不再上浮 ─────────── */
@media (max-width: 900px) {
  #sidenav,
  nav#rail,
  #pRail,
  aside,
  .aside {
    margin: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .card:hover,
  .style-card:hover,
  .work-item:hover,
  .opt:hover,
  .honest:hover,
  .summary:hover,
  .np-row:hover,
  .loaded:hover,
  .svc:hover {
    transform: none;
  }
  #nodeWrap { margin: 0; border-radius: 0; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="btn" data-backlink href="../app/index.html" title="返回平台工作台（各模块页共用的回程路）">← 工作台</a>
    <div class="brand">
      <span class="mark">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 4h5v3H2zM9 4h5v3H9zM2 9h12v3H2z" stroke="var(--acc)" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </span>
      工作流画布 <small>canvas · v0.1</small>
    </div>

    <div class="seg" id="viewSwitch" role="tablist" aria-label="视图切换">
      <button data-view="wizard" class="on" role="tab">向导 <kbd>1</kbd></button>
      <button data-view="params" role="tab">参数 <kbd>2</kbd></button>
      <button data-view="nodes" role="tab">节点 <kbd>3</kbd></button>
    </div>

          <span>从节点 <b>右侧圆点</b> 拖到另一个节点可自定义数据流</span>
          <span><b>单击节点</b> 右侧编辑参数 · <b>双击</b> 跳到参数视图 · <b>Shift+拖拽</b> 框选多节点</span>

          <span><i style="background:var(--acc)"></i>数据流</span>

<script>/**
 * engine.js —— 参数求解器（零依赖，浏览器 / Node 双端同一份）
 *
 * 职责边界：
 *   - 不认识 UI，不认识 ComfyUI，只吃 spec/*.json，吐结构化报告。
 *   - 浏览器侧挂到 window.AVP；Node 侧 module.exports（require 得到同一对象）。
 *
 * 四向预估的口径（重要，别当成实测）：
 *   显存：peak = W_resident + c1·(Mpix·frames) + decode + overhead，再乘参数 vram 影响；
 *         系数在 models.catalog.json 的 vram 段，来源等级见 provenance。
 *   耗时：设计文档 §25/§37 的区间中值做基准秒数，其余为乘性系数（每个系数下面注释了依据）。
 *   质量：参数注册表里的 impact.quality 走进饱和收益曲线（1-e^-2x），过拐点后边际收益递减。
 *   成本：秒数 × 整机功率 × 电价。
 *
 * 为什么不用 eval 直接跑规则：规则文本来自 JSON，属于数据；这里只允许白名单函数与
 * 参数名，遇到可疑 token 直接判失败并回报，不静默执行。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.AVP = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const PREFIX = { ch: 'character', sb: 'storyboard', kf: 'keyframe', mo: 'motion', vo: 'voice', lk: 'look', ex: 'export' };
  const STAGE_PREFIX = { character: 'ch', storyboard: 'sb', keyframe: 'kf', motion: 'mo', voice: 'vo', look: 'lk', export: 'ex' };

  /* ───────────── 基础工具 ───────────── */

  function labelOf(p) {
    return typeof p.label === 'string' ? p.label : (p.label && (p.label.zh || p.label.en)) || p.key;
  }

  function byKey(reg) {
    const m = {};
    for (const p of reg.params) m[p.key] = p;
    return m;
  }

  function defaults(reg) {
    const v = {};
    for (const p of reg.params) v[p.key] = p.default;
    return v;
  }

  function norm(p, value) {
    if (['int', 'float', 'seed'].includes(p.type)) {
      const n = (value - p.min) / (p.max - p.min || 1);
      return Math.max(0, Math.min(1, n));
    }
    if (p.type === 'bool') return value ? 1 : 0;
    if (p.type === 'enum') {
      const i = p.options.indexOf(value);
      return p.options.length > 1 ? Math.max(0, i) / (p.options.length - 1) : 0;
    }
    return 0;
  }

  function coerce(p, value) {
    if (p.type === 'int' || p.type === 'seed') {
      const n = Math.round(Number(value));
      if (!Number.isFinite(n)) return p.default;
      return Math.max(p.min, Math.min(p.max, n));
    }
    if (p.type === 'float') {
      const n = Number(value);
      if (!Number.isFinite(n)) return p.default;
      return Math.max(p.min, Math.min(p.max, n));
    }
    if (p.type === 'bool') return !!value;
    if (p.type === 'enum') return p.options.includes(value) ? value : p.default;
    return value == null ? '' : String(value);
  }

  /* ───────────── 表达式（规则用） ───────────── */

  const BAD = /(;|`|\$\{|\b(window|document|fetch|eval|Function|import|require|process|globalThis|self|top|parent)\b|\bthis\b|=>)/;

  function scopeFor(values, ctx) {
    const s = { ch: {}, sb: {}, kf: {}, mo: {}, vo: {}, lk: {}, ex: {}, ctx: ctx || {} };
    for (const k in values) {
      const [p, a] = k.split('.');
      if (s[p]) s[p][a] = values[k];
    }
    s.character = s.ch; s.storyboard = s.sb; s.keyframe = s.kf;
    s.motion = s.mo; s.voice = s.vo; s.look = s.lk; s.export = s.ex;
    s.shot = { scale: values['sb.shot_scale'], duration: values['mo.duration'] };
    s.max = Math.max; s.min = Math.min; s.round = Math.round; s.abs = Math.abs;
    s.clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
    return s;
  }

  const fnCache = new Map();
  function compile(expr) {
    if (fnCache.has(expr)) return fnCache.get(expr);
    if (typeof expr !== 'string' || !expr.trim()) throw new Error('空表达式');
    if (BAD.test(expr)) throw new Error('表达式含非白名单 token：' + expr);
    // eslint-disable-next-line no-new-func
    const fn = new Function('__s', 'with (__s) { return (' + expr + '); }');
    fnCache.set(expr, fn);
    return fn;
  }

  function evalExpr(expr, scope) {
    return compile(expr)(scope);
  }

  /* ───────────── 预设 ───────────── */

  function applyPreset(reg, presetName) {
    const v = defaults(reg);
    const applied = [];
    for (const p of reg.params) {
      if (p.presets && p.presets[presetName] !== undefined) {
        v[p.key] = coerce(p, p.presets[presetName]);
        applied.push(p.key);
      }
    }
    return { values: v, applied };
  }

  /* ───────────── 联动求解 ───────────── */

  function resolve(reg, rulesSpec, inputValues, opts) {
    const map = byKey(reg);
    const values = { ...inputValues };
    const rules = (rulesSpec && rulesSpec.rules) || [];
    const ctx = (opts && opts.ctx) || {};
    const trace = [];
    const warnings = [];
    const autoWritten = {};

    for (let pass = 0; pass < 4; pass++) {
      let changed = false;
      const scope = scopeFor(values, ctx);
      for (const r of rules) {
        let hit = false;
        try { hit = !!evalExpr(r.if, scope); } catch (e) {
          trace.push({ id: r.id, error: String(e.message || e) });
          continue;
        }
        if (!hit) continue;

        if (r.then) {
          const m = /^\s*([a-z]+\.[A-Za-z0-9_]+)\s*=(?!=)\s*([\s\S]+)$/.exec(r.then);
          if (!m) { trace.push({ id: r.id, error: 'then 不是赋值形式' }); continue; }
          const target = m[1];
          const p = map[target];
          if (!p) { trace.push({ id: r.id, error: '未知目标 ' + target }); continue; }
          let next;
          try { next = evalExpr(m[2], scope); } catch (e) { trace.push({ id: r.id, error: String(e.message || e) }); continue; }
          next = coerce(p, next);
          if (values[target] !== next) {
            trace.push({ id: r.id, target, from: values[target], to: next, why: r.why || '' });
            values[target] = next;
            autoWritten[target] = r.id;
            changed = true;
          }
        }
        if (r.warn && !warnings.some((w) => w.id === r.id)) {
          warnings.push({ id: r.id, level: r.level || 'gray', text: r.warn, why: r.why || '' });
        }
      }
      if (!changed) break;
    }

    // 注册表自带的参数级护栏
    for (const p of reg.params) {
      if (!p.guards) continue;
      const v = values[p.key];
      for (const g of p.guards) {
        const m = /^\s*(>=|<=|==|!=|>|<)\s*(-?[\d.]+)\s*$/.exec(g.when);
        if (!m) continue;
        const op = m[1], x = parseFloat(m[2]), cur = Number(v);
        const hit = op === '>' ? cur > x : op === '<' ? cur < x : op === '>=' ? cur >= x : op === '<=' ? cur <= x : op === '==' ? cur === x : cur !== x;
        if (hit) warnings.push({ id: 'guard:' + p.key, level: 'gray', text: labelOf(p) + '：' + g.warn, why: g.when });
      }
    }

    return { values, warnings, trace, autoWritten };
  }

  /* ───────────── 显存 / 耗时 / 质量 / 成本 ───────────── */

  function ratioDims(ratio, longEdge) {
    const [a, b] = String(ratio).split(':').map(Number);
    const r = a / b;
    if (r >= 1) return { w: longEdge, h: Math.round((longEdge / r) / 16) * 16 };
    return { w: Math.round((longEdge * r) / 16) * 16, h: longEdge };
  }

  function shortResToHeight(res) {
    const m = /^(\d+)p$/.exec(String(res));
    return m ? Number(m[1]) : 480;
  }

  function residentOf(model, dtype) {
    if (!model || !model.resident_mib) return 0;
    const key = model.resident_mib[dtype] !== undefined ? dtype : Object.keys(model.resident_mib)[0];
    return model.resident_mib[key] || 0;
  }

  function pickModel(catalog, stage, id) {
    const list = (catalog.models && catalog.models[stage]) || [];
    return list.find((m) => m.id === id) || list[0] || null;
  }

  function dtypeOf(catalog, values, stage) {
    if (stage === 'keyframe' && /GGUF/i.test(String(values['kf.model']))) return 'gguf_q4';
    if (stage === 'i2v' && /GGUF/i.test(String(values['mo.i2v_model']))) return 'gguf_q4';
    return values['kf.dtype'] || 'fp8';
  }

  function vramBoost(reg, values, stage) {
    let b = 0;
    for (const p of reg.params) {
      if (p.stage !== stage) continue;
      b += (p.impact.vram || 0) * norm(p, values[p.key]);
    }
    return b;
  }

  function gain(x) {
    // 1 - e^{-2x} 归一化到 0..1：过拐点后边际收益递减，天然表达「32 步以后没意义」
    return (1 - Math.exp(-2 * Math.max(0, x))) / (1 - Math.exp(-2));
  }

  function estimate(reg, catalog, values, opts) {
    const o = opts || {};
    const devices = catalog.devices || [];
    const device = o.device ? devices.find((d) => d.id === o.device) || devices[0] : devices[0];
    const usable = o.usable_mib || device.usable_mib;
    const V = catalog.vram;
    const T = catalog.time;

    const kf = ratioDims(values['kf.ratio'], values['kf.resolution']);
    const kfMpix = (kf.w * kf.h) / 1e6;
    const kfModel = pickModel(catalog, 'keyframe', values['kf.model']);
    const kfDtype = dtypeOf(catalog, values, 'keyframe');
    const wKf = residentOf(kfModel, kfDtype);
    const actKf = V.act_c1_mib_per_mpix_frame * kfMpix;
    const decKf = values['kf.vae_tile'] ? V.dec_tile_mib_per_mpix * (V.tile_pixels / 1e6) : V.dec_full_mib_per_mpix_frame * kfMpix;
    // vram 影响只作用在激活/解码项（权重与开销是常量），并设 35% 上限，避免参数叠加把估算吹上天
    const boostKf = Math.min(0.35, vramBoost(reg, values, 'keyframe'));
    const kfPeak = wKf + (actKf + decKf) * (1 + boostKf) + V.overhead.keyframe;

    // 动效：只有局部 i2v / 粒子需要扩散；视差是纯 2.5D 合成
    const mode = values['mo.mode'];
    const frames = Math.max(1, Math.round(Math.min(values['mo.max_frames'], values['mo.fps'] * values['mo.duration'])));
    let i2vPeak = 0, i2vMpix = 0, i2vModel = null;
    if (mode === '局部i2v' || mode === '粒子') {
      // "480p" 指的是短边（高度），不是长边：先取高度再按比例反推宽度
      const h = shortResToHeight(values['mo.i2v_res']);
      const [rw, rh] = String(values['kf.ratio']).split(':').map(Number);
      const dims = { w: Math.round((h * rw / rh) / 16) * 16, h };
      i2vMpix = (dims.w * dims.h) / 1e6;
      i2vModel = pickModel(catalog, 'i2v', values['mo.i2v_model']);
      const wI2v = residentOf(i2vModel, dtypeOf(catalog, values, 'i2v'));
      const act = V.act_c1_mib_per_mpix_frame * i2vMpix * frames;
      const dec = values['kf.vae_tile'] ? V.dec_tile_mib_per_mpix * (V.tile_pixels / 1e6) : V.dec_full_mib_per_mpix_frame * i2vMpix * frames;
      const boostMo = Math.min(0.35, vramBoost(reg, values, 'motion'));
      i2vPeak = wI2v + (act + dec) * (1 + boostMo) + V.overhead.i2v;
    }

    let voicePeak = 0, voiceModel = null;
    if (values['vo.lipsync']) {
      voiceModel = pickModel(catalog, 'voice', values['vo.lipsync_model']);
      voicePeak = residentOf(voiceModel, values['kf.dtype'] === 'fp16' ? 'fp16' : 'fp8') + V.overhead.voice;
    }

    const stages = [
      { stage: 'keyframe', label: '关键帧', peak_mib: Math.round(kfPeak), weights: Math.round(wKf), act: Math.round(actKf), decode: Math.round(decKf), overhead: V.overhead.keyframe, model: kfModel ? kfModel.id : '-', dtype: kfDtype },
      { stage: 'motion', label: '动效 i2v', peak_mib: Math.round(i2vPeak), weights: i2vModel ? Math.round(residentOf(i2vModel, dtypeOf(catalog, values, 'i2v'))) : 0, act: Math.round(V.act_c1_mib_per_mpix_frame * i2vMpix * frames), decode: Math.round(V.dec_tile_mib_per_mpix * (V.tile_pixels / 1e6)), overhead: V.overhead.i2v, model: i2vModel ? i2vModel.id : '-', dtype: dtypeOf(catalog, values, 'i2v') },
      { stage: 'voice', label: '口型', peak_mib: Math.round(voicePeak), weights: voiceModel ? Math.round(residentOf(voiceModel, values['kf.dtype'] === 'fp16' ? 'fp16' : 'fp8')) : 0, act: 0, decode: 0, overhead: V.overhead.voice, model: voiceModel ? voiceModel.id : '-', dtype: 'fp8' },
    ];
    const peak = Math.max(kfPeak, i2vPeak, voicePeak);
    const ratio = usable ? peak / usable : 0;
    const state = ratio > 1 ? 'block' : ratio > V.safety_ratio ? 'warn' : 'ok';
    const dominant = stages.slice().sort((a, b) => b.peak_mib - a.peak_mib)[0];

    /* 耗时 */
    const stepF = values['kf.steps'] / T.kf_ref_steps;             // 步数线性
    const pixF = Math.pow(kfMpix / (T.kf_ref_pixels / 1e6), 1.15);  // 像素超线性（注意力是平方项，但 VAE 解码是线性，取 1.15 折中）
    const refineF = 1 + (values['kf.refine_scale'] - 1) * 0.6;      // 精修放大：1.5× → +30%
    const modelF = kfModel ? kfModel.t_factor : 1;
    const batchF = values['kf.batch'];
    const anchorF = 1 + values['kf.anchor_count'] * T.kf_anchor_gain; // 每个锚点重跑一次缩水精修
    const kfSec = T.kf_base_sec * stepF * pixF * refineF * modelF * anchorF * batchF;

    let motionSec = 0;
    if (mode === '视差') motionSec = T.parallax_base_sec * (1 + values['mo.parallax_layers'] * 0.15);
    else if (mode === '局部i2v' && i2vModel) {
      const frameF = Math.pow(frames / T.i2v_ref_frames, 1.1);
      motionSec = T.i2v_base_sec * (i2vMpix / (T.i2v_ref_pixels / 1e6)) * frameF * i2vModel.t_factor * (0.6 + values['mo.i2v_strength']);
    } else if (mode === '粒子') motionSec = 4 * (1 + values['mo.particle_count'] / 600);

    const outPixels = values['ex.resolution'] === '4K' ? 8.29e6 : values['ex.resolution'] === '1440p' ? 3.69e6 : values['ex.resolution'] === '720p' ? 0.92e6 : 2.07e6;
    const postSec = T.post_base_sec * (outPixels / 2.07e6) * (values['mo.interp'] ? 1.25 : 1) * (1 + values['lk.deflicker'] / 400);
    const voiceSec = values['vo.lipsync'] ? T.voice_base_sec * (values['vo.voice_clone'] ? 1.25 : 1) : 8;

    const shotSec = kfSec + motionSec + postSec + voiceSec;
    const shots = values['sb.grid_count'];
    const episodeSec = shotSec * shots + T.llm_base_sec * (1 + values['sb.retry'] * 0.5) + T.encode_base_sec;
    const batchSec = episodeSec * values['sb.episode_count'];

    const time = {
      shot_sec: Math.round(shotSec),
      episode_sec: Math.round(episodeSec),
      batch_sec: Math.round(batchSec),
      episode_min: +(episodeSec / 60).toFixed(1),
      batch_min: +(batchSec / 60).toFixed(1),
      breakdown: [
        { key: 'kf', label: '关键帧+锚点', sec: Math.round(kfSec), pct: Math.round((kfSec / shotSec) * 100) },
        { key: 'motion', label: mode === '局部i2v' ? '局部 i2v' : mode, sec: Math.round(motionSec), pct: Math.round((motionSec / shotSec) * 100) },
        { key: 'post', label: '超分/补帧/调色', sec: Math.round(postSec), pct: Math.round((postSec / shotSec) * 100) },
        { key: 'voice', label: '配音/口型', sec: Math.round(voiceSec), pct: Math.round((voiceSec / shotSec) * 100) },
      ],
    };

    /* 质量 */
    let qSum = 0;
    const qTop = [];
    for (const p of reg.params) {
      const q = p.impact.quality || 0;
      if (!q) continue;
      const g = gain(norm(p, values[p.key]));
      const contrib = q * g;
      qSum += contrib;
      qTop.push({ key: p.key, label: labelOf(p), contrib: +contrib.toFixed(3) });
    }
    qTop.sort((a, b) => b.contrib - a.contrib);
    // 归一分母 8.0 由默认参数 qSum≈6.1 → 78 分反解；cinematic 预设约 82–86，draft 约 58–62
    const quality = Math.max(20, Math.min(99, Math.round(38 + 52 * Math.min(1, qSum / 8))));

    /* 成本 */
    const kwhPerSec = (device.watts / 1000) / 3600;
    const cost = {
      shot_yuan: +(shotSec * kwhPerSec * device.price_yuan_per_kwh).toFixed(4),
      episode_yuan: +(episodeSec * kwhPerSec * device.price_yuan_per_kwh).toFixed(4),
      batch_yuan: +(batchSec * kwhPerSec * device.price_yuan_per_kwh).toFixed(3),
      watts: device.watts,
      price: device.price_yuan_per_kwh,
    };

    return {
      device: { id: device.id, name: device.name, usable_mib: usable, vram_total_mib: device.vram_total_mib, provenance: device.provenance },
      vram: { peak_mib: Math.round(peak), usable_mib: usable, ratio: +ratio.toFixed(3), state, safety: V.safety_ratio, headroom_mib: Math.round(usable - peak), dominant: dominant.stage, stages },
      time,
      quality: { score: quality, qSum: +qSum.toFixed(3), top: qTop.slice(0, 6) },
      cost,
      dims: { kf, i2v: i2vMpix ? ratioDims(values['kf.ratio'], shortResToHeight(values['mo.i2v_res'])) : null, frames },
    };
  }

  /* ───────────── 降档建议（红线自动给三套等价方案） ───────────── */

  function degrade(reg, catalog, rulesSpec, values, opts) {
    // 候选方案必须走一遍联动求解再估算，否则规则会把降下来的参数又顶回去（例如分辨率>1024 压低帧数）
    const settle = (v) => (rulesSpec ? resolve(reg, rulesSpec, v, { ctx: (opts && opts.ctx) || {} }).values : v);
    values = settle(values);
