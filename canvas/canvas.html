  const MAP = AVP.byKey(REG);
  const DEFAULT_VALUES = AVP.defaults(REG);
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const labelOf = (p) => (typeof p.label === 'string' ? p.label : p.key);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const deviceOf = (id) => CAT.devices.find((d) => d.id === id) || CAT.devices[0];

  /* ───────── 状态 ───────── */

  /* Canvas2D 不认 CSS 变量：把 var(--x) 传给 fillStyle 会静默失效（保持上一次颜色或变黑）。
     所以绘制色必须在启动时读成具体值。只读一次——主题是静态的，不需要监听变化。 */
  const TK = (() => {
    const cs = getComputedStyle(document.documentElement);
    const v = (n, fb) => (cs.getPropertyValue(n) || '').trim() || fb;
    return {
      acc: v('--acc', '#c8cdd4'), accDim: v('--acc-dim', '#878c94'),
      ok: v('--ok', '#7d9b84'), warn: v('--warn', '#b3985a'), bad: v('--bad', '#6b2020'),
      bgDeep: v('--bg-deep', '#060608'), panel: v('--panel', '#141416'),
      panel2: v('--panel2', '#1b1b1f'), panel3: v('--panel3', '#232328'),
      line: v('--line', '#2a2a2f'), line2: v('--line2', '#3a3a41'), line3: v('--line3', '#575761'),
      text: v('--text', '#b8bec6'), textDim: v('--text-dim', '#8b9098'),
      tModel: v('--t-model', '#8d84a0'), tLatent: v('--t-latent', '#a08489'),
      tImage: v('--t-image', '#a09678'), tNumber: v('--t-number', '#7f948c'), tText: v('--t-text', '#84909f'),
    };
  })();

  const LS_KEY = 'avp.canvas.v1';
  const S = {
    user: Object.assign({}, DEFAULT_VALUES),   // 用户原始输入（唯一持久化的口径）
    values: Object.assign({}, DEFAULT_VALUES), // 求解后的生效值（界面全部读这个）
    view: 'wizard',
    stage: 'character',
    wizard: 0,
    device: CAT.devices[0].id,
    preset: 'standard',
    expert: false,
    cam: null,      // 节点视图的平移/缩放，null=等画布尺寸算好后自适应
    nodes: {},      // 节点位置覆盖（用户拖过的才算）
    links: [],      // 用户自定义连线
  };

  let RESOLVED = null, REPORT = null, REWRITE = new Map(), PRESET_APPLIED = 0;

  function saveNow() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        values: S.user, view: S.view, stage: S.stage, wizard: S.wizard,
        device: S.device, preset: S.preset, expert: S.expert,
        cam: S.cam, nodes: S.nodes, links: S.links,
      }));
    } catch (e) { /* 隐私模式下 localStorage 会抛错，界面不该因此崩掉 */ }
  }
  let saveTimer = 0;
  function saveLater() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (e) { return; }
    if (!raw) return;
    let p;
    try { p = JSON.parse(raw); } catch (e) { return; }
    if (!p || typeof p !== 'object') return;
    // 只认注册表里还存在的 key：注册表升版后旧存档不能把界面带崩
    for (const k in p.values || {}) {
      if (!MAP[k]) continue;
      S.user[k] = AVP.coerce(MAP[k], p.values[k]);
    }
    S.values = Object.assign({}, S.user);
    if (['wizard', 'params', 'nodes'].includes(p.view)) S.view = p.view;
    if (REG.stages.some((s) => s.id === p.stage)) S.stage = p.stage;
    if (Number.isInteger(p.wizard)) S.wizard = clamp(p.wizard, 0, REG.stages.length - 1);
    if (CAT.devices.some((d) => d.id === p.device)) S.device = p.device;
    if (['draft', 'standard', 'cinematic'].includes(p.preset)) S.preset = p.preset;
    S.expert = !!p.expert;
    if (p.cam && isFinite(p.cam.x) && isFinite(p.cam.y) && isFinite(p.cam.k)) S.cam = p.cam;
    if (p.nodes && typeof p.nodes === 'object') {
      for (const id in p.nodes) {
        const n = p.nodes[id];
        if (n && isFinite(n.x) && isFinite(n.y)) S.nodes[id] = { x: n.x, y: n.y };
      }
    }
    if (Array.isArray(p.links)) {
      S.links = p.links.filter((l) => l && typeof l.from === 'string' && typeof l.to === 'string').slice(0, 40);
    }
  }

  /* ───────── 外壳桥：与工作台共用同一份项目真相 ─────────
     启动时读外壳活跃项目（avp.shell.store.v1）覆盖本地存档的参数口径；
     改动后写回，已配置状态按状态机语义打回草稿。无外壳项目时独立运行。 */
  const SHELL_KEY = 'avp.shell.store.v1';
  const SHELL_SCHEMA = 'ai-video-platform/shell.store';
  let BRIDGE = null;
  let bwTimer = 0;

  function bridgeRead() {
    try {
      const raw = localStorage.getItem(SHELL_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.schema !== SHELL_SCHEMA || !s.projects || !s.active) return null;
      const p = s.projects[s.active];
      return p && p.values ? { store: s, project: p } : null;
    } catch (e) { return null; }
  }

  function bridgeLoad() {
    const b = bridgeRead();
    if (!b) return false;
    const p = b.project;
    for (const k in p.values) {
      if (MAP[k]) S.user[k] = AVP.coerce(MAP[k], p.values[k]);
    }
    S.values = Object.assign({}, S.user);
    if (p.device && CAT.devices.some((d) => d.id === p.device)) S.device = p.device;
    if (['draft', 'standard', 'cinematic'].includes(p.tier)) S.preset = p.tier;
    BRIDGE = { id: p.id, name: p.name, state: p.state };
    return true;
  }

  function bridgeWrite(note) {
    if (!BRIDGE) return;
    const b = bridgeRead();
    if (!b || b.project.id !== BRIDGE.id) { BRIDGE = null; return; }
    const p = b.project;
    p.values = S.user;
    p.device = S.device;
    p.updatedAt = new Date().toISOString();
    if (p.state === 'configured') {
      p.history = (p.history || []).concat([{ at: p.updatedAt, action: 'restart', label: '新起一轮', from: 'configured', to: 'draft', note: note || '画布改动' }]).slice(-40);
      p.state = 'draft';
      BRIDGE.state = 'draft';
      toast('参数已变更：外壳项目回到「草稿」，需重新确认配置');
    }
    try { localStorage.setItem(SHELL_KEY, JSON.stringify(b.store)); } catch (e) { /* 写失败不阻断调参 */ }
  }

  function bridgeQueue(note) {
    if (!BRIDGE) return;
    clearTimeout(bwTimer);
    bwTimer = setTimeout(() => bridgeWrite(note), 300);
  }

  /* ───────── 求解：唯一入口 ───────── */

  function compute() {
    const d = deviceOf(S.device);
    RESOLVED = AVP.resolve(REG, RULES, S.user, { ctx: { usable_mib: d.usable_mib, device: d.id } });
    // 生效值单独放 S.values：控件、估算、节点都读它；S.user 保持用户原样，用于持久化和"已自定义"判断
    S.values = RESOLVED.values;
    REPORT = AVP.estimate(REG, CAT, S.values, { device: d.id });
    REWRITE = new Map();
    for (const t of RESOLVED.trace) {
      if (!t.target) continue;
      // 同一目标被多遍规则反复改时，保留最后一次（最靠近最终值）的说明
      REWRITE.set(t.target, { id: t.id, from: t.from, to: t.to, why: t.why || '' });
    }
  }

  // 250ms 内必须看到新数字：拖滑块会连发 input，所以用 130ms 防抖 + 尾调用，
  // 既不会每帧重算也不会让用户觉得"卡住没反应"
  let updateTimer = 0;
  function scheduleUpdate(source) {
    finalizeEdit(source);
    if (updateTimer) return;
    updateTimer = setTimeout(() => {
      updateTimer = 0;
      compute();
      syncBoundControls(source);
      refreshMarks();
      renderEstimator();
      renderChrome();
      scheduleWizardNumbers();
      saveLater();
      markCanvasDirty();
    }, 130);
  }

  /* ───────── 小工具：toast / tip ───────── */

  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
  }

  const tipEl = $('#tip');
  function showTip(html, x, y) {
    tipEl.textContent = html;
    tipEl.classList.add('on');
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = clamp(x + 14, 8, window.innerWidth - w - 10) + 'px';
    tipEl.style.top = clamp(y - h - 10, 8, window.innerHeight - h - 10) + 'px';
  }
  function hideTip() { tipEl.classList.remove('on'); }

  // 联动说明走同一个 tooltip：点/悬浮被改写的参数都能看到"哪条规则、从多少改到多少"
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return;
    showTip(el.getAttribute('data-tip'), e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', (e) => {
    if (!tipEl.classList.contains('on')) return;
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { hideTip(); return; }
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = clamp(e.clientX + 14, 8, window.innerWidth - w - 10) + 'px';
    tipEl.style.top = clamp(e.clientY - h - 10, 8, window.innerHeight - h - 10) + 'px';
  });
  document.addEventListener('mouseout', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hideTip();
  });

  /* ───────── 控件工厂（向导 / 参数 / 节点抽屉共用一套） ───────── */

  function fmtVal(p, v) {
    if (p.type === 'bool') return v ? '开' : '关';
    if (p.type === 'float') return String(v);
    return String(v) + (p.unit ? ' ' + p.unit : '');
  }

  /* 采样器/调度器：存储值是机读枚举，界面显示业界写法（DPM++ 2M SDE Karras） */
  const SAMPLER_LABEL = { euler: 'Euler', euler_a: 'Euler a', dpmpp_2m: 'DPM++ 2M', dpmpp_2m_sde: 'DPM++ 2M SDE', dpmpp_3m_sde: 'DPM++ 3M SDE', uni_pc: 'UniPC', lcm: 'LCM', ddim: 'DDIM' };
  const SCHED_LABEL = { normal: 'Normal', karras: 'Karras', exponential: 'Exponential', sgm_uniform: 'SGM Uniform', beta: 'Beta' };
  const enumLabel = (key, x) => key.endsWith('.sampler') ? (SAMPLER_LABEL[x] || x) : key.endsWith('.scheduler') ? (SCHED_LABEL[x] || x) : x;

  function controlHtml(p, v, opts) {
    const o = opts || {};
    const key = p.key, id = o.idPrefix ? o.idPrefix + key : '';
    if (p.type === 'bool') {
      return `<div class="switch${v ? ' on' : ''}" role="switch" aria-checked="${v ? 'true' : 'false'}" data-key="${key}" data-type="bool"${id ? ` id="${id}"` : ''}></div>`;
    }
    if (p.type === 'enum') {
      const opts2 = (p.options || []).map((x) => `<option value="${esc(x)}"${x === v ? ' selected' : ''}>${esc(enumLabel(key, x))}</option>`).join('');
      return `<select data-key="${key}" data-type="enum"${id ? ` id="${id}"` : ''}>${opts2}</select>`;
    }
    if (p.type === 'seed') {
      return `<input type="number" class="num" data-key="${key}" data-type="seed" value="${v}" step="1"${id ? ` id="${id}"` : ''}>`;
    }
    if (p.type === 'text') {
      return `<textarea data-key="${key}" data-type="text" rows="2"${id ? ` id="${id}"` : ''}>${esc(v)}</textarea>`;
    }
    return `<div class="ctrl">
      <input type="range" data-key="${key}" data-type="${p.type}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}"${id ? ` id="${id}"` : ''}>
      <input type="number" class="num" data-key="${key}" data-type="${p.type}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}">
      <span class="unit">${esc(p.unit || '')}</span>
    </div>`;
  }

  // 显存/耗时/质量三联：条长给量级感，数字给精度（注册表 impact 是相对权重，不是绝对值）
  function impactHtml(p) {
    const im = p.impact || { vram: 0, time: 0, quality: 0 };
    const one = (cls, label, x) => `<div class="imp ${cls}${x ? '' : ' zero'}" data-tip="${label}影响权重 ${x}${x ? '（相对量级，用来横向比较参数代价）' : '（该参数只改语义，不改算力）'}">
      <span>${x ? Number(x).toFixed(2).replace(/^0/, '') : '·'}</span>
      <i><b style="width:${clamp(Math.round(x * 260), 0, 100)}%"></b></i></div>`;
    return `<div class="impacts" data-tip="impact 三联：显存 / 耗时 / 质量。注册表里的相对权重，用来横向比较参数代价">${one('v', '显存', im.vram || 0)}${one('t', '耗时', im.time || 0)}${one('q', '质量', im.quality || 0)}</div>`;
  }

  const boundRoots = new WeakSet();
  function bindControls(root) {
    if (!root || boundRoots.has(root)) return;
    boundRoots.add(root);
    root.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset || !el.dataset.key) return;
      if (el.dataset.type === 'bool') return; // bool 交给 click，input 事件里处理会和 click 打架
      setParam(el.dataset.key, el.value, el);
    });
    root.addEventListener('change', (e) => {
      const el = e.target;
      if (!el.dataset || !el.dataset.key) return;
      if (el.tagName === 'SELECT' || el.dataset.type === 'text') setParam(el.dataset.key, el.value, el);
    });
    root.addEventListener('click', (e) => {
      const t = e.target;
      if (t.classList && t.classList.contains('switch') && t.dataset.key) {
        setParam(t.dataset.key, !t.classList.contains('on'), t);
        return;
      }
      const rs = t.closest && t.closest('[data-restore]');
      if (rs) { setParam(rs.dataset.restore, MAP[rs.dataset.restore].default, null); return; }
    });
  }

  function setParam(key, raw, src) {
    const p = MAP[key];
    if (!p) return;
    const v = AVP.coerce(p, raw);
    if (S.user[key] === v) return;
    S.user[key] = v;
    S.values[key] = v;
    // 控件自己已经是最新值，其余同 key 控件（滑块+数字框 / 向导+参数视图同时挂载）靠这里同步
    syncBoundControls(src);
    scheduleUpdate(src);
    bridgeQueue('画布改动 ' + key);
  }

  // 记录本次编辑的控件，防抖回算后不回写它——否则用户正在拖的滑块会被"校正"回去
  let editingEl = null;
  function finalizeEdit(src) { if (src) editingEl = src; }

  function syncBoundControls(except) {
    $$('[data-key]').forEach((el) => {
      if (el === except) return;
      // 正在输入的那个框不覆盖，否则光标会被重置、数字会跳
      if (el === editingEl && document.activeElement === el) return;
      const k = el.dataset.key;
      const p = MAP[k];
      if (!p) return;
      const v = S.values[k];
      if (el.dataset.type === 'bool') {
        const on = !!v;
        if (el.classList.contains('on') !== on) {
          el.classList.toggle('on', on);
          el.setAttribute('aria-checked', on ? 'true' : 'false');
        }
        return;
      }
      if (el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') {
        if (document.activeElement === el) return;
        if (el.value !== String(v)) el.value = v;
        return;
      }
      if (document.activeElement === el) return;
      const s = String(v);
      if (el.value !== s) el.value = s;
    });
    // 数值回写后，向导/抽屉里的"当前值"文本也要跟着走
    $$('[data-val]').forEach((el) => {
      const p = MAP[el.dataset.val];
      if (p) el.textContent = fmtVal(p, S.values[p.key]);
    });
    if (editingEl && document.activeElement !== editingEl) editingEl = null;
  }

  /* ───────── 联动可视化 ───────── */

  function ruleTip(key) {
    const r = REWRITE.get(key);
    if (!r) return '';
    const p = MAP[key];
    const from = p ? fmtVal(p, r.from) : r.from;
    const to = p ? fmtVal(p, r.to) : r.to;
    return `规则 ${r.id} 把你的值从 ${from} 改成 ${to}${r.why ? ' —— ' + r.why : ''}`;
  }

  function refreshMarks() {
    $$('[data-row]').forEach((row) => {
      const k = row.dataset.row;
      const p = MAP[k];
      const hit = REWRITE.has(k);
      row.classList.toggle('hit', hit);
      row.classList.toggle('custom', p && S.user[k] !== p.default);
      const badge = $('[data-auto]', row);
      if (badge) {
        badge.style.display = hit ? '' : 'none';
        badge.dataset.tip = hit ? ruleTip(k) : '';
        badge.textContent = hit ? '联动 ' + REWRITE.get(k).id : '';
      }
      const diff = $('[data-diff]', row);
      if (diff) diff.style.display = p && S.user[k] !== p.default ? '' : 'none';
      row.removeAttribute('data-tip');
      if (hit) row.setAttribute('data-tip', ruleTip(k));
    });
    if (curDirty) renderFooterNumbers();
  }

  function dirtyKeys() {
    return Object.keys(S.user).filter((k) => MAP[k] && S.user[k] !== DEFAULT_VALUES[k]);
  }

  /* ───────── 右下实时估算 ───────── */

  const STATE_TEXT = { ok: '显存安全', warn: '接近上限', block: '超出预算' };

  function renderEstimator() {
    if (!REPORT) return;
    const v = REPORT.vram, t = REPORT.time, q = REPORT.quality;
    const pct = clamp(v.ratio * 100, 0, 999);
    const barColor = v.state === 'ok' ? 'var(--acc)' : v.state === 'warn' ? 'var(--warn)' : 'var(--bad)';
    const d = deviceOf(S.device);
    const alerts = [];
    if (v.state === 'block') {
      alerts.push(`<div class="alert block"><i>BLOCK</i><span>显存 ${v.peak_mib}MiB / 可用 ${v.usable_mib}MiB（${(v.ratio * 100).toFixed(0)}%），当前组合跑不起来。先降关键帧分辨率或换 <b>GGUF-Q4</b>。</span></div>`);
    } else if (v.state === 'warn') {
      alerts.push(`<div class="alert warn"><i>WARN</i><span>显存 ${(v.ratio * 100).toFixed(0)}%，余量只剩 ${v.headroom_mib}MiB，桌面占一点就爆。</span></div>`);
    }
    (RESOLVED.warnings || []).forEach((w) => {
      const lv = w.level === 'red' || w.level === 'block' ? 'block' : w.level === 'yellow' || w.level === 'warn' ? 'warn' : 'gray';
      alerts.push(`<div class="alert ${lv}"><i>${lv === 'block' ? 'BLOCK' : lv === 'warn' ? 'WARN' : 'NOTE'}</i><span>${esc(w.text)}</span></div>`);
    });
    const shown = alerts.slice(0, 5);
    const more = alerts.length - shown.length;

    $('#estimator').innerHTML = `
      <div class="est-head"><span class="pulse"></span>实时估算<span class="dev">${esc(d.id)} · ${esc(d.name)}</span></div>
      <div class="est-vram">
        <b style="color:${v.state === 'ok' ? 'var(--acc)' : v.state === 'warn' ? 'var(--warn)' : 'var(--bad-ink)'}">${pct.toFixed(1)}<small>%</small></b>
        <small>显存 ${v.peak_mib} / ${v.usable_mib} MiB</small>
        <span class="st ${v.state}" style="margin-left:auto">${STATE_TEXT[v.state]}</span>
      </div>
      <div class="bar"><i style="width:${clamp(pct, 0, 100)}%;background:${barColor}"></i><span class="tick" style="left:${(v.safety * 100).toFixed(1)}%" title="安全线 ${(v.safety * 100).toFixed(0)}%"></span></div>
      <div class="est-grid">
        <div><span>单格</span><b>${t.shot_sec}<em> s</em></b></div>
        <div><span>单集</span><b>${t.episode_min}<em> min</em></b></div>
        <div><span>质量分</span><b>${q.score}</b></div>
        <div><span>主导阶段</span><b>${esc(v.dominant || '-')}</b></div>
      </div>
      <div class="est-alerts">${shown.join('')}${more > 0 ? `<div class="alert gray"><i>+${more}</i><span>另有 ${more} 条提示，改到对应参数后会自动消失</span></div>` : ''}</div>
      <div class="est-link" data-tip="联动改写：求解器按 ${RULES.rules.length} 条规则重算后，与你的原值不同的参数数量。悬浮带「联动」徽标的参数可看具体规则。">
        <span>↻</span>联动改写 ${REWRITE.size} 项 · 已自定义 ${dirtyKeys().length} 项
      </div>`;
  }

  /* ───────── 顶栏 / 底栏 ───────── */

  let curDirty = false;
  function renderFooterNumbers() {
    $('#fDirty').textContent = dirtyKeys().length;
  }

  function renderChrome() {
    $$('#viewSwitch button').forEach((b) => b.classList.toggle('on', b.dataset.view === S.view));
    $$('#presets button').forEach((b) => b.classList.toggle('on', b.dataset.preset === S.preset));
    $('#device').value = S.device;
    $('#fVer').textContent = REG.version;
    $('#fCount').textContent = REG.counts.total;
    $('#fRules').textContent = RULES.rules.length;
    curDirty = true;
    renderFooterNumbers();
    const st = REPORT ? REPORT.vram.state : 'ok';
    $('#fState').textContent = `显存 ${(REPORT.vram.ratio * 100).toFixed(1)}% · ${STATE_TEXT[st]}`;
    document.title = `画布 ${(REPORT.vram.ratio * 100).toFixed(0)}% · ${STATE_TEXT[st]}`;
  }

  /* ───────── 视图 / 板块切换 ───────── */

  function setView(v) {
    S.view = v;
    $$('.view').forEach((el) => el.classList.toggle('on', el.id === 'view-' + v));
    renderChrome();
    if (v === 'nodes') {
      ensureNodeCanvas();
      if (!cv.raf) loop();
      requestAnimationFrame(() => { resizeCanvas(); markCanvasDirty(); });
    } else if (v === 'wizard') {
      renderWizard();
    } else {
      renderRail();
      renderBoard();
    }
    saveLater();
  }

  function setStage(id, opts) {
    if (!REG.stages.some((s) => s.id === id)) return;
    S.stage = id;
    const idx = REG.stages.findIndex((s) => s.id === id);
    if (!opts || opts.syncWizard !== false) S.wizard = idx;
    renderRail();
    renderBoard();
    if (S.view === 'wizard') renderWizard();
    if (S.view === 'nodes' && nodeState.open && nodeState.open.stage === id) renderNodePanel(reg_stage(id));
    saveLater();
  }
  function reg_stage(id) { return REG.stages.find((s) => s.id === id); }

  /* ───────── 启动 ───────── */
  load();
  const linked = bridgeLoad();
  compute();
  if (linked) toast('已衔接外壳项目「' + BRIDGE.name + '」：参数与设备档已载入');

  // 设备下拉：把每档可用显存写在标签里，避免用户不知道 T0 只有 6.9G 可用
  $('#device').innerHTML = CAT.devices
    .map((d) => `<option value="${esc(d.id)}">${esc(d.id)} · ${esc(d.name)} · 可用 ${(d.usable_mib / 1024).toFixed(1)}G</option>`)
    .join('');
  $('#device').value = S.device;

  $('#viewSwitch').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]');
    if (b) setView(b.dataset.view);
  });
  $('#presets').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-preset]');
    if (!b) return;
    const res = AVP.applyPreset(REG, b.dataset.preset);
    let n = 0;
    for (const k of res.applied) { S.user[k] = res.values[k]; S.values[k] = res.values[k]; n++; }
    S.preset = b.dataset.preset;
    compute(); syncBoundControls(null); refreshMarks(); renderEstimator(); renderChrome();
    if (S.view === 'wizard') renderWizard(); else renderBoard();
    saveLater();
    bridgeQueue('画布套用预设 ' + b.dataset.preset);
    toast(`已套用「${b.textContent}」预设：${n} 个参数按 ${b.dataset.preset} 档取值`);
  });
  $('#device').addEventListener('change', (e) => {
    S.device = e.target.value;
    compute(); renderEstimator(); renderChrome(); renderRail(); renderBoard();
    if (S.view === 'wizard') renderWizard();
    if (S.view === 'nodes') markCanvasDirty();
    saveLater();
    bridgeQueue('画布设备档变更');
  });
  $('#resetBtn').addEventListener('click', () => {
    S.user = Object.assign({}, DEFAULT_VALUES);
    S.values = Object.assign({}, DEFAULT_VALUES);
    compute(); syncBoundControls(null); refreshMarks(); renderEstimator(); renderChrome();
    if (S.view === 'wizard') renderWizard(); else renderBoard();
    saveLater();
    bridgeQueue('画布全部还原');
    toast('已还原全部 258 个参数');
  });

  /* ───────── 预设导入导出（纯本地 Blob，不联网） ───────── */

  $('#exportBtn').addEventListener('click', () => {
    const preset = AVP.exportPreset(REG, S.values, { name: 'canvas-' + Date.now(), device: S.device });
    const blob = new Blob([JSON.stringify(preset, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `avp-preset-${S.device}-${(REPORT.vram.ratio * 100).toFixed(0)}pct.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast(`已导出预设（${Object.keys(preset.values || {}).length} 参数 · checksum ${preset.checksum}）`);
  });

  $('#importBtn').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let preset = null;
      try { preset = JSON.parse(String(rd.result)); } catch (err) { toast('导入失败：不是合法 JSON'); return; }
      let res;
      try { res = AVP.importPreset(REG, preset); } catch (err) { toast('导入失败：' + err.message); return; }
      S.user = Object.assign({}, res.values);
      S.values = Object.assign({}, res.values);
      compute(); syncBoundControls(null); refreshMarks(); renderEstimator(); renderChrome();
      if (S.view === 'wizard') renderWizard(); else renderBoard();
      saveLater();
      bridgeQueue('画布导入预设');
      toast(`已导入：${Object.keys(preset.values || {}).length} 参数${res.unknown.length ? ` · 忽略 ${res.unknown.length} 个未知键` : ''}${res.checksum_ok ? ' · 校验通过' : ' · 校验不匹配（仍已应用）'}`);
    };
    rd.readAsText(f, 'utf-8');
    e.target.value = '';
  });

  /* 键盘：1/2/3 切视图；向导视图里 ←/→ 进退一步；Esc 关抽屉 */
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === '1') setView('wizard');
    else if (e.key === '2') setView('params');
    else if (e.key === '3') setView('nodes');
    else if (e.key === 'Escape') {
      closeNodePanel();
      if (cv.sel.size) { cv.sel.clear(); markCanvasDirty(); }
    }
    else if (S.view === 'wizard' && e.key === 'ArrowRight') stepWizard(1);
    else if (S.view === 'wizard' && e.key === 'ArrowLeft') stepWizard(-1);
  });

  window.addEventListener('beforeunload', saveNow);

/* ══════════ 向导视图 ══════════
     向导只做一件事：把 258 个参数收敛成"每步 4 个决定 + 一句人话"。
     哪 4 个是写死的——按"小白真的会犹豫的那几项"挑，而不是按组件顺序挑。 */

  const STEP_KEYS = {
    character: ['ch.subject', 'ch.style', 'ch.face_shape', 'ch.consistency'],
    storyboard: ['sb.duration', 'sb.grid_count', 'sb.rhythm', 'sb.shot_scale'],
    keyframe: ['kf.resolution', 'kf.ratio', 'kf.steps', 'kf.refine_scale'],
    motion: ['mo.mode', 'mo.camera', 'mo.strength', 'mo.duration'],
    voice: ['vo.voice_id', 'vo.emotion', 'vo.speed', 'vo.lipsync'],
    look: ['lk.lut', 'lk.lut_strength', 'lk.grain', 'lk.sharpen'],
    export: ['ex.resolution', 'ex.fps', 'ex.bitrate', 'ex.codec'],
  };

  const STEP_SAY = {
    character: '先把主角定下来：一句话写清长相和衣服，再选画风。这一步定了，后面每一格都是这张脸。',

  };

  const STEP_NOTE = {
    character: '一致性权重超过 1.2 构图会变僵；动效里的运动强度还会自动把它往上抬（规则 identity-under-motion）。',

  // 只说"这项是干嘛的"，不复述取值范围——范围看控件本身更直观
  const PLAIN = {

  // 推荐值分档：有 presets 的参数听求解器的，没有的用这张兜底表，
  // 否则"本步推荐值"在某些板块会一个参数都不动
  const REC = {
    draft: {
      'ch.age': 22, 'ch.style': '赛璐璐', 'ch.consistency': 0.75,
      'sb.duration': 30, 'sb.grid_count': 16, 'sb.rhythm': '快', 'sb.shot_scale': '中景',
      'kf.resolution': 1024, 'kf.steps': 12, 'kf.refine_scale': 1.2,

      'vo.emotion': '温柔', 'vo.speed': 1, 'vo.lipsync': true,
      'lk.lut': '东方暖调', 'lk.lut_strength': 70, 'lk.grain': 12, 'lk.sharpen': 30,
      'ex.resolution': '1080p', 'ex.fps': 24, 'ex.bitrate': 12, 'ex.codec': 'H.264',
    },
    cinematic: {
      'ch.age': 24, 'ch.style': '厚涂', 'ch.consistency': 1,
      'sb.duration': 45, 'sb.grid_count': 32, 'sb.rhythm': '慢', 'sb.shot_scale': '特写',
      'kf.resolution': 2048, 'kf.steps': 36, 'kf.refine_scale': 1.8,
      'mo.mode': '局部i2v', 'mo.camera': '环绕', 'mo.strength': 0.7, 'mo.duration': 2,
      'vo.emotion': '温柔', 'vo.speed': 1, 'vo.lipsync': true,
      'lk.lut': '胶片', 'lk.lut_strength': 85, 'lk.grain': 25, 'lk.sharpen': 40,
      'ex.resolution': '1440p', 'ex.fps': 30, 'ex.bitrate': 20, 'ex.codec': 'H.265',
    },
  };
  const REC_LABEL = { draft: '草稿', standard: '标准', cinematic: '电影级' };

  function wizardRow(p) {
    const v = S.values[p.key];
    const wide = p.type === 'text';
    const hit = REWRITE.has(p.key);
    return `<div class="wp${wide ? ' wide' : ''}${hit ? ' hit' : ''}" data-row="${p.key}">
      <div>
        <div class="wp-label">
          <b>${esc(labelOf(p))}</b>
          <span class="wp-val" data-val="${p.key}">${esc(fmtVal(p, v))}</span>
          <span class="badge auto" data-auto style="display:none"></span>
        </div>
        <div class="wp-plain">${esc(PLAIN[p.key] || p.hint || '')}</div>
      </div>
      <div class="wp-ctrl">${controlHtml(p, v)}<span class="restore" data-restore="${p.key}">还原</span></div>
    </div>`;
  }

  function renderWizard() {
    S.wizard = clamp(S.wizard, 0, REG.stages.length - 1);
    const idx = S.wizard;
    const st = REG.stages[idx];
    S.stage = st.id;
    const keys = (STEP_KEYS[st.id] || []).filter((k) => MAP[k]);

    $('#wSteps').innerHTML = '<div class="wsteps-title">七步出片</div>' + REG.stages.map((s, i) => {
      const ks = STEP_KEYS[s.id] || [];
      const d = ks.filter((k) => MAP[k] && S.user[k] !== MAP[k].default).length;
      return `<div class="wstep${i === idx ? ' on' : ''}${i < idx ? ' done' : ''}" data-wizard="${i}" data-stage-id="${s.id}">
        <span class="wstep-n">${s.code}</span>
        <span class="wstep-name">${esc(s.name)}</span>
        <span class="wstep-meta"><span>${i + 1}/7</span><span class="dirty">${d ? '已调 ' + d : ''}</span></span>
      </div>`;
    }).join('');

    $('#wCard').innerHTML = `
      <div class="wcard">
        <div class="wcard-head">
          <div class="stage-chip">${st.code}</div>
          <div style="flex:1;min-width:0">
            <h1>第 ${idx + 1} 步 · ${esc(st.name)}</h1>
            <div class="en">${esc(st.en)} · 全板块 ${st.count} 参数，本步只露 ${keys.length} 项</div>
          </div>
          <span class="badge core">L3 精简</span>
        </div>
        <div class="wcard-say">${esc(STEP_SAY[st.id] || st.desc)}</div>
        <div class="wcard-callout">注意：${esc(STEP_NOTE[st.id] || '')}</div>
        <div class="wparams">${keys.map((k) => wizardRow(MAP[k])).join('')}</div>
        <div class="wfoot">
          <button class="btn" data-nav="-1"${idx === 0 ? ' disabled' : ''}>← 上一步</button>
          <button class="btn acc" data-nav="1"${idx === REG.stages.length - 1 ? ' disabled' : ''}>下一步 →</button>
          <span class="grow"></span>
          <span class="rec">本步推荐值
            ${['draft', 'standard', 'cinematic'].map((lv) => `<button class="rec-chip${S.preset === lv ? ' on' : ''}" data-rec="${lv}">${REC_LABEL[lv]}</button>`).join('')}
          </span>
        </div>
        <div class="empty" style="margin-top:10px">推荐值只改本步这 ${keys.length} 个参数，其余 ${REG.counts.total - keys.length} 个保持你现有的设置；要整表切换用顶栏预设。</div>
      </div>`;

    $('#wProgress').innerHTML = REG.stages.map((s, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('');
    bindControls($('#wCard'));
    refreshMarks();
  }

  function refreshWizardStepMeta() {
    $$('.wstep').forEach((el) => {
      const ks = STEP_KEYS[el.dataset.stageId] || [];
      const d = ks.filter((k) => MAP[k] && S.user[k] !== MAP[k].default).length;
      const n = $('.dirty', el);
      if (n) n.textContent = d ? '已调 ' + d : '';
    });
    $$('.wstep').forEach((el, i) => el.classList.toggle('done', i < S.wizard));
  }

  // 防抖回算后只刷新计数，不重建卡片——重建会把用户正在拖的滑块从手里抽走
  function scheduleWizardNumbers() {
    if (S.view === 'wizard') refreshWizardStepMeta();
  }

  function stepWizard(d) {
    S.wizard = clamp(S.wizard + d, 0, REG.stages.length - 1);
    renderWizard();
    saveLater();
  }

  function applyRec(level, stage) {
    // 走求解器的 applyPreset 口径（它是预设的唯一来源），再对"没有 presets 的 L3"用 REC 兜底
    const res = AVP.applyPreset(REG, level);
    const keys = STEP_KEYS[stage] || [];
    let n = 0;
    for (const k of keys) {
      const p = MAP[k];
      if (!p) continue;
      const hasPreset = p.presets && p.presets[level] !== undefined;
      const fallback = REC[level] && REC[level][k] !== undefined ? REC[level][k] : S.values[k];
      const nv = AVP.coerce(p, hasPreset ? res.values[k] : fallback);
      if (S.user[k] !== nv) { S.user[k] = nv; S.values[k] = nv; n++; }
    }
    S.preset = level;
    compute(); syncBoundControls(null); refreshMarks(); renderEstimator(); renderChrome();
    renderWizard();
    saveLater();
    toast(`本步已套用「${REC_LABEL[level]}」：${n} 个参数变化`);
  }

  $('#wSteps').addEventListener('click', (e) => {
    const it = e.target.closest('[data-wizard]');
    if (!it) return;
    S.wizard = Number(it.dataset.wizard);
    renderWizard();
    saveLater();
  });

  $('#wCard').addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { stepWizard(Number(nav.dataset.nav)); return; }
    const rec = e.target.closest('[data-rec]');
    if (rec) { applyRec(rec.dataset.rec, REG.stages[S.wizard].id); return; }
  });

  /* ══════════ 参数视图 ══════════ */

  function renderRail() {
    $('#pRail').innerHTML = REG.stages.map((s) => {
      const list = REG.params.filter((p) => p.stage === s.id);
      const hit = list.filter((p) => REWRITE.has(p.key)).length;
      return `<div class="rail-item${s.id === S.stage ? ' on' : ''}" data-stage="${s.id}">
        <span class="rail-code">${s.code}</span>
        <span class="rail-name">${esc(s.name)}</span>
        <span class="rail-n${hit ? ' warn' : ''}">${hit ? hit + '↻' : list.length}</span>
      </div>`;
    }).join('');
  }

  function prowHtml(p) {
    const v = S.values[p.key];
    const hit = REWRITE.has(p.key);
    const custom = v !== p.default;
    if (p.type === 'text') {
      return `<div class="prow" data-row="${p.key}">
        <div class="prow-meta">
          <div class="prow-top">
            <span class="lbl">${esc(labelOf(p))}</span>
            <span class="badge core">${p.tier}</span>
            <span class="badge auto" data-auto style="display:none"></span>
            <span class="badge diff" data-diff style="display:none">已自定义</span>
            <span class="key">${p.key}</span>
          </div>
        </div>
        <div class="prow-attach">
          <textarea data-key="${p.key}" data-type="text" rows="2">${esc(v)}</textarea>
          <div style="display:flex;gap:10px;margin-top:4px;align-items:center">
            <span class="hint" style="flex:1;white-space:normal">${esc(p.hint || '')}</span>
            <span class="restore" data-restore="${p.key}">还原</span>
          </div>
        </div>
      </div>`;
    }
    return `<div class="prow" data-row="${p.key}">
      <div class="prow-meta">
        <div class="prow-top">
          <span class="lbl">${esc(labelOf(p))}</span>
          <span class="badge core">${p.tier}</span>
          <span class="badge auto" data-auto style="display:none"></span>
          <span class="badge diff" data-diff style="display:none">已自定义</span>
          <span class="key">${p.key}</span>
        </div>
        <div class="hint">${esc(p.hint || '')}</div>
      </div>
      <div class="ctrl">${controlHtml(p, v)}<span class="restore" data-restore="${p.key}">还原</span></div>
      ${impactHtml(p)}
    </div>`;
  }

  function renderBoard() {
    const st = reg_stage(S.stage);
    $('#boardTitle').innerHTML = `<span class="stage-chip" style="width:26px;height:26px;border-radius: 3px;font-size:11px;box-shadow:none">${st.code}</span>${esc(st.name)}`;
    $('#boardDesc').textContent = st.desc;
    $('#boardCount').textContent = `${st.count} 参数 · L3 ${st.l3_count}`;

    const list = REG.params.filter((p) => p.stage === S.stage);
    const l3 = list.filter((p) => p.tier === 'L3');
    const l4 = list.filter((p) => p.tier !== 'L3');

    $('#paramList').innerHTML =
      `<div class="group-title"><b>核心参数 L3</b><span>${l3.length} 项 · 向导里露的就是这几项</span></div>` +
      l3.map(prowHtml).join('') +
      `<details class="fold" id="expertFold"${S.expert ? ' open' : ''}>
        <summary><span class="caret">▶</span><b>专家参数</b><span>L4 · ${l4.length} 项裸参，改动直接进求解器</span></summary>
        <div class="fold-body" id="foldBody"><div class="empty">展开后渲染…</div></div>
      </details>`;

    // 懒渲染：L4 的 DOM 只在真正展开时建，切板块回来自动回到收起状态
    const fold = $('#expertFold');
    const paint = () => {
      if (!fold.open) return;
      const body = $('#foldBody');
      if (body.dataset.done) return;
      body.innerHTML = l4.map(prowHtml).join('');
      body.dataset.done = '1';
      refreshMarks();
    };
    fold.addEventListener('toggle', () => {
      S.expert = fold.open;
      paint();
      saveLater();
    });
    paint();
    refreshMarks();
  }

  bindControls($('#paramList'));
  $('#pRail').addEventListener('click', (e) => {
    const it = e.target.closest('[data-stage]');
    if (it) setStage(it.dataset.stage);
  });
  $('#resetStage').addEventListener('click', () => {
    let n = 0;
    for (const k in S.values) {
      const p = MAP[k];
      if (!p || p.stage !== S.stage) continue;
      if (S.user[k] !== p.default) { S.user[k] = p.default; S.values[k] = p.default; n++; }
    }
    compute(); syncBoundControls(null); renderBoard(); renderEstimator(); renderChrome(); saveLater();
    toast(`本板块已还原 ${n} 个参数`);
  });

/* ══════════ 节点视图（Canvas2D） ══════════
     这里是"连线"的地方：7 个板块 + 3 个模型 + 1 个输出，全部画在 canvas 上。
     不用 DOM 节点是因为要同时支持拖动、缩放、平移和贝塞尔连线，
     DOM 方案光是 reflow 就会在拖动时掉帧。 */

  const NODES = [
    { id: 'character', kind: 'stage' },
    { id: 'storyboard', kind: 'stage' },
    { id: 'keyframe', kind: 'stage' },
    { id: 'motion', kind: 'stage' },
    { id: 'voice', kind: 'stage' },
    { id: 'look', kind: 'stage' },
    { id: 'export', kind: 'stage' },
    { id: 'm.keyframe', kind: 'model', param: 'kf.model', title: '关键帧模型', for: 'keyframe' },
    { id: 'm.motion', kind: 'model', param: 'mo.i2v_model', title: 'i2v 模型', for: 'motion' },
    { id: 'm.voice', kind: 'model', param: 'vo.lipsync_model', title: '口型模型', for: 'voice' },
    { id: 'output', kind: 'out', title: '成片输出' },
  ];

  // 世界坐标（不是屏幕坐标）：缩放平移只改 S.cam，不动这些数
  const BASE_POS = {
    character: [40, 210], storyboard: [250, 210], keyframe: [470, 210],
    motion: [700, 108], voice: [700, 320], look: [930, 210],
    export: [1130, 210], output: [1318, 210],
    'm.keyframe': [470, 392], 'm.motion': [706, 16], 'm.voice': [706, 442],
  };
  const SIZE = { stage: [172, 70], model: [156, 54], out: [150, 62] };

  const DATA_LINKS = [
    ['character', 'storyboard'], ['storyboard', 'keyframe'],
    ['keyframe', 'motion'], ['keyframe', 'voice'],
    ['motion', 'look'], ['voice', 'look'], ['look', 'export'], ['export', 'output'],
    ['m.keyframe', 'keyframe'], ['m.motion', 'motion'], ['m.voice', 'voice'],
  ];

  const cv = { el: null, g: null, w: 0, h: 0, dpr: 1, ready: false, dirty: true, raf: 0, drag: null, pan: null, link: null, hover: null, hoverPort: null, sel: new Set(), marquee: null };
  const nodeState = { open: null };

  function nodeOf(id) { return NODES.find((n) => n.id === id); }
  function nodeSize(n) { return SIZE[n.kind]; }
  function nodePos(id) {
    const p = S.nodes[id] || BASE_POS[id] || [0, 0];
    return { x: p[0], y: p[1] };
  }
  function nodeRect(n) {
    const p = nodePos(n.id), sz = nodeSize(n);
    return { x: p.x, y: p.y, w: sz[0], h: sz[1] };
  }
  function links() {
    return DATA_LINKS.map(([from, to]) => ({ from, to, custom: false }))
      .concat(S.links.map((l) => ({ from: l.from, to: l.to, custom: true })));
  }
  function nodeTitle(n) {
    if (n.kind === 'stage') { const st = reg_stage(n.id); return st.code + ' · ' + st.name; }
    if (n.kind === 'model') return n.title;
    return n.title;
  }
  function nodeSub(n) {
    if (n.kind === 'stage') {
      const st = reg_stage(n.id);
      return `${st.count} 参数 · L3 ${st.l3_count}`;
    }
    if (n.kind === 'model') return String(S.values[n.param]);
    return `${S.values['ex.resolution']} · ${S.values['ex.codec']} · ${S.values['ex.fps']}fps`;
  }
  /* 三类节点靠**底色明度**区分，不靠彩色（ComfyUI 也是这个路子）：
     板块节点最暗（--panel，主体内容）、模型节点中（--panel2）、输出节点最亮（--panel3，是终点）。 */
  function nodeColor(n) {
    if (n.kind === 'model') return { line: TK.line, fill: TK.panel2, stroke: TK.line2 };
    if (n.kind === 'out') return { line: TK.line, fill: TK.panel3, stroke: TK.line2 };
    return { line: TK.line, fill: TK.panel, stroke: TK.line2 };
  }

  function markCanvasDirty() { cv.dirty = true; }

  function ensureNodeCanvas() {
    if (cv.ready) return;
    cv.el = $('#nodeCanvas');
    cv.g = cv.el.getContext('2d');
    cv.ready = true;
    const ro = new ResizeObserver(() => { resizeCanvas(); markCanvasDirty(); });
    ro.observe(cv.el.parentElement || cv.el);
    bindNodeEvents();
    resizeCanvas();
    loop();
  }

  function resizeCanvas() {
    if (!cv.ready) return;
    const box = cv.el.getBoundingClientRect();
    cv.dpr = window.devicePixelRatio || 1;
    cv.w = Math.max(320, Math.round(box.width));
    cv.h = Math.max(240, Math.round(box.height));
    cv.el.width = Math.round(cv.w * cv.dpr);
    cv.el.height = Math.round(cv.h * cv.dpr);
    cv.g.setTransform(cv.dpr, 0, 0, cv.dpr, 0, 0);
    if (!S.cam) fitView(false);
    markCanvasDirty();
  }

  function fitView(animate) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const n of NODES) {
      const r = nodeRect(n);
      x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y);
      x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h);
    }
    const bwd = x1 - x0, bhd = y1 - y0;
    const k = clamp(Math.min((cv.w - 96) / bwd, (cv.h - 120) / bhd), 0.42, 1.15);
    S.cam = { k, x: (cv.w - bwd * k) / 2 - x0 * k, y: (cv.h - bhd * k) / 2 - y0 * k + 6 };
    if (animate === false) markCanvasDirty(); else markCanvasDirty();
    saveLater();
  }

  function toWorld(clientX, clientY) {
    const r = cv.el.getBoundingClientRect();
    return { x: (clientX - r.left - S.cam.x) / S.cam.k, y: (clientY - r.top - S.cam.y) / S.cam.k };
  }

  function hitTest(w) {
    for (let i = NODES.length - 1; i >= 0; i--) {
      const n = NODES[i], r = nodeRect(n);
      const port = { x: r.x + r.w, y: r.y + r.h / 2 };
      const pr = 11 / S.cam.k;
      if (Math.hypot(w.x - port.x, w.y - port.y) < pr) return { node: n, rect: r, port: true };
      if (w.x >= r.x && w.x <= r.x + r.w && w.y >= r.y && w.y <= r.y + r.h) return { node: n, rect: r, port: false };
    }
    return null;
  }

  function rounded(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawEdge(g, from, to, custom, phase) {
    const a = nodeRect(from), b = nodeRect(to);
    const x1 = a.x + a.w, y1 = a.y + a.h / 2;
    const x2 = b.x, y2 = b.y + b.h / 2;
    const dx = Math.max(46, Math.abs(x2 - x1) * 0.48);
    const c1x = x1 + dx, c2x = x2 - dx;
    const col = custom ? 'rgba(50, 50, 50, 0.85)' : from.kind === 'model' ? 'rgba(50, 50, 50, 0.6)' : 'rgba(50, 50, 50, 0.55)';
    g.save();
    g.strokeStyle = col;
    g.lineWidth = custom ? 2 : 1.6;
    if (from.kind === 'model' || custom) g.setLineDash([7, 6]);
    g.lineDashOffset = -phase;
    g.beginPath();
    g.moveTo(x1, y1);
    g.bezierCurveTo(c1x, y1, c2x, y2, x2, y2);
    g.stroke();
    g.setLineDash([]);
    // 箭头：始终指向目标节点左侧，表示"数据往这边流"
    const ang = Math.atan2(y2 - y1, x2 - x1);
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(x2, y2);
    g.lineTo(x2 - 9 * Math.cos(ang - 0.38), y2 - 9 * Math.sin(ang - 0.38));
    g.lineTo(x2 - 9 * Math.cos(ang + 0.38), y2 - 9 * Math.sin(ang + 0.38));
    g.closePath();
    g.fill();
    g.restore();
  }

  function drawNode(g, n) {
    const r = nodeRect(n);
    const c = nodeColor(n);
    const active = nodeState.open === n.id;
    const hover = cv.hover === n.id;
    g.save();
    // 选中态靠描边表达，不用发光阴影：阴影在暗底上会把节点边缘糊掉，且是"展示品"语法
    g.beginPath();
    rounded(g, r.x, r.y, r.w, r.h, 3);
    g.fillStyle = c.fill;
    g.fill();
    g.lineWidth = active ? 2 : 1;
    g.strokeStyle = active ? TK.acc : hover ? TK.line3 : c.stroke;
    g.stroke();
    g.restore();

    // 左侧类型徽标：底色统一 --panel3，字母颜色承载类型信息
    g.save();
    rounded(g, r.x + 10, r.y + 12, 22, 22, 2);
    g.fillStyle = TK.panel3;
    g.fill();
    g.fillStyle = n.kind === 'model' ? TK.tModel : n.kind === 'out' ? TK.ok : TK.acc;
    g.font = '700 12px ui-monospace, Consolas, monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const badge = n.kind === 'stage' ? reg_stage(n.id).code : n.kind === 'model' ? 'M' : '▶';
    g.fillText(badge, r.x + 21, r.y + 23.5);
    g.restore();

    g.save();
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = TK.text;
    g.font = '600 12.5px "Microsoft YaHei UI", system-ui, sans-serif';
    g.fillText(nodeTitle(n), r.x + 40, r.y + 23);
    g.fillStyle = n.kind === 'model' ? TK.tModel : TK.textDim;
    g.font = '11px ui-monospace, Consolas, monospace';
    const sub = nodeSub(n);
    g.save();
    g.beginPath();
    g.rect(r.x + 40, r.y + 28, r.w - 48, 17);
    g.clip();
    g.fillText(sub, r.x + 40, r.y + 40);
    g.restore();
    g.restore();

    // 结算指标：只对真正占显存的阶段显示，其余留空避免"每个节点都在报数"的噪音
    if (n.kind === 'stage' && REPORT) {
      const s = REPORT.vram.stages.find((x) => x.stage === n.id);
      if (s && s.peak_mib > 0) {
        g.save();
        g.fillStyle = TK.acc;
        g.globalAlpha = 0.85;
        g.font = '10.5px ui-monospace, Consolas, monospace';
        g.textAlign = 'left';
        g.fillText(s.peak_mib + ' MiB', r.x + 40, r.y + r.h - 12);
        g.restore();
      }
    }

    // 被规则改写的参数数：右上角小徽标，点开节点就能看到具体是哪一个
    if (n.kind === 'stage') {
      const hits = REG.params.filter((p) => p.stage === n.id && REWRITE.has(p.key)).length;
      if (hits) {
        g.save();
        rounded(g, r.x + r.w - 30, r.y + 9, 22, 15, 2);
        g.fillStyle = TK.panel3;
        g.fill();
        g.fillStyle = TK.text;
        g.font = '10px ui-monospace, Consolas, monospace';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('↻' + hits, r.x + r.w - 19, r.y + 17);
        g.restore();
      }
    }

    // 端口：右侧实心（输出），左侧空心（输入）
    const pr = 4.6;
    g.save();
    g.beginPath();
    g.arc(r.x + r.w, r.y + r.h / 2, pr, 0, Math.PI * 2);
    g.fillStyle = n.kind === 'model' ? TK.tModel : n.kind === 'out' ? TK.ok : TK.acc;
    g.fill();
    g.beginPath();
    g.arc(r.x, r.y + r.h / 2, pr, 0, Math.PI * 2);
    g.fillStyle = TK.bgDeep;
    g.fill();
    g.strokeStyle = TK.line2;
    g.lineWidth = 1.4;
    g.stroke();
    g.restore();
  }

  let flowPhase = 0;
  function draw() {
    const g = cv.g;
    cv.dirty = false;
    g.clearRect(0, 0, cv.w, cv.h);
    const cam = S.cam;
    // 背景点阵：跟着平移缩放一起走，给"画布"的空间感
    const step = 34 * cam.k;
    g.save();
    g.fillStyle = TK.line;
    for (let x = cam.x % step; x < cv.w; x += step) {
      for (let y = cam.y % step; y < cv.h; y += step) {
        g.fillRect(x, y, 1.2, 1.2);
      }
    }
    g.restore();

    g.save();
    g.translate(cam.x, cam.y);
    g.scale(cam.k, cam.k);
    for (const l of links()) {
      const from = nodeOf(l.from), to = nodeOf(l.to);
      if (!from || !to) continue;
      drawEdge(g, from, to, l.custom, flowPhase);
    }
    if (cv.link) {
      const from = nodeOf(cv.link.from);
      if (from) {
        const a = nodeRect(from);
        const x1 = a.x + a.w, y1 = a.y + a.h / 2;
        const x2 = cv.link.x, y2 = cv.link.y;
        g.save();
        g.strokeStyle = 'rgba(50, 50, 50, 0.9)';
        g.lineWidth = 1.8;
        g.setLineDash([5, 5]);
        g.beginPath();
        g.moveTo(x1, y1);
        g.bezierCurveTo(x1 + 60, y1, x2 - 60, y2, x2, y2);
        g.stroke();
        g.restore();
      }
    }
    for (const n of NODES) drawNode(g, n);
    // 多选描边：冷银外框 + 淡银光，选中集合一眼可辨
    if (cv.sel.size) {
      g.save();
      g.strokeStyle = TK.acc;
      g.lineWidth = 1.4;
      g.shadowColor = 'rgba(200, 205, 212, 0.35)';
      g.shadowBlur = 10;
      for (const id of cv.sel) {
        const n = nodeOf(id);
        if (!n) continue;
        const r = nodeRect(n);
        g.strokeRect(r.x - 3, r.y - 3, r.w + 6, r.h + 6);
      }
      g.restore();
    }
    // 框选进行中的虚线银框
    if (cv.marquee) {
      const m = cv.marquee;
      const x = Math.min(m.x0, m.x), y = Math.min(m.y0, m.y);
      const w = Math.abs(m.x - m.x0), h = Math.abs(m.y - m.y0);
      g.save();
      g.fillStyle = 'rgba(200, 205, 212, 0.07)';
      g.fillRect(x, y, w, h);
      g.strokeStyle = TK.acc;
      g.lineWidth = 1;
      g.setLineDash([4, 4]);
      g.strokeRect(x, y, w, h);
      g.restore();
    }
    g.restore();

    if (!NODES.length) return;
  }

  function loop() {
    if (!cv.ready) return;
    if (S.view !== 'nodes') { cv.raf = 0; return; }
    // 只有交互中才逐帧重绘；静止时靠 dirty 标记，空转不做无用的全画布重画
    if (cv.dirty || cv.drag || cv.link || cv.pan || cv.hover || cv.marquee) {
      flowPhase = (flowPhase + 0.45) % 14;
      draw();
    }
    cv.raf = requestAnimationFrame(loop);
  }

  function bindNodeEvents() {
    const el = cv.el;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const w = toWorld(e.clientX, e.clientY);
      const hit = hitTest(w);
      // Shift：点节点增删选中；空白处起框选。框选与单节点拖拽互不干扰
      if (e.shiftKey) {
        if (hit) {
          if (cv.sel.has(hit.node.id)) cv.sel.delete(hit.node.id); else cv.sel.add(hit.node.id);
          markCanvasDirty();
          return;
        }
        cv.marquee = { x0: w.x, y0: w.y, x: w.x, y: w.y };
        el.setPointerCapture(e.pointerId);
        markCanvasDirty();
        return;
      }
      if (hit && hit.port && hit.node.kind !== 'out') {
        cv.link = { from: hit.node.id, x: w.x, y: w.y };
        el.classList.add('linking');
        el.setPointerCapture(e.pointerId);
        markCanvasDirty();
        return;
      }
      if (hit) {
        const r = hit.rect;
        cv.drag = { id: hit.node.id, dx: w.x - r.x, dy: w.y - r.y, moved: false, sx: e.clientX, sy: e.clientY };
        // 拖住已选中的节点 = 整组平移：记录每个选中节点的起点，随动同一位移
        if (cv.sel.has(hit.node.id) && cv.sel.size > 1) {
          cv.drag.gx0 = r.x; cv.drag.gy0 = r.y;
          cv.drag.group = Array.from(cv.sel).map((id) => {
            const n = nodeOf(id);
            const rr = n ? nodeRect(n) : r;
            return { id: id, x: rr.x, y: rr.y };
          });
        }
        nodeState.open = hit.node.id;
        renderNodePanel(hit.node);
        $('#nodePanel').classList.add('on');
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
        markCanvasDirty();
        return;
      }
      if (cv.sel.size) { cv.sel.clear(); markCanvasDirty(); }
      cv.pan = { sx: e.clientX, sy: e.clientY, cx: S.cam.x, cy: S.cam.y };
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', (e) => {
      const w = toWorld(e.clientX, e.clientY);
      if (cv.marquee) {
        cv.marquee.x = w.x; cv.marquee.y = w.y;
        markCanvasDirty();
        return;
      }
      if (cv.link) {
        cv.link.x = w.x; cv.link.y = w.y;
        const hit = hitTest(w);
        cv.hover = hit && hit.node.id !== cv.link.from ? hit.node.id : null;
        markCanvasDirty();
        return;
      }
      if (cv.drag) {
        if (Math.abs(e.clientX - cv.drag.sx) + Math.abs(e.clientY - cv.drag.sy) > 3) cv.drag.moved = true;
        const nx = Math.round(w.x - cv.drag.dx), ny = Math.round(w.y - cv.drag.dy);
        if (cv.drag.group) {
          const ddx = nx - cv.drag.gx0, ddy = ny - cv.drag.gy0;
          for (const gp of cv.drag.group) S.nodes[gp.id] = [gp.x + ddx, gp.y + ddy];
        } else {
          S.nodes[cv.drag.id] = [nx, ny];
        }
        markCanvasDirty();
        return;
      }
      if (cv.pan) {
        S.cam.x = cv.pan.cx + (e.clientX - cv.pan.sx);
        S.cam.y = cv.pan.cy + (e.clientY - cv.pan.sy);
        markCanvasDirty();
        return;
      }
      const hit = hitTest(w);
      const h = hit ? hit.node.id : null;
      if (h !== cv.hover) { cv.hover = h; markCanvasDirty(); }
      el.style.cursor = hit && hit.port ? 'crosshair' : hit ? 'grab' : 'default';
    });

    const finish = (e) => {
      if (cv.marquee) {
        const m = cv.marquee;
        cv.marquee = null;
        const x1 = Math.min(m.x0, m.x), x2 = Math.max(m.x0, m.x);
        const y1 = Math.min(m.y0, m.y), y2 = Math.max(m.y0, m.y);
        if (x2 - x1 > 4 || y2 - y1 > 4) {
          for (const n of NODES) {
            const r = nodeRect(n);
            if (r.x < x2 && r.x + r.w > x1 && r.y < y2 && r.y + r.h > y1) cv.sel.add(n.id);
          }
          toast(cv.sel.size ? `框选命中 ${cv.sel.size} 个节点 · 拖任一选中节点整组移动 · Esc 清空` : '框选没有命中节点');
        }
        markCanvasDirty();
      }
      if (cv.link) {
        const w = toWorld(e.clientX, e.clientY);
        const hit = hitTest(w);
        if (hit && hit.node.id !== cv.link.from) {
          const dup = links().some((l) => l.from === cv.link.from && l.to === hit.node.id);
          if (dup) toast('这条连线已经存在');
          else {
            S.links.push({ from: cv.link.from, to: hit.node.id });
            saveLater();
            toast(`已连线 ${cv.link.from} → ${hit.node.id}`);
          }
        }
        cv.link = null;
        el.classList.remove('linking');
        markCanvasDirty();
      }
      if (cv.drag) {
        const d = cv.drag;
        cv.drag = null;
        el.classList.remove('dragging');
        if (!d.moved) {
          const n = nodeOf(d.id);
          if (n) { nodeState.open = n.id; renderNodePanel(n); $('#nodePanel').classList.add('on'); }
        } else saveLater();
      }
      if (cv.pan) { cv.pan = null; el.classList.remove('dragging'); saveLater(); }
    };
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);

    el.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const before = { x: (mx - S.cam.x) / S.cam.k, y: (my - S.cam.y) / S.cam.k };
      const k = clamp(S.cam.k * (e.deltaY < 0 ? 1.1 : 0.9), 0.35, 2.6);
      S.cam.k = k;
      S.cam.x = mx - before.x * k;
      S.cam.y = my - before.y * k;
      markCanvasDirty();
      saveLater();
    }, { passive: false });

    // 双击节点 = 跳到参数视图继续深调，符合"专家从图进入表单"的动线
    el.addEventListener('dblclick', (e) => {
      const hit = hitTest(toWorld(e.clientX, e.clientY));
      if (!hit) return;
      const n = hit.node;
      const stageId = n.kind === 'stage' ? n.id : n.for;
      if (stageId) { setStage(stageId); setView('params'); }
      else { setStage('export'); setView('params'); }
    });

    window.addEventListener('resize', () => { resizeCanvas(); markCanvasDirty(); });
  }

  $('#nodeFit').addEventListener('click', () => { fitView(); });
  $('#nodeReset').addEventListener('click', () => {
    S.nodes = {};
    S.cam = null;
    fitView();
    saveLater();
    toast('已恢复默认布局');
  });
  $('#nodeClearLinks').addEventListener('click', () => {
    S.links = [];
    markCanvasDirty();
    saveLater();
    toast('已清空自定义连线（数据流主线保留）');
  });

  /* ── 节点右侧参数抽屉 ── */

  function npRow(p) {
    const v = S.values[p.key];
    return `<div class="np-row" data-row="${p.key}">
      <div class="np-top"><b>${esc(labelOf(p))}</b>
        <span class="badge core">${p.tier || 'L4'}</span>
        <span class="badge auto" data-auto style="display:none"></span>
      </div>
      ${controlHtml(p, v)}
    </div>`;
  }

  function renderNodePanel(n) {
    if (!n) return;
    let head = '', body = '', footStage = '';
    if (n.kind === 'stage') {
      const st = reg_stage(n.id);
      const l3 = REG.params.filter((p) => p.stage === n.id && p.tier === 'L3');
      const l4n = REG.params.filter((p) => p.stage === n.id && p.tier !== 'L3').length;
      head = `<div class="stage-chip">${st.code}</div><h3>${esc(st.name)}</h3>`;
      body = `<div class="empty" style="margin-bottom:7px">${esc(st.desc)}</div>` + l3.map(npRow).join('') +
        `<div class="empty">另有 ${l4n} 个 L4 专家参数，去参数视图展开调。</div>`;
      footStage = st.id;
    } else if (n.kind === 'model') {
      const p = MAP[n.param];
      head = `<div class="stage-chip">M</div><h3>${esc(n.title)}</h3>`;
      body = `<div class="empty" style="margin-bottom:7px">驱动「${esc(reg_stage(n.for).name)}」的本地模型；换模型等于换显存账本。</div>` + (p ? npRow(p) : '');
      footStage = n.for;
    } else {
      head = `<div class="stage-chip">▶</div><h3>成片输出</h3>`;
      body = ['ex.resolution', 'ex.fps', 'ex.codec', 'ex.bitrate'].map((k) => npRow(MAP[k])).join('');
      footStage = 'export';
    }
    $('#nodePanel').innerHTML = `
      <div class="np-head">${head}<span class="x" data-close>✕</span></div>
      <div class="np-body">${body}</div>
      <div class="np-foot"><button class="btn mini acc" data-goto="${footStage}">在参数视图展开</button>
        <button class="btn mini" data-close>关闭</button></div>`;
    refreshMarks();
  }

  function closeNodePanel() {
    nodeState.open = null;
    $('#nodePanel').classList.remove('on');
    markCanvasDirty();
  }

  $('#nodePanel').addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { closeNodePanel(); return; }
    const go = e.target.closest('[data-goto]');
    if (go) { setStage(go.dataset.goto); setView('params'); }
  });
  bindControls($('#nodePanel'));

  /* ── 自检钩子：给 canvas/selftest.mjs 与人工调试用 ── */
  window.__AVPUI = {
    get values() { return S.values; },
    get userValues() { return S.user; },
    get report() { return REPORT; },
    get state() { return S; },
    get rulesHit() { return Array.from(REWRITE.keys()); },
    counts: REG.counts,
    stages: REG.stages.map((s) => s.id),
    setParam, setView, setStage,
    applyRec,
    checkRender: () => ({
      wizardCards: $$('#wCard .wp').length,
      paramsRows: $$('#paramList .prow').length,
      stages: REG.stages.length,
      nodes: NODES.length,
    }),
  };

  /* ── 启动：先把当前视图渲出来（视图偏好来自上次会话） ── */
  renderRail();
  renderBoard();
  renderWizard();
  renderEstimator();
  renderChrome();
  setView(S.view);
})();
</script>
</body>
</html>
