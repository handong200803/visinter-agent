  function appliedHtml(e) {
    if (e.state !== 'active') {
      return '<span class="chip">未进运行时</span> <span class="hint">state = ' + esc(e.state) + '，loader 不合并该包</span>';
    }
    const a = e.applied || {};
    const bits = [];
    if ((a.params || 0) > 0) bits.push('参数 +' + a.params);
    if ((a.models || 0) > 0) bits.push('模型 +' + a.models);
    if ((a.presets || 0) > 0) bits.push('预设 +' + a.presets);
    if ((a.themes || 0) > 0) bits.push('主题 +' + a.themes);
    if ((a.panels || 0) > 0) bits.push('面板 +' + a.panels);
    return '<span class="chip ok">已注入</span> <span class="hint">' + esc(bits.join(' · ') || '合并结果无增量') + '</span>';
  }

  function renderCheckTab(e) {
    const errs = Array.isArray(e.errors) ? e.errors : [];
    const warns = Array.isArray(e.warnings) ? e.warnings : [];
    const zero = (errs.length === 0 && warns.length === 0)
      ? '<div class="zero"><span class="badge ok">0 错 0 警</span><span>loader 没有返回任何错误与警告</span></div>'
      : '';

    const summary = '<div class="panel">'
      + '<div class="panel-h">校验结论<span class="spacer"></span>'
      + '<span class="badge ' + toneOf(e.state) + '">' + esc(labelOf(e.state)) + '</span></div>'
      + '<div class="panel-b"><dl class="detail-kv">'
      + fieldRow('state', '<span class="mono">' + esc(e.state) + '</span>')
      + fieldRow('推导来源', '<span class="mono">' + esc(e.state_from || '') + '</span>'
        + '<span class="hint">（loader 的返回值，本页不二次判断）</span>')
      + fieldRow('reason', '<span class="wrap">' + (e.reason ? esc(e.reason) : '<span class="hint">无</span>') + '</span>')
      + fieldRow('运行时', appliedHtml(e))
      + fieldRow('计数', zero || ('<span class="num">' + errs.length + '</span> <span class="hint">错</span> '
        + '<span class="num">' + warns.length + '</span> <span class="hint">警</span>'))
      + '</dl></div></div>';

    const errPanel = '<div class="panel">'
      + '<div class="panel-h">errors[]<span class="spacer"></span><span class="num">' + errs.length + '</span></div>'
      + '<div class="panel-b">' + (errs.length ? problemTable(errs) : '<div class="zero"><span class="badge ok">0</span><span class="hint">没有 error</span></div>') + '</div></div>';

    const warnPanel = '<div class="panel">'
      + '<div class="panel-h">warnings[]<span class="spacer"></span><span class="num">' + warns.length + '</span></div>'
      + '<div class="panel-b">' + (warns.length ? problemTable(warns) : '<div class="zero"><span class="badge ok">0</span><span class="hint">没有 warning</span></div>') + '</div></div>';

    return summary + errPanel + warnPanel + localPanel();
  }

  /* ═══════════════════ 本地校验（页面内结构校验子集）═══════════════════
     规则来源：快照里的 schema_contract（由 tools/snap_plugins.mjs 直接读
     plugins/schema/plugin.schema.json 得到）+ loader 的权限白名单 + engines 版本比较。
     不做的事：contributes 内部的语义校验（key 冲突 / stage 是否存在 / impact 范围 / 预设校验和），
     那些需要 base 注册表与 core/engine.js，只能在 Node 侧由 loader 完成。 */
  const VER_RE = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/;
  const CMP_RE = /(\^|~|>=|<=|>|<|=)?\s*(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?/g;

  function parseVer(input) {
    if (typeof input !== 'string') return null;
    const m = VER_RE.exec(input.trim());
    if (!m) return null;
    return { maj: +m[1], min: +m[2], pat: +m[3], pre: m[4] || null };
  }
  function cmpVer(a, b) {
    const keys = ['maj', 'min', 'pat'];
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (a[k] !== b[k]) return a[k] < b[k] ? -1 : 1;
    }
    const aw = a.pre ? 0 : 1;
    const bw = b.pre ? 0 : 1;
    return aw === bw ? 0 : aw < bw ? -1 : 1;
  }
  /* 与 plugins/loader.js 的 satisfies 同算法：单比较符 / 空（等于）/ ^ / ~，
     空格为「与」，|| 为「或」；整段必须被比较式吃干净，否则视为非法范围。 */
  function satisfies(version, range) {
    const v = parseVer(version);
    if (!v || typeof range !== 'string' || !range.trim()) return false;
    return range.split('||').some(function (clause) {
      const text = clause.trim();
      if (!text) return false;
      const tokens = text.match(CMP_RE);
      if (!tokens || tokens.join(' ').replace(/\s+/g, ' ') !== text.replace(/\s+/g, ' ')) return false;
      return tokens.every(function (tok) {
        CMP_RE.lastIndex = 0;
        const m = CMP_RE.exec(tok);
        if (!m) return false;
        const op = m[1] || '=';
        const target = parseVer(m[2]);
        if (!target) return false;
        const c = cmpVer(v, target);
        if (op === '>=') return c >= 0;
        if (op === '<=') return c <= 0;
        if (op === '>') return c > 0;
        if (op === '<') return c < 0;
        if (op === '=') return c === 0;
        if (op === '^') {
          const upper = target.maj === 0
            ? { maj: 0, min: target.min + 1, pat: 0, pre: null }
            : { maj: target.maj + 1, min: 0, pat: 0, pre: null };
          return c >= 0 && cmpVer(v, upper) < 0;
        }
        if (op === '~') {
          const upper = { maj: target.maj, min: target.min + 1, pat: 0, pre: null };
          return c >= 0 && cmpVer(v, upper) < 0;
        }
        return false;
      });
    });
  }

  /** 结构校验：返回 { ok, id, name, rules:[{code,path,message,rule}], notes:[], executed:[规则名] } */
  function localCheck(raw) {
    const rules = [];
    const notes = [];
    const executed = [];
    const hit = (code, p, message, rule) => rules.push({ code: code, path: p, message: message, rule: rule });
    const req = Array.isArray(SCHEMA.required) ? SCHEMA.required : [];
    const typeEnum = Array.isArray(SCHEMA.type_enum) ? SCHEMA.type_enum : [];
    const permEnum = Array.isArray(SCHEMA.permissions_items_enum) ? SCHEMA.permissions_items_enum : WHITELIST;
    const contribKeys = Array.isArray(SCHEMA.contributes_keys) ? SCHEMA.contributes_keys : [];
    const typeReq = Array.isArray(SCHEMA.type_requirements) ? SCHEMA.type_requirements : [];
    const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

    if (!isObj(raw)) {
      hit('TYPE_MISMATCH', '$', '顶层必须是 JSON 对象，实际 ' + (Array.isArray(raw) ? 'array' : typeof raw), 'type:object');
      return { ok: false, id: '', name: '', rules: rules, executed: ['type:object'] };
    }

    executed.push('required: ' + req.join(', '));
    for (const f of req) {
      if (!(f in raw)) hit('REQUIRED_MISSING', '$.' + f, '缺少必填字段 ' + f, 'required');
    }

    if (SCHEMA.additional_properties === false) {
      executed.push('additionalProperties: false');
      const known = req.concat(['description', 'author', 'homepage', 'permissions', 'signature']);
      for (const k of Object.keys(raw)) {
        if (known.indexOf(k) < 0) hit('UNKNOWN_FIELD', '$.' + k, '未声明的字段（拼错？）', 'additionalProperties');
      }
    }

    /* signature：只查**形状**（镜像 schema/plugin.schema.json#definitions/signature）。
       浏览器里没有可信公钥、也不该有私钥，真验签只在 Node 侧的 plugins/loader.js 做——
       页面要是假装"验过了"，就等于给了一个假的信任信号。 */
    if ('signature' in raw) {
      executed.push('definitions/signature: key_id / alg=ed25519 / sig(base64 64B)');
      const s = raw.signature;
      if (!isObj(s)) {
        hit('TYPE_MISMATCH', '$.signature', '期望 object，实际 ' + (Array.isArray(s) ? 'array' : typeof s), 'type:object');
      } else {
        for (const need of ['key_id', 'alg', 'sig']) {
          if (!(need in s)) hit('REQUIRED_MISSING', '$.signature.' + need, 'signature 缺必填字段 ' + need, 'required:signature');
        }
        for (const k of Object.keys(s)) {
          if (['key_id', 'alg', 'sig'].indexOf(k) < 0) hit('UNKNOWN_FIELD', '$.signature.' + k, 'signature 下未声明的字段', 'additionalProperties:signature');
        }
        if ('key_id' in s && (typeof s.key_id !== 'string' || !/^[a-z][a-z0-9._-]{2,47}$/.test(s.key_id))) {
          hit('PATTERN_MISMATCH', '$.signature.key_id', 'key_id 必须匹配 ^[a-z][a-z0-9._-]{2,47}$', 'pattern:signature.key_id');
        }
        if ('alg' in s && s.alg !== 'ed25519') {
          hit('CONST_MISMATCH', '$.signature.alg', 'alg 必须是 "ed25519"，实际 ' + JSON.stringify(s.alg), 'const:signature.alg');
        }
        if ('sig' in s && (typeof s.sig !== 'string' || !/^[A-Za-z0-9+/]{86}==$/.test(s.sig))) {
          hit('PATTERN_MISMATCH', '$.signature.sig', 'sig 必须是 64 字节签名的 base64（88 字符，结尾 ==）', 'pattern:signature.sig');
        }
      }
    }

    if (SCHEMA.schema_const) {
      executed.push('const: schema = ' + SCHEMA.schema_const);
      if ('schema' in raw && raw.schema !== SCHEMA.schema_const) {
        hit('CONST_MISMATCH', '$.schema', '必须是 ' + JSON.stringify(SCHEMA.schema_const) + '，实际 ' + JSON.stringify(raw.schema), 'const');
      }
    }

    const str = (key, label) => {
      if (!(key in raw)) return null;
      if (typeof raw[key] !== 'string') {
        hit('TYPE_MISMATCH', '$.' + key, '期望 string，实际 ' + typeof raw[key], 'type:string');
        return null;
      }
      return raw[key];
    };

    const id = str('id', 'id');
    if (id !== null) {
      if (SCHEMA.id_pattern) executed.push('pattern: id ' + SCHEMA.id_pattern);
      if (SCHEMA.id_pattern && !new RegExp(SCHEMA.id_pattern).test(id)) {
        hit('PATTERN_MISMATCH', '$.id', '不匹配 ' + SCHEMA.id_pattern + '：' + JSON.stringify(id), 'pattern:id');
      }
    }
    const name = str('name');
    if (name !== null) {
      executed.push('minLength/maxLength: name ' + SCHEMA.name_min_length + '..' + SCHEMA.name_max_length);
      if (SCHEMA.name_min_length && name.length < SCHEMA.name_min_length) hit('TOO_SHORT', '$.name', '长度 ' + name.length + ' < ' + SCHEMA.name_min_length, 'minLength');
      if (SCHEMA.name_max_length && name.length > SCHEMA.name_max_length) hit('TOO_LONG', '$.name', '长度 ' + name.length + ' > ' + SCHEMA.name_max_length, 'maxLength');
    }
    const version = str('version');
    if (version !== null) {
      if (SCHEMA.version_pattern) executed.push('pattern: version ' + SCHEMA.version_pattern);
      if (SCHEMA.version_pattern && !new RegExp(SCHEMA.version_pattern).test(version)) {
        hit('PATTERN_MISMATCH', '$.version', '不匹配 ' + SCHEMA.version_pattern + '：' + JSON.stringify(version), 'pattern:version');
      }
    }
    const type = str('type');
    if (type !== null) {
      executed.push('enum: type = ' + typeEnum.join(' | '));
      if (typeEnum.length && typeEnum.indexOf(type) < 0) {
        hit('ENUM_MISMATCH', '$.type', '取值必须是 ' + typeEnum.join(' | ') + ' 之一，实际 ' + JSON.stringify(type), 'enum:type');
      }
    }
    const desc = str('description');
    if (desc !== null && SCHEMA.description_max_length && desc.length > SCHEMA.description_max_length) {
      hit('TOO_LONG', '$.description', '长度 ' + desc.length + ' > ' + SCHEMA.description_max_length, 'maxLength:description');
    }
    const author = str('author');
    if (author !== null && SCHEMA.author_max_length && author.length > SCHEMA.author_max_length) {
      hit('TOO_LONG', '$.author', '长度 ' + author.length + ' > ' + SCHEMA.author_max_length, 'maxLength:author');
    }
    const homepage = str('homepage');
    if (homepage !== null && SCHEMA.homepage_pattern) {
      executed.push('pattern: homepage ' + SCHEMA.homepage_pattern);
      if (!new RegExp(SCHEMA.homepage_pattern).test(homepage)) {
        hit('PATTERN_MISMATCH', '$.homepage', '不匹配 ' + SCHEMA.homepage_pattern + '：' + JSON.stringify(homepage), 'pattern:homepage');
      }
    }

    if (!('signature' in raw)) {
      // 缺签不是结构错误（ui/preset 允许降级），但必须提示，不能让"本地校验通过"被读成"可信"
      notes.push('缺 signature：Node 侧按类型分档 —— model/node/exec 拒载（PLUGIN_UNSIGNED），ui/preset 降级 unsigned 并告警');
    }

    /* engines：必填 platform，只允许 platform / registry，范围串要过 pattern 且要真满足 */
    if ('engines' in raw) {
      const eng = raw.engines;
      if (!isObj(eng)) {
        hit('TYPE_MISMATCH', '$.engines', '期望 object，实际 ' + (Array.isArray(eng) ? 'array' : typeof eng), 'type:object');
      } else {
        executed.push('engines.required: ' + (SCHEMA.engines_required || []).join(', '));
        for (const need of (SCHEMA.engines_required || [])) {
          if (!(need in eng)) hit('REQUIRED_MISSING', '$.engines.' + need, '缺少必填字段 ' + need, 'required:engines');
        }
        executed.push('additionalProperties(engines): only ' + (SCHEMA.engines_keys || []).join(', '));
        for (const k of Object.keys(eng)) {
          if ((SCHEMA.engines_keys || []).indexOf(k) < 0) hit('UNKNOWN_FIELD', '$.engines.' + k, 'engines 下未声明的字段', 'additionalProperties:engines');
        }
        for (const k of ['platform', 'registry']) {
          if (!(k in eng)) continue;
          if (typeof eng[k] !== 'string') {
            hit('TYPE_MISMATCH', '$.engines.' + k, '期望 string，实际 ' + typeof eng[k], 'type:string');
            continue;
          }
          if (SCHEMA.engines_pattern) executed.push('pattern: engines.' + k + ' ' + SCHEMA.engines_pattern);
          if (SCHEMA.engines_pattern && !new RegExp(SCHEMA.engines_pattern).test(eng[k])) {
            hit('PATTERN_MISMATCH', '$.engines.' + k, '不匹配范围串允许字符集：' + JSON.stringify(eng[k]), 'pattern:engines.' + k);
            continue;
          }
          executed.push('satisfies(' + HOST_VER + ', engines.' + k + ')');
          const against = k === 'platform' ? HOST_VER : (HOST.registry_version || HOST_VER);
          if (!satisfies(against, eng[k])) {
            const code = k === 'platform' ? 'VERSION_UNSATISFIED' : 'REGISTRY_VERSION_UNSATISFIED';
            hit(code, '$.engines.' + k, (k === 'platform' ? '平台版本 ' : '注册表版本 ') + against + ' 不满足插件要求 ' + eng[k], 'engines.' + k + ' 版本比较');
          }
        }
      }
    }

    /* permissions：数组 / 去重 / 上限 / 每一项必须在白名单内 */
    if ('permissions' in raw) {
      const perms = raw.permissions;
      if (!Array.isArray(perms)) {
        hit('TYPE_MISMATCH', '$.permissions', '期望 array，实际 ' + typeof perms, 'type:array');
      } else {
        if (SCHEMA.permissions_max_items) executed.push('maxItems(permissions) ' + SCHEMA.permissions_max_items);
        if (SCHEMA.permissions_max_items && perms.length > SCHEMA.permissions_max_items) {
          hit('TOO_MANY_ITEMS', '$.permissions', '数组长度 ' + perms.length + ' > ' + SCHEMA.permissions_max_items, 'maxItems');
        }
        executed.push(SCHEMA.permissions_unique ? 'uniqueItems(permissions)' : 'uniqueItems 未启用');
        if (SCHEMA.permissions_unique) {
          const seen = {};
          perms.forEach((p, i) => {
            const sig = JSON.stringify(p);
            if (seen[sig]) hit('DUPLICATE_ITEM', '$.permissions[' + i + ']', '数组成员重复', 'uniqueItems');
            seen[sig] = true;
          });
        }
        executed.push('enum(permissions) = ' + permEnum.join(' | '));
        perms.forEach((p, i) => {
          if (permEnum.indexOf(p) < 0) {
            hit('ENUM_MISMATCH', '$.permissions[' + i + ']', '取值必须是 ' + permEnum.join(' | ') + ' 之一，实际 ' + JSON.stringify(p), 'enum:permissions');
          }
        });
      }
    }

    /* contributes：类型专属必填（allOf → if type then contributes.<key>） */
    if ('contributes' in raw) {
      const c = raw.contributes;
      if (!isObj(c)) {
        hit('TYPE_MISMATCH', '$.contributes', '期望 object，实际 ' + (Array.isArray(c) ? 'array' : typeof c), 'type:object');
      } else {
        executed.push('additionalProperties(contributes): ' + contribKeys.join(', '));
        for (const k of Object.keys(c)) {
          if (contribKeys.indexOf(k) < 0) hit('UNKNOWN_FIELD', '$.contributes.' + k, 'contributes 下未声明的字段', 'additionalProperties:contributes');
        }
        const clause = typeReq.find((t) => t.type === type);
        if (clause) {
          executed.push('allOf: type = ' + clause.type + ' → contributes.' + (clause.contributes_required || []).join(' / '));
          for (const need of (clause.contributes_required || [])) {
            if (!(need in c)) hit('REQUIRED_MISSING', '$.contributes.' + need, 'type=' + type + ' 必须提供 contributes.' + need, 'allOf:type');
          }
        }
      }
    } else if (type && typeReq.some((t) => t.type === type)) {
      const clause = typeReq.find((t) => t.type === type);
      executed.push('allOf: type = ' + type + ' → contributes');
      for (const need of (clause.contributes_required || [])) {
        hit('REQUIRED_MISSING', '$.contributes.' + need, 'type=' + type + ' 必须提供 contributes.' + need, 'allOf:type');
      }
    }

    return {
      ok: rules.length === 0,
      id: id || '',
      name: name || '',
      rules: rules,
      notes: notes,
      executed: executed
    };
  }

  function localResultHtml(res, meta) {
    if (!res) {
      return '<div class="zero"><span class="hint">还没有校验过文件。选择一份 manifest.json，按 schema 子集逐项判定。</span></div>';
    }
    const hit = res.rules.length
      ? '<ul class="rulelist">' + res.rules.map((r) => '<li><span class="mono">' + esc(r.code) + '</span>'
        + '<span>@' + esc(r.path) + '</span><span class="hint">' + esc(r.rule) + '</span></li>').join('') + '</ul>'
      : '<div class="zero"><span class="hint">没有命中任何规则</span></div>';
    const noteHtml = (res.notes && res.notes.length)
      ? '<ul class="rulelist">' + res.notes.map((n) => '<li><span class="chip warn">提示</span><span>' + esc(n) + '</span></li>').join('') + '</ul>'
      : '';
    return '<div class="verdict-line">'
      + '<span class="badge ' + (res.ok ? 'ok' : 'bad') + '">' + (res.ok ? '0 · 通过' : '1 · 不通过') + '</span>'
      + '<b>' + esc(res.id || '（无 id）') + '</b>'
      + '<span class="hint">' + esc(meta && meta.file ? meta.file : '') + '</span>'
      + '<span class="hint">命中 ' + res.rules.length + ' 条规则</span>'
      + '</div>'
      + hit
      + noteHtml
      + '<details class="raw"><summary>本次执行的规则（' + res.executed.length + ' 条）</summary>'
      + '<pre class="code">' + esc(res.executed.join('\n')) + '</pre></details>';
  }

  function localPanel() {
    const runs = localChecks.length
      ? '<div class="runs">' + localChecks.slice(0, 6).map((r, i) => '<div class="run' + (i === 0 ? ' latest' : '') + '">'
        + '<span class="at">' + esc(r.at) + '</span>'
        + '<span class="what"><span class="fname mono">' + esc(r.file) + '</span>'
        + ' <span class="chip ' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '通过' : '不通过') + '</span>'
        + ' <span class="hint">' + esc(r.id || '无 id') + '</span></span>'
        + '<span class="codes">' + esc(r.codes.length ? r.codes.join(' ') : '无命中') + '</span>'
        + '</div>').join('') + '</div>'
      : '<div class="zero"><span class="hint">还没有记录。校验一次就会在这里留一条（内存态，刷新即清空）。</span></div>';

    return '<div class="panel" id="localPanel">'
      + '<div class="panel-h">本地校验<span class="spacer"></span>'
      + '<span class="hint">宿主 avp ' + esc(HOST_VER) + ' · required ' + (SCHEMA.required || []).length + ' 项 · 白名单 ' + WHITELIST.length + ' 条</span></div>'
      + '<div class="panel-b">'
      + '<div class="localbar">'
      + '<input type="file" id="fileInput" class="input file" accept=".json,application/json" aria-label="选择 manifest.json">'
      + '<span class="hint" id="fileNote">读一份 manifest 做结构校验：required 字段 / 字段类型与 pattern / 枚举 / 权限白名单 / engines 版本比较</span>'
      + '</div>'
      + '<div id="localResult">' + localResultHtml(lastLocal ? lastLocal.res : null, lastLocal ? lastLocal.meta : null) + '</div>'
      + '</div>'
      + '<div class="panel-h">最近一次本地校验<span class="spacer"></span><span class="num">' + localChecks.length + ' 次</span></div>'
      + '<div class="panel-b">' + runs + '</div>'
      + '<div class="panel-b"><p class="note">校验范围是<b>子集</b>：只覆盖 manifest 顶层结构、engines 门禁与 signature 的形状，'
      + '不含 contributes 内部参数的语义校验（key 冲突 / stage 是否存在 / impact 范围 / 预设校验和），'
      + '也<b>不做</b> Ed25519 验签——浏览器里没有可信公钥，验签只在 Node 侧的 plugins/loader.js 做。</p></div>'
      + '</div>';
  }

  /* 文件读取：真读、真校验、真记录 */
  document.addEventListener('change', function (ev) {
    const input = ev.target;
    if (!input || input.id !== 'fileInput' || !input.files || !input.files[0]) return;
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = function () {
      let parsed = null;
      let res;
      try {
        parsed = JSON.parse(String(reader.result));
        res = localCheck(parsed);
      } catch (err) {
        res = {
          ok: false, id: '', name: '',
          rules: [{ code: 'JSON_SYNTAX', path: '$', message: String(err && err.message || err), rule: 'JSON.parse' }],
          executed: ['JSON.parse']
        };
      }
      const meta = { file: file.name, size: file.size, at: clock(new Date()) };
      localChecks.unshift({
        at: meta.at, file: file.name, id: res.id, ok: res.ok,
        codes: res.rules.map((r) => r.code)
      });
      lastLocal = { res: res, meta: meta };
      if (tab === 'check') renderDetail();
      toast((res.ok ? '本地校验通过：0 条规则命中' : '本地校验不通过：命中 ' + res.rules.length + ' 条规则')
        + '（' + file.name + '）');
    };
    reader.onerror = function () { toast('读取文件失败：' + file.name); };
    reader.readAsText(file);
    input.value = '';   // 允许重复选同一个文件
  });

  /* ═══════════════════════════ 详情渲染 ═══════════════════════════ */
  function renderEmptyDetail() {
    $('#mainB').innerHTML = '<div class="empty">'
      + '<b>快照里没有插件</b>'
      + '<div>页面读的是构建期注入的 <span class="mono">plugins/snapshot.json</span>。让它不空的办法有两条：</div>'
      + '<div>1. 在项目根跑 <span class="mono">node tools/snap_plugins.mjs</span> 重新生成快照，再跑 <span class="mono">node tools/build_module.mjs plugins</span>；</div>'
      + '<div>2. 把插件包放进 <span class="mono">plugins/packs/</span>，异常样例放进 <span class="mono">plugins/fixtures/</span>（每个包一个目录，内含 plugin.json）。</div>'
      + '<div class="hint">校验器是 plugins/loader.js：页面上的 state、errors[]、warnings[] 全部由它真跑得出，本页不生成任何结论。</div>'
      + '</div>';
    $('#mainF').textContent = '数据来源 plugins/snapshot.json（' + SNAP_AT + '）';
  }

  function renderDetail() {
    if (!ENTRIES.length) { renderEmptyDetail(); return; }
    const e = entryOf(selected) || ENTRIES[0];
    selected = e.id;
    let html = '';
    if (tab === 'manifest') html = renderManifestTab(e);
    else if (tab === 'perm') html = renderPermTab(e);
    else if (tab === 'ui') html = renderUiTab();
    else html = renderCheckTab(e);
    $('#mainB').innerHTML = html;
    $('#mainF').innerHTML = '条目 <span class="mono">' + esc(e.dir) + '</span>'
      + ' · state 由 <span class="mono">' + esc(e.state_from || '') + '</span> 推导'
      + ' · 签名 <span class="mono">' + esc(sigOf(e).code) + '</span>'
      + ' · 错 <span class="num">' + (e.errors || []).length + '</span> 警 <span class="num">' + (e.warnings || []).length + '</span>'
      + ' · 启停只记本地意图（<span class="mono">' + LS_KEY + '</span>），执行在 loader 侧';
  }

  /* ═══════════════════════════ 页脚与徽标 ═══════════════════════════ */
  function renderChrome() {
    const active = ENTRIES.filter((e) => e.state === 'active').length;
    const review = ENTRIES.filter((e) => e.state === 'needs-review').length;
    const unsigned = ENTRIES.filter((e) => e.state === 'unsigned').length;
    const rejected = ENTRIES.filter((e) => e.state === 'rejected').length;
    const signedOk = ENTRIES.filter((e) => sigOf(e).ok).length;
    $('#bActive').innerHTML = '<span class="dot ok"></span><span class="num">' + active + '</span> 可用';
    $('#bReview').innerHTML = '<span class="dot warn"></span><span class="num">' + review + '</span> 需复核';
    if ($('#bUnsigned')) $('#bUnsigned').innerHTML = '<span class="dot warn"></span><span class="num">' + unsigned + '</span> 未签名';
    $('#bRejected').innerHTML = '<span class="dot bad"></span><span class="num">' + rejected + '</span> 被拒';

    const c = COUNTS || {};
    $('#provenance').innerHTML = '数据来源 <span class="mono">plugins/snapshot.json</span>'
      + ' · 生成时间 <span class="num">' + esc(SNAP_AT) + '</span>'
      + ' · 宿主 avp <span class="num">' + esc(HOST_VER) + '</span>'
      + ' · 校验器 <span class="mono">plugins/loader.js</span>';
    $('#stCounts').innerHTML = '包 <span class="num">' + num(c.entries || ENTRIES.length) + '</span>'
      + ' · 可用 <span class="num">' + active + '</span>'
      + ' · 需复核 <span class="num">' + review + '</span>'
      + ' · 未签名 <span class="num">' + unsigned + '</span>'
      + ' · 被拒 <span class="num">' + rejected + '</span>'
      + ' · 签名通过 <span class="num">' + signedOk + '</span>'
      + ' · 错 <span class="num">' + num(c.errors) + '</span>'
      + ' · 警 <span class="num">' + num(c.warnings) + '</span>';
  }

  /* ═══════════════════════════ 标签页 ═══════════════════════════ */
  function setTab(next) {
    tab = next;
    const tabs = document.querySelectorAll('#tabs .tab');
    for (let i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-selected', tabs[i].dataset.tab === tab ? 'true' : 'false');
    }
    if (ENTRIES.length) renderDetail();
  }
  document.querySelectorAll('#tabs .tab').forEach((btn) => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });

  /* ═══════════════════════════ 导出审计报告 ═══════════════════════════ */
  function buildAudit() {
    const now = new Date();
    const plugins = ENTRIES.map((e) => ({
      id: e.id,
      name: e.name,
      version: e.version,
      type: e.type,
      dir: e.dir,
      origin: e.origin,
      listed_in_runtime: e.listed_in_runtime,
      state: e.state,
      state_from: e.state_from,
      reason: e.reason,
      applies: e.applies,
      applied: e.applied,
      engines: e.engines,
      engines_check: e.engines_check,
      permissions_declared: e.permissions_declared,
      permissions_recognized: e.permissions_recognized,
      permissions_unknown: e.permissions_unknown,
      contributes: e.contributes,
      signature: sigOf(e),
      manifest_signature: (e.manifest && e.manifest.signature) || null,
      errors: e.errors,
      warnings: e.warnings,
      local_intent: intentOf(e.id)
    }));
    return {
      schema: 'ai-video-platform/plugins-audit',
      format: 1,
      generated_at: now.toISOString(),
      generated_at_local: stamp(now),
      host_version: HOST_VER,
      host: {
        platform_version: HOST.platform_version,
        registry_version: HOST.registry_version,
        platform_version_source: HOST.platform_version_source,
        version_rule: HOST.version_rule,
        base_params: HOST.base_params
      },
      snapshot: {
        file: 'plugins/snapshot.json',
        generated_at: SNAP_AT,
        generated_at_utc: (SNAP && SNAP.generated_at_utc) || null,
        built_by: (SNAP && SNAP.built_by) || 'tools/snap_plugins.mjs',
        validator: 'plugins/loader.js',
        schema_file: (SNAP && SNAP.schema_file) || 'plugins/schema/plugin.schema.json'
      },
      permission_whitelist: WHITELIST,
      counts: COUNTS,
      runtime: (SNAP && SNAP.runtime) || null,
      ui_runtime: {
        host: 'plugins/index.html',
        host_mounted: true,
        cross_module_hosts: HOSTS,
        cross_module_mounted: false,
        note: '主题写 documentElement 的 CSS 变量、面板挂 slot dock —— 只在 plugins/index.html 本页真渲染；'
          + 'app/ web/ canvas/ inspector/ 未订阅，跨模块 slot 只登记不渲染。',
        applied_theme: appliedTheme,
        applied_css_vars: appliedProps.slice(),
        themes: themeEntries().map((x) => ({ plugin_id: x.entry.id, plugin_state: x.entry.state, id: x.theme.id, title: x.theme.title, tokens: Object.keys(x.theme.tokens || {}).length })),
        panels: panelEntries().map((x) => ({ plugin_id: x.entry.id, plugin_state: x.entry.state, id: x.panel.id, slot: x.panel.slot, fields: (x.panel.fields || []).map((f) => f.key) }))
      },
      schema_contract: SCHEMA,
      plugins: plugins,
      local_state_intent_key: LS_KEY,
      local_state_intent: intent,
      local_validations: localChecks
    };
  }

  $('#btnExport').addEventListener('click', function () {
    if (!ENTRIES.length) { toast('快照里没有插件，导出的审计报告只会有空清单'); }
    const audit = buildAudit();
    const text = JSON.stringify(audit, null, 2) + '\n';
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'plugins-audit.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('已导出 plugins-audit.json · ' + pluginsSummary(audit) + ' · ' + (blob.size / 1024).toFixed(1) + ' KB');
  });

  function pluginsSummary(audit) {
    const errs = audit.plugins.reduce((a, p) => a + p.errors.length, 0);
    const warns = audit.plugins.reduce((a, p) => a + p.warnings.length, 0);
    return audit.plugins.length + ' 个包 · 错 ' + errs + ' · 警 ' + warns;
  }

  /* 顶栏「本地校验」= 切到校验页并把焦点放到文件输入上；不做任何假动作 */
  $('#btnLocal').addEventListener('click', function () {
    if (!ENTRIES.length) {
      toast('快照里没有插件，但本地校验仍然可用：先切到空态页再看提示');
      return;
    }
    setTab('check');
    const input = document.getElementById('fileInput');
    if (input) { input.focus(); input.click(); }
  });

  /* ═══════════════════════════ 提示条 ═══════════════════════════ */
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 3200);
  }

  /* ═══════════════════════════ 启动 ═══════════════════════════ */
  function render() {
    renderChrome();
    renderList();
    renderHeader();
    renderDetail();
  }
  render();
  setTab('manifest');

  /* 自检钩子：给自动化验证用（不参与界面） */
  window.__AVPPLUGINS = {
    get snapshot() { return SNAP; },
    get entries() { return ENTRIES; },
    get selected() { return selected; },
    get tab() { return tab; },
    get intent() { return intent; },
    get localChecks() { return localChecks; },
    get appliedTheme() { return appliedTheme; },
    get appliedCssVars() { return appliedProps.slice(); },
    select: function (id) { if (entryOf(id)) { selected = id; render(); } },
    setTab: setTab,
    localCheck: localCheck,
    sigOf: sigOf,
    themeEntries: themeEntries,
    panelEntries: panelEntries,
    applyTheme: applyTheme,
    resetTheme: resetTheme,
    slots: SLOTS,
    validateText: function (text) {
      let parsed;
      try { parsed = JSON.parse(text); } catch (e) { return { ok: false, rules: [{ code: 'JSON_SYNTAX', path: '$', message: String(e.message), rule: 'JSON.parse' }] }; }
      return localCheck(parsed);
    },
    satisfies: satisfies,
    buildAudit: buildAudit
  };
})();
</script>
</body>
</html>
