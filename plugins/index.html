<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件管理 · VisInter-Agent v0.1</title>
<!--
  plugins/plugins.src.html —— 插件管理入口的源件（构建产物 plugins/index.html，单文件双击可用）

  构建期注入三块（顺序见 tools/build_module.mjs，占位符只出现在下面的 style 与 script 里）：
    TOKENS ← ui/tokens.css       视觉令牌
    UI     ← ui/module-ui.css    四模块共享骨架
    SNAP   ← plugins/snapshot.json  由 tools/snap_plugins.mjs 用 plugins/loader.js 真跑出来

  本页做四件事，且每件都必须落在真实字段上：
    1) 把快照里的 state 分组显示（可用 / 需复核 / 未签名 / 被拒）—— 状态名来自 loader，不自造；
    2) 展示 errors[] / warnings[] 原文（path / code / message），不做意译；
    3) 本地校验：按快照里的 schema 约束 + 权限白名单 + engines 版本比较给出 0/1 结论；
    4) ui 运行时：主题真的写进 :root CSS 变量、面板真的挂进四个 slot 容器（跨模块宿主标「登记不渲染」）。

  明确不做的两件事（写在页面里，不藏在文档里）：
    - 启停只记本地意图（localStorage avp.plugins.state），真实启用/停止属于服务端能力，执行在 loader 侧；
    - 权限是声明式标签，加载器不沙箱执行代码。
-->
<style>
/* ═══════════════════════════════════════════════════════════════════════
   tokens.css —— 平台唯一视觉令牌源
   ───────────────────────────────────────────────────────────────────────
   定位：「暗黑玻璃拟态 · 冷银基调」。深黑 #08080a 上悬浮两团冷色光晕
   （左上蓝灰、右下紫灰），所有卡片/面板/输入/弹窗是一层半透明白玻璃：
   光从玻璃后面透出来，边缘靠 1px 亮线勾勒，hover 上浮并泛一圈冷光。

   为什么要有这个文件：
     七套界面此前各持一份配色。令牌集中到一处之后，全平台只有一种视觉人格，
     并且「像不像暗黑玻璃」这件事变成了可被 lint 校验的硬指标（tools/lint_ui.mjs）。

   四条硬规矩（违反即 lint 失败）：
     1. 玻璃面统一：背景 rgba(255,255,255,.06)、边框 rgba(255,255,255,.12)、
        圆角 16px、blur(20px) saturate(1.4)、黑阴影 + 顶部 1px 内亮线。
     2. 冷银唯一强调：--acc #C8CDD4，高亮 #EEF1F5。光晕只许冷色
        （蓝灰/紫灰/银，通道差 ≤ 64 且蓝≥红），禁止暖色荧光与 AI 紫。
     3. hover 三件套：背景提亮到 .10、边框提亮到 .25、上浮 3px + 冷光
        0 0 20px rgba(180,200,230,.15)。循环动画只给铸造粒子/烟雾加载器。
     4. 碑铭字体保留：平台名与卡片标题走 --serif 宽字距；正文 --sans
        小字号松行高；数字一律 tabular-nums。颗粒层保留（胶片感）。

   使用方式：
     单文件产物要求双击 file:// 可用 → 不允许运行时 @import。
     各 HTML 的 :root 必须**逐字复制**本文件的变量块；lint 会比对变量名与取值。
     通用玻璃类 .glass-card / .glass-btn / .glass-input 在本文件底部，
     组件直接挂类，不要各写一份玻璃配方。移动端 blur 自动降到 12px。
   ═══════════════════════════════════════════════════════════════════════ */

/* 碑铭衬线：Cinzel（SIL OFL，本地 woff2，见 assets/fonts/LICENSE-Cinzel.txt）。
   中文无 Cinzel 字形，自然落到宋体/思源宋体——碑铭感靠字距与字重，不靠假字体。 */
@font-face {
  font-family: "Cinzel";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("../assets/fonts/cinzel-latin-400.woff2") format("woff2");
}
@font-face {
  font-family: "Cinzel";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("../assets/fonts/cinzel-latin-700.woff2") format("woff2");
}

:root {
  /* ── 玻璃明度阶梯：半透明白膜叠在深黑上，冷光晕从后面透出来 ──────
     越靠近内容越亮。--panel 是标准玻璃面，--panel2 是膜内凹槽。 */
  --bg:        #08080a;   /* 应用底（双光晕的落点） */
  --bg-deep:   #0a0a0d;   /* 画布凹槽（节点图、时间轴）：比玻璃面更暗 */
  --panel:     rgba(255, 255, 255, 0.06);   /* 标准玻璃面 */
  --panel2:    rgba(255, 255, 255, 0.04);   /* 输入框 / 膜内凹槽 */
  --panel3:    rgba(255, 255, 255, 0.10);   /* 悬停态 */
  --panel4:    rgba(255, 255, 255, 0.14);   /* 按下 / 选中填充 */

  /* ── 分隔线：玻璃边缘的亮线（1px 半透明白）───────────────────── */
  --line:      rgba(255, 255, 255, 0.12);   /* 常规玻璃边框 */
  --line2:     rgba(255, 255, 255, 0.18);   /* 强分隔 / 输入框边框 */
  --line3:     rgba(255, 255, 255, 0.25);   /* hover / 焦点边框 */

  /* ── 文字（三级，绝不用纯白：纯白在暗底上光晕扩散）────────────── */
  --text:      #d4d8de;   /* 主文本 */
  --text-dim:  #7a8089;   /* 次要说明 */
  --text-dim2: #565c66;   /* 占位 / 禁用 */

  /* ── 唯一强调色：冷银。高亮 #eef1f5，像光扫过玻璃边缘 ─────────── */
  --acc:       #c8cdd4;
  --acc-hover: #eef1f5;
  --acc-dim:   #8a9099;
  --acc-fill:  rgba(200, 205, 212, 0.10);  /* 选中行底色 */

  /* ── 语义状态（降饱和；血红只作错误信号，不铺大面）──────────────
     --bad 太暗不能作文字色，错误文案用 --bad-ink，边框/填充用 --bad。 */
  --ok:        #7d9b84;
  --warn:      #b3985a;
  --bad:       #6b2020;
  --bad-ink:   #c98080;
  --ok-fill:   rgba(125, 155, 132, 0.12);
  --warn-fill: rgba(179, 152, 90, 0.12);
  --bad-fill:  rgba(107, 32, 32, 0.16);

  /* ── 端口/类型色（节点图专用，仅连线与 3-4px 圆点；全部压成灰调）── */
  --t-model:   #8d84a0;   /* 模型 */
  --t-latent:  #a08489;   /* 潜空间 */
  --t-image:   #a09678;   /* 图像 */
  --t-number:  #7f948c;   /* 数值 */
  --t-text:    #84909f;   /* 文本 */

  /* ── 字号（正文小字号 + 松行高；碑铭标题另走 --serif 放大）────── */
  --fz-xs: 10.5px;
  --fz-s:  11.5px;
  --fz:    12.5px;
  --fz-l:  13.5px;
  --fz-xl: 15px;
  --lh:    1.6;

  /* ── 间距（4 的倍数）─────────────────────────────────────────── */
  --sp1: 4px;  --sp2: 8px;  --sp3: 12px;  --sp4: 16px;  --sp5: 24px;

  /* ── 圆角（玻璃 16 / 按钮与输入 12 / 小件 8）──────────────────── */
  --r:   8px;
  --r2:  12px;
  --r3:  16px;       /* 卡片 / 面板 / 弹窗 */
  --r-pill: 999px;   /* 只用于状态点、计数徽标 */

  /* ── 阴影与光：黑阴影托底 + 顶部内亮线；冷光只给 hover/焦点 ────── */
  --shadow-pop: 0 8px 32px rgba(0, 0, 0, 0.3);
  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --glow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 20px rgba(180, 200, 230, 0.15);
  --glow-soft: 0 0 20px rgba(180, 200, 230, 0.08);
  --glass: rgba(255, 255, 255, 0.06);   /* 导航/顶栏/侧栏的玻璃底 */

  /* ── 玻璃配方（通用类共用；移动端 --glass-blur 自动降档）───────── */
  --glass-blur: blur(20px) saturate(1.4);
  --glass-blur-lite: blur(12px) saturate(1.3);
  --glass-hover: rgba(255, 255, 255, 0.10);
  --glass-line-hover: rgba(255, 255, 255, 0.25);
  --glow-cool: rgba(180, 200, 230, 0.15);
  /* 环境光：玻璃必须「有东西可透」。0.16 的光晕压在 #08080a 上只剩 #1a1d24，
     肉眼等于平黑——玻璃层再正确也读不出来。这里提到 0.30/0.26，
     合成后左上≈#262d39（蓝灰）、右下≈#241f2c（紫灰），仍远低于卡片明度。 */
  --amb-blue: rgba(108, 132, 172, 0.30);   /* 左上蓝灰环境光 */
  --amb-purple: rgba(132, 112, 168, 0.26); /* 右下紫灰环境光 */
  --amb-core: rgba(226, 232, 240, 0.05);   /* 中景冷白核心光，给玻璃一层极淡的迎光面 */
  --vignette: radial-gradient(120% 92% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.55) 100%);
  --sheen: linear-gradient(158deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0) 46%);

  /* ── 动效（状态切换 90-140ms；入场与铸造加载走 --t-slow）───────── */
  --t-fast: 90ms;
  --t:      140ms;
  --t-slow: 320ms;
  --ease:   cubic-bezier(0.2, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  /* ── 过渡别名（迁移垫片，不是设计决策）───────────────────────── */
  --dim:   #7a8089;
  --dim2:  #565c66;
  --acc2:  #eef1f5;

  /* ── 字体 ─────────────────────────────────────────────────────
     数字一律 tabular-nums：参数面板全是会跳动的数字，等宽数字能避免整行抖动。 */
  --sans: -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC",
          "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  --serif: "Cinzel", "Palatino Linotype", "Book Antiqua", Georgia,
           "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
}

/* ── 基础层：七个界面共用的最小复位与排版基调 ───────────────────── */
/* 底：深黑 + 两团冷色径向光晕（左上蓝灰 / 右下紫灰）+ 中景冷白核光 + 边缘压暗。
   fixed 不随滚动漂移。光晕是玻璃的「景」——没有它们，blur 透出来的只是一片死黑。 */
html {
  background-color: var(--bg);
  background-image:
    radial-gradient(78% 62% at 6% -4%, var(--amb-blue) 0%, rgba(108, 132, 172, 0) 68%),
    radial-gradient(70% 58% at 104% 102%, var(--amb-purple) 0%, rgba(132, 112, 168, 0) 68%),
    radial-gradient(60% 46% at 50% 34%, var(--amb-core) 0%, rgba(226, 232, 240, 0) 70%),
    radial-gradient(120% 92% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.55) 100%);
  background-repeat: no-repeat;
  background-attachment: fixed;
}
body {
  background: transparent;
  color: var(--text);
  font: var(--fz)/var(--lh) var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
/* 胶片颗粒：极细噪点铺满视口，不拦截指针；4% 透明度只够"感觉到"不够"看到" */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.045;
  mix-blend-mode: overlay;
  background: url("../assets/grain.png") repeat;
  background-size: 160px 160px;
}

/* ── 通用玻璃类：组件直接挂类，配方只此一份 ─────────────────────── */
.glass-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 可交互玻璃卡：hover 提亮 + 上浮 3px + 冷光（风格卡/作品卡/模板卡） */
.glass-card.hoverable {
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.glass-card.hoverable:hover {
  background: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
.glass-btn {
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
              box-shadow var(--t) var(--ease), color var(--t) var(--ease);
}
.glass-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: var(--glass-line-hover);
  color: var(--acc-hover);
  box-shadow: 0 0 20px var(--glow-cool);
}
.glass-input {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  color: var(--text);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease),
              background var(--t) var(--ease);
}
.glass-input:focus {
  outline: none;
  border-color: var(--glass-line-hover);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: var(--glow);
}
.glass-input::placeholder { color: var(--text-dim2); }

/* 移动端：blur 降到 12px，避免大面积毛玻璃拖垮帧率 */
@media (max-width: 900px) {
  :root { --glass-blur: blur(12px) saturate(1.3); }
}

/* 碑铭体：平台名、卡片标题、章节题字共用 */
.serif {
  font-family: var(--serif);
  letter-spacing: 0.14em;
  font-weight: 700;
}

/* 数字等宽：所有数值读数都用它 */
.num, kbd, code, .mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* 焦点环：冷银描边 + 一圈极淡冷光，键盘可达 */
:focus-visible {
  outline: 1px solid var(--acc);
  outline-offset: 2px;
  box-shadow: 0 0 0 3px rgba(180, 200, 230, 0.12);
}

/* 滚动条：细、暗、玻璃亮线 thumb，hover 提亮；不用系统默认蓝条 */
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--line2); border-radius: var(--r); }
*::-webkit-scrollbar-thumb:hover { background: var(--acc-dim); }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-corner { background: transparent; }

/* 选区：银的低透明填充，不用系统蓝 */
::selection { background: var(--acc-fill); color: var(--acc-hover); }

/* ── 玻璃族第二批：弹窗 / 浮条 / 侧栏 / 凹槽 / 胶囊 ──────────────────
   同一套配方，只是圆角与投影档位不同。组件直接挂类，别再复写 blur。 */
.glass-modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
.glass-toast {
  background: var(--glass-hover);
  border: 1px solid var(--glass-line-hover);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
/* 悬浮工具条：画布顶部/参数板顶部那种横条，圆角 16 贴在内容之上 */
.glass-toolbar {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 侧栏 / 导航栏：从贴边条改成悬浮玻璃板（margin 16 + 圆角 16） */
.glass-rail {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 凹槽：画布底、代码块、时间轴这类「玻璃板里的暗面」，不铺毛玻璃 */
.glass-well {
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.glass-chip {
  background: var(--panel2);
  border: 1px solid var(--line2);
  border-radius: var(--r2);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
}

/* 玻璃卡顶部迎光：一层极淡的白到透明的斜向渐变，让平面看出弧面 */
.glass-card, .glass-modal, .glass-rail, .panel {
  background-image: var(--sheen);
  background-repeat: no-repeat;
}

/* ── 无 backdrop-filter 的浏览器：把膜加厚一档，至少不塌成纯黑 ──────── */
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass-card, .glass-modal, .glass-rail, .glass-toolbar { background-color: rgba(255, 255, 255, 0.10); }
  .glass-toast { background-color: rgba(255, 255, 255, 0.14); }
}

/* ── 移动端：blur 降到 12px；小控件直接关掉毛玻璃，省一次合成 ────────── */
@media (max-width: 900px) {
  :root { --glass-blur: blur(12px) saturate(1.3); }
  .glass-btn, .glass-chip, .glass-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background-color: rgba(255, 255, 255, 0.09);
  }
}

/* ── 尊重系统设置：减少动效 / 减少透明 ─────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .glass-card.hoverable:hover, .glass-btn:hover { transform: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .glass-card, .glass-modal, .glass-rail, .glass-toolbar, .glass-toast, .glass-chip, .glass-btn, .glass-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background-color: rgba(24, 26, 30, 0.92);
  }
}
/* ═══════════════════════════════════════════════════════════════════════
   module-ui.css —— 功能模块入口的共享骨架
   ───────────────────────────────────────────────────────────────────────
   定位：market / plugins / quality / server 四个入口共用同一套外壳结构
   （顶栏 / 左列表 / 右详情 / 底部口径条），差异只在中间的「内容形态」。

   视觉人格：暗黑玻璃拟态 · 冷银基调（ui/tokens.css 为唯一令牌源）。
     - 顶栏 / 侧栏 / 详情区头 / 底部口径条：四块悬浮玻璃板，统一 margin 16 + 圆角 16 + blur 20
     - 侧栏：#08080a 上的半透明白膜（.body > .aside，比 skin 的 .aside 高一级）
     - 选中态：左侧 2px 冷银竖线 + 一圈冷银亮边，不做亮色填充、不引入彩色
     - 按钮：玻璃底 rgba(255,255,255,.1) + 1px 亮边 + 冷白字，圆角 12；输入框圆角 16
     - 卡片：.06 白膜 + 0 8px 32px rgba(0,0,0,.3) + inset 0 1px 0 rgba(255,255,255,.08)
     - 凹槽：标签页与代码/日志块走 .glass-well 口径（bg-deep + 内描边，不铺毛玻璃）
     - 卡片标题：碑铭衬线（--serif）宽字距；表格行 hover 只提亮、不位移

   规矩（与 docs/09-design-system.md 一致，lint 会拦）：
     - 只用 ui/tokens.css 的变量，不新增色值
     - 圆角只走 --r / --r2 / --r3 / --r-pill（卡片上限 16px）
     - 光晕只给冷色（--glow / --glow-soft / --glow-cool），投影只给中性黑
   ═══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: transparent; color: var(--text); font: var(--fz)/var(--lh) var(--sans); }
a { color: var(--acc); text-decoration: none; }
a:hover { color: var(--acc-hover); }

/* ── 页面骨架：悬浮玻璃顶栏 + 主体 + 口径条 24 ───────────────────── */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr) 24px; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: var(--sp3);
  margin: var(--sp4) var(--sp4) 0; min-height: 38px;
  padding: 0 var(--sp3);
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line); border-radius: var(--r3);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
  position: relative; z-index: 5;
}
.topbar .brand { display: flex; align-items: baseline; gap: var(--sp2); }
.topbar .brand b {
  font-family: var(--serif); font-size: var(--fz-l); font-weight: 700;
  letter-spacing: 0.18em; color: var(--acc);
}
.topbar .brand span { font-size: var(--fz-xs); color: var(--text-dim2); letter-spacing: 0.08em; }
.topbar .spacer { flex: 1; }
.topbar .crumbs { font-size: var(--fz-s); color: var(--text-dim); }
.topbar .crumbs i { color: var(--text-dim2); font-style: normal; padding: 0 var(--sp1); }

.body { display: grid; grid-template-columns: var(--col, 320px) minmax(0, 1fr); min-height: 0; }
.body.no-aside { grid-template-columns: minmax(0, 1fr); }

/* 侧栏：贴边条 → 悬浮玻璃板（margin 16 / 圆角 16 / blur 20 / 边框 rgba(255,255,255,.12)）。
   选择器写在 .body > .aside：glass-skin.css 里 .aside 只留膜（background-color: transparent，
   玻璃底色交给页面），这里比它高一级，底色与迎光面由骨架自己给，两边不互相覆盖。 */
.body > .aside {
  display: flex; flex-direction: column; min-height: 0;
  margin: var(--sp4) 0 var(--sp4) var(--sp4);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  background-color: var(--glass);
  background-image: var(--sheen);
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
  overflow: hidden;   /* 内部滚到底也不露直角 */
}
.aside-h {
  display: flex; align-items: center; gap: var(--sp2); height: 28px; padding: 0 var(--sp2);
  border-bottom: 1px solid var(--line); font-size: var(--fz-xs); color: var(--text-dim);
  letter-spacing: 0.12em; flex: 0 0 auto;
}
.aside-h .spacer { flex: 1; }
.aside-b { flex: 1; min-height: 0; overflow: auto; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: transparent; }
/* 详情区头：悬浮玻璃条，与左栏板同一条基线（左 16 / 上 16），下沿不画分隔线 */
.main-h {
  display: flex; align-items: center; gap: var(--sp2);
  margin: var(--sp4) var(--sp4) 0;
  padding: var(--sp2) var(--sp3); min-height: 34px; flex: 0 0 auto;
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--glass);
  background-image: var(--sheen);
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
.main-h h2 {
  margin: 0; font-family: var(--serif); font-size: var(--fz-l); font-weight: 700;
  letter-spacing: 0.12em; color: var(--acc);
}
.main-h .sub { font-size: var(--fz-xs); color: var(--text-dim); }
.main-h .spacer { flex: 1; }
.main-b { flex: 1; min-height: 0; overflow: auto; padding: var(--sp3) var(--sp4); }
/* 底部口径条：悬浮玻璃条（统计/说明常驻在这里），左右与主体内容同一列线 */
.main-f {
  flex: 0 0 auto; margin: var(--sp3) var(--sp4) var(--sp4);
  padding: var(--sp2) var(--sp3); font-size: var(--fz-xs); color: var(--text-dim);
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--glass);
  background-image: var(--sheen);
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}

/* 全平台口径条（最底一行）：细玻璃条，不做大圆角，只提亮到膜上 */
.statusbar {
  display: flex; align-items: center; gap: var(--sp3); padding: 0 var(--sp4);
  background-color: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  border-top: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  font-size: var(--fz-xs); color: var(--text-dim2);
}
.statusbar .spacer { flex: 1; }
.statusbar .num { color: var(--text-dim); }

/* ── 列表行（左栏主力形态）───────────────────────────────────────── */
.list { display: flex; flex-direction: column; }
.list .row {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto;
  align-items: center; gap: var(--sp2);
  padding: 0 var(--sp2); min-height: 28px; cursor: pointer;
  border-bottom: 1px solid var(--line); color: var(--text);
  transition: background var(--t-fast) var(--ease);
}
.list .row:hover { background: var(--panel3); }
/* 选中 = 左 2px 冷银竖线 + 一圈冷银亮边 + 极淡银底；全程冷银，不用任何彩色 */
.list .row[aria-selected="true"] {
  background: var(--acc-fill);
  box-shadow: inset 2px 0 0 var(--acc), inset 0 0 0 1px var(--glass-line-hover);
  color: var(--acc-hover);
}
.list .row[aria-selected="true"]:hover { background: var(--panel3); }
.list .row .t { font-size: var(--fz); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .row .s { font-size: var(--fz-xs); color: var(--text-dim2); }
.list .row .ico { display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
.list .row[aria-selected="true"] .ico { color: var(--acc); }
.list .sect {
  padding: var(--sp2) var(--sp2) var(--sp1); font-size: var(--fz-xs); color: var(--text-dim2);
  letter-spacing: 0.12em; border-bottom: 1px solid var(--line); background: transparent;
}
.list .empty-row { padding: var(--sp3); color: var(--text-dim2); font-size: var(--fz-s); }

/* ── 徽标与状态点 ────────────────────────────────────────────────── */
.dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--text-dim2); flex: 0 0 auto; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.dot.acc { background: var(--acc); }
.dot.off { background: var(--line2); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 17px; padding: 0 6px;
  border: 1px solid var(--line2); border-radius: var(--r); background: var(--panel2);
  font-size: var(--fz-xs); color: var(--text-dim); white-space: nowrap;
}
.badge.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-fill); }
.badge.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-fill); }
.badge.bad { border-color: var(--bad); color: var(--bad-ink); background: var(--bad-fill); }
.badge.acc { border-color: var(--acc-dim); color: var(--acc); background: var(--acc-fill); }
.badge.pill { border-radius: var(--r-pill); }

/* ── 按钮：玻璃底 + 1px 亮边 + 冷白字；hover 提亮泛冷光 ───────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 26px; padding: 0 11px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line); border-radius: var(--r2); background: rgba(255, 255, 255, 0.10);
  color: var(--text); font: var(--fz-s)/1 var(--sans); letter-spacing: 0.06em;
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              box-shadow var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.btn:hover { background: rgba(255, 255, 255, 0.14); border-color: var(--glass-line-hover); color: var(--acc-hover); box-shadow: 0 0 20px var(--glow-cool); }
.btn:active { background: var(--panel4); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
/* 主操作：不是实心色块，而是亮边更亮一档的玻璃碑牌 */
.btn.acc { background: var(--panel3); border-color: var(--acc-dim); color: var(--acc-hover); letter-spacing: 0.12em; }
.btn.acc:hover { background: var(--panel4); border-color: var(--acc-hover); box-shadow: var(--glow); }
.btn.mini { height: 21px; padding: 0 7px; font-size: var(--fz-xs); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); -webkit-backdrop-filter: none; backdrop-filter: none; }
.btn.ghost:hover { background: var(--panel3); color: var(--text); box-shadow: none; }

/* ── 表单：膜内凹槽 + 1px 亮边；圆角 16（按钮 12，两者别混）────────── */
.input, .select, .textarea {
  height: 26px; padding: 0 8px; color: var(--text);
  background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r3);
  font: var(--fz-s)/1 var(--sans); outline: none;
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.textarea { height: auto; padding: 5px 6px; font-family: var(--mono); resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--acc-hover); box-shadow: var(--glow); }
.input::placeholder { color: var(--text-dim2); }
label.field { display: flex; flex-direction: column; gap: var(--sp1); font-size: var(--fz-xs); color: var(--text-dim); }

/* ── 键值对 / 表格 ───────────────────────────────────────────────── */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px var(--sp3); font-size: var(--fz-s); }
.kv dt { color: var(--text-dim); }
.kv dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.kv dd.num { color: var(--text); }

.tbl { width: 100%; border-collapse: collapse; font-size: var(--fz-s); }
.tbl th, .tbl td { text-align: left; padding: 0 var(--sp2); height: 26px; border-bottom: 1px solid var(--line); }
/* 行 hover 只提亮膜内底色：行高/padding/transform 一律不动，258 行才不抖 */
.tbl td { transition: background-color var(--t-fast) var(--ease); }
.tbl th { color: var(--text-dim); font-weight: 500; font-size: var(--fz-xs); letter-spacing: 0.08em; background: var(--panel2); }
.tbl tr:hover td { background-color: var(--glass-hover); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.mono { font-family: var(--mono); font-size: var(--fz-xs); color: var(--text-dim); }

/* ── 面板 / 卡片：半透明白 .06 + 1px 冷灰边 + 0 8px 32px rgba(0,0,0,.3)
      + inset 0 1px 0 rgba(255,255,255,.08)。四行数值全部来自令牌：
      --panel / --line / --shadow-pop / --shadow-inset，改令牌即全站生效。 */
.panel {
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--panel);
  background-image: var(--sheen);   /* 顶部迎光斜向渐变：平面看出弧面 */
  background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
}
/* 网格里的卡片才上浮（市场概览卡 / 服务面板）；整幅区块例如 quality 的检查项不动，
   否则鼠标划过正文时整块跳动。hover 只加 background-color，保住迎光面。 */
.grid2 > .panel, .grid3 > .panel {
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.grid2 > .panel:hover, .grid3 > .panel:hover {
  background-color: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
.panel + .panel { margin-top: var(--sp3); }
.panel-h {
  display: flex; align-items: center; gap: var(--sp2); height: 28px; padding: 0 var(--sp2);
  border-bottom: 1px solid var(--line); font-size: var(--fz-xs); color: var(--text-dim); letter-spacing: 0.12em;
}
.panel-h .spacer { flex: 1; }
.panel-b { padding: var(--sp3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp3); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp3); }
@media (max-width: 1100px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* ── 空态与提示 ──────────────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp2);
  padding: var(--sp4); border: 1px dashed var(--line2); border-radius: var(--r3);
  color: var(--text-dim); font-size: var(--fz-s); background: var(--panel);
}
.empty b { color: var(--text); font-weight: 600; }
.hint { font-size: var(--fz-xs); color: var(--text-dim2); }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }

/* ── 标签页（详情区切换）：膜内凹槽 + 分段胶囊，不画底线（避免与凹槽边框叠成双线）── */
.tabs {
  display: flex; align-items: center; gap: 2px;
  margin: var(--sp3) var(--sp4) 0; padding: 3px;
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--bg-deep);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.tabs .tab {
  height: 24px; padding: 0 var(--sp3); cursor: pointer; border: 0; border-radius: var(--r2);
  background: transparent; color: var(--text-dim);
  font: var(--fz-s)/1 var(--sans); letter-spacing: 0.06em;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.tabs .tab:hover { color: var(--text); background-color: var(--panel2); }
.tabs .tab[aria-selected="true"] {
  color: var(--acc-hover); background-color: var(--panel3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* ── 进度条（银条；只做状态显示）────────────────────────────────── */
.bar { height: 4px; background: var(--panel4); border-radius: var(--r); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc); }
.bar.ok > i { background: var(--ok); }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }

/* ── 代码/日志块：.glass-well 口径（膜内凹槽，不铺毛玻璃）──────────────
   长文本上再叠一层 backdrop-filter 是纯浪费帧率，凹槽靠 bg-deep + 内描边成像。 */
.code {
  margin: 0; padding: var(--sp2);
  background-color: var(--bg-deep);
  border: 1px solid var(--line); border-radius: var(--r2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  font-family: var(--mono); font-size: var(--fz-xs);
  color: var(--text-dim); overflow: auto; max-height: 220px; white-space: pre-wrap; word-break: break-all;
}
.code .k { color: var(--t-text); }
.code .ok { color: var(--ok); }
.code .bad { color: var(--bad-ink); }

/* ── 窄屏（≤900px）：悬浮板全部取消外边距、贴边全宽，卡片不再上浮 ─────
   blur 的降档在 tokens.css 的 @media (max-width:900px) 里（--glass-blur →
   blur(12px)），骨架一律引用 var(--glass-blur)，所以这里不用再写一遍 blur。 */
@media (max-width: 900px) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .body > .aside {
    margin: 0; border-width: 0 0 1px; border-radius: 0; box-shadow: none;
    max-height: 42vh;   /* 侧栏变成顶部条带，内部照旧滚动 */
  }
  .topbar { margin: var(--sp2) 0 0; border-width: 0 0 1px; border-radius: 0; }
  .main-h { margin: var(--sp2) 0 0; border-width: 0 0 1px; border-radius: 0; box-shadow: none; }
  .main-b { padding: var(--sp3); }
  .main-f { margin: 0; border-width: 1px 0 0; border-radius: 0; box-shadow: none; }
  .statusbar { padding: 0 var(--sp3); }
  .tabs { margin: var(--sp2) 0 0; border-width: 0 0 1px; border-radius: 0; }
  .grid2, .grid3 { gap: var(--sp2); }
  /* 卡片不再上浮：hover 只提亮，位移与冷光一起收掉 */
  .grid2 > .panel:hover, .grid3 > .panel:hover {
    transform: none;
    box-shadow: var(--shadow-pop), var(--shadow-inset);
  }
}
/* ═══════════════════════════════════════════════════════════════════════
   glass-skin.css —— 玻璃映射层（最后一遍）
   ───────────────────────────────────────────────────────────────────────
   定位：ui/tokens.css 定义「玻璃是什么」，本文件负责「把各页已经写好的
   组件选择器映射到那套配方上」。页面源件里只留自己的结构与排版，不再各写
   一份 background/border/blur/shadow。

   为什么单独一层而不是逐组件改：
     七个页面 + 帧检视器共 543KB 源，卡片族有 40 多个类名，逐个改一遍既容易
     漏、又会在下一次改令牌时全部失配。映射层只做增量：圆角补齐、hover 三件套、
     侧栏悬浮、弹窗居中、控件玻璃化。谁想加新卡片，挂 .glass-card 即可。

   注入位置：每个页面 <style> 的最后一行（构建期替换 /*__SKIN__*\/）。
     放在最后 = 同权重规则里一定赢，所以整份文件不需要一个 !important。

   三条规矩：
     1. 只写「页面自己的类名 → 玻璃配方」，不新增色值，全部走 var()。
     2. 不改布局栅格（列宽/行高/顺序由各页自持）；只加外边距让它浮起来。
     3. 循环动画、彩色光晕、纯白文字一律不写（tools/lint_ui.mjs 会拦）。
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 1. 悬浮侧栏：贴边条 → 悬浮玻璃板（margin 16 / 圆角 16 / blur 20）── */
#sidenav,
nav#rail,
#pRail,
aside,
.aside {
  margin: var(--sp4) 0 var(--sp4) var(--sp4);
  border: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-radius: var(--r3);
  background-color: var(--glass);      /* 膜必须由本层给：页面侧多为 transparent，靠 skin 兜底 */

<script>
(function () {
  'use strict';

  /* ═══════════════════════════ 快照 ═══════════════════════════ */
  const SNAP = (window.__SNAP && typeof window.__SNAP === 'object') ? window.__SNAP : null;
  const ENTRIES = (SNAP && Array.isArray(SNAP.entries)) ? SNAP.entries : [];
  const COUNTS = (SNAP && SNAP.counts) || {};
  const HOST = (SNAP && SNAP.host) || {};
  const SCHEMA = (SNAP && SNAP.schema_contract) || {};
  const HOST_VER = HOST.platform_version || '0.1.0';
  const WHITELIST = (SNAP && Array.isArray(SNAP.permission_whitelist) && SNAP.permission_whitelist.length)
    ? SNAP.permission_whitelist
    : ['fs:read', 'net', 'exec', 'gpu'];
  const SNAP_AT = (SNAP && SNAP.generated_at) || '（快照缺失）';
  const LS_KEY = 'avp.plugins.state';           // 只动自己的前缀
  const GROUPS = ['active', 'needs-review', 'unsigned', 'rejected'];
  const STATE_META = {
    active: { label: '可用', tone: 'ok' },
    'needs-review': { label: '需复核', tone: 'warn' },
    unsigned: { label: '未签名', tone: 'warn' },
    rejected: { label: '被拒', tone: 'bad' }
  };
  /* 签名原因码 → 人话。页面只照抄 loader 的 code，不自己判断签名对不对：
     loader 报的问题在 errors[]（拒载）或 warnings[]（降级）里，这里只是换个说法 */
  const SIG_CODES = {
    PLUGIN_SIGNATURE_OK: '签名通过',
    PLUGIN_UNSIGNED: '缺签',
    PLUGIN_UNKNOWN_KEY: '未知 key_id',
    PLUGIN_BAD_ALG: 'alg 不支持',
    PLUGIN_BAD_SIGNATURE: '验签失败'
  };
  const SIG_RE = /^PLUGIN_(SIGNATURE_OK|UNSIGNED|UNKNOWN_KEY|BAD_ALG|BAD_SIGNATURE)$/;
  const PERM_NOTE = {
    'fs:read': '允许宿主在加载阶段读取本包目录内的附属文件（当前仅登记，未开放）',
    net: '允许未来拉取远程资产（加载阶段不发任何网络请求）',
    gpu: '声明需要 GPU 预算（求解器会把该包模型计入显存账本）',
    exec: '声明需要运行外部进程（默认隔离，不注入运行时）'
  };

  /* ═══════════════════════════ 工具 ═══════════════════════════ */
  const $ = (sel) => document.querySelector(sel);
  const esc = (v) => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
  const num = (v) => (typeof v === 'number' && isFinite(v) ? String(v) : '0');
  const pad2 = (n) => (n < 10 ? '0' + n : String(n));
  const clock = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  const stamp = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + clock(d);
  const toneOf = (state) => (STATE_META[state] ? STATE_META[state].tone : '');
  const labelOf = (state) => (STATE_META[state] ? STATE_META[state].label : String(state || '未知'));

  /* ═══════════════════════ 本地启停意图 ═══════════════════════
     铁律：这里只记录「用户希望它启用/停用」，不假装能启停插件。
     真实启用/停止属于服务端能力（loader 在 Node 侧合并注册表），浏览器里没有运行时。 */
  function loadIntent() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      const obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
    } catch (e) {
      return {};
    }
  }
  let intent = loadIntent();
  function intentOf(id) { return intent[id] === 'disabled' ? 'disabled' : 'enabled'; }
  function setIntent(id, value) {
    intent[id] = value;
    let ok = true;
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(intent));
    } catch (e) {
      ok = false;   // 隐私模式 / file:// 限制下写不进去：页面照实说，不装作成功
    }
    return ok;
  }

  /* ═══════════════════════════ 视图状态 ═══════════════════════════ */
  let selected = ENTRIES.length ? ENTRIES[0].id : null;
  let tab = 'manifest';
  let localChecks = [];       // 内存态：最近一次本地校验
  let lastLocal = null;

  const entryOf = (id) => ENTRIES.find((e) => e.id === id) || null;

  /* ═══════════════════════ 签名状态（只读 loader 的结论） ═══════════════════════
     规则：manifest 里有 signature + loader 没报签名类问题 ⇒ 通过；
     否则取加载器报的那条原因码（errors 优先于 warnings：被拒比降级更严重）。
     页面**不做**真正的验签——浏览器里没有可信清单，也不该有私钥；
     验签只发生在 Node 侧的 plugins/loader.js。 */
  function sigOf(e) {
    const m = (e && e.manifest) || {};
    const present = !!(m.signature && typeof m.signature === 'object');
    const errs = ((e && e.errors) || []).filter((x) => SIG_RE.test(x.code));
    const warns = ((e && e.warnings) || []).filter((x) => SIG_RE.test(x.code));
    const hit = errs[0] || warns[0] || null;
    if (hit) {
      return { present, ok: false, code: hit.code, label: SIG_CODES[hit.code] || hit.code, tone: errs.length ? 'bad' : 'warn', message: hit.message };
    }
    if (present) {
      return { present, ok: true, code: 'PLUGIN_SIGNATURE_OK', label: SIG_CODES.PLUGIN_SIGNATURE_OK, tone: 'ok', message: '' };
    }
    return { present: false, ok: false, code: 'PLUGIN_UNSIGNED', label: SIG_CODES.PLUGIN_UNSIGNED, tone: 'warn', message: '' };
  }
  /** 所有带 ui 贡献的包（active / unsigned）—— 宿主真正会挂载的那批 */
  function uiPacks() {
    return ENTRIES.filter((e) => {
      const c = (e.manifest && e.manifest.contributes) || {};
      const ui = c.ui;
      if (!ui || typeof ui !== 'object') return false;
      return e.state === 'active' || e.state === 'unsigned';
    });
  }

  /* ═══════════════════════════ 左栏清单 ═══════════════════════════ */
  function renderList() {
    const box = $('#list');
    if (!ENTRIES.length) {
      box.innerHTML = '<div class="empty-row">快照里没有插件。左侧无法列出任何条目 —— 见右侧空态的处理办法。</div>';
      return;
    }
    let html = '';
    for (const key of GROUPS) {
      const rows = ENTRIES.filter((e) => e.state === key);
      html += '<div class="sect">' + esc(STATE_META[key].label) + '<span class="spacer"></span><span class="n">' + rows.length + '</span></div>';
      if (!rows.length) {
        html += '<div class="empty-row">没有' + esc(STATE_META[key].label) + '的包</div>';
        continue;
      }
      for (const e of rows) {
        const disabled = intentOf(e.id) === 'disabled';
        const dot = disabled ? 'off' : toneOf(e.state);
        const isFixture = e.origin === 'fixture';
        const sig = sigOf(e);
        html += '<div class="row' + (disabled ? ' disabled' : '') + '" role="option" tabindex="0"'
          + ' aria-selected="' + (e.id === selected ? 'true' : 'false') + '" data-id="' + esc(e.id) + '"'
          + ' title="' + esc(e.id + ' · ' + (e.dir || '') + ' · 签名 ' + sig.code) + '">'
          + '<span class="ico"><span class="dot ' + dot + '"></span></span>'
          + '<span class="t"><span class="nm">' + esc(e.name || e.id) + '</span>'
          + (isFixture ? '<span class="chip warn">样例·异常</span>' : '')
          + '<span class="chip ' + (sig.tone === 'ok' ? 'ok' : sig.tone) + '">' + esc(sig.present ? sig.label : '缺签') + '</span>'
          + (disabled ? '<span class="chip off">已禁用</span>' : '')
          + '</span>'
          + '<span class="s num">v' + esc(e.version || '?') + ' · ' + esc(e.type || '?') + '</span>'
          + '</div>';
      }
    }
    box.innerHTML = html;
  }

  $('#list').addEventListener('click', (ev) => {
    const row = ev.target.closest('.row');
    if (row && row.dataset.id) { selected = row.dataset.id; render(); }
  });
  $('#list').addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const row = ev.target.closest('.row');
    if (!row || !row.dataset.id) return;
    ev.preventDefault();
    selected = row.dataset.id;
    render();
  });

  /* ui 页签的主题按钮：事件委托。面板 HTML 每次 render 重建，绑在按钮上的监听会一起没掉。 */
  $('#mainB').addEventListener('click', (ev) => {
    const applyBtn = ev.target.closest('[data-theme-apply]');
    if (applyBtn) {
      const parts = String(applyBtn.getAttribute('data-theme-apply') || '').split('::');
      applyTheme(parts[0], parts[1]);
      return;
    }
    if (ev.target.closest('[data-theme-reset]')) resetTheme();
  });

  /* ═══════════════════════════ 右侧标题栏 ═══════════════════════════ */
  function renderHeader() {
    const e = entryOf(selected);
    const btn = $('#btnToggle');
    const intentBadge = $('#intentBadge');
    const sigBadge = $('#sigBadge');
    if (!e) {
      $('#detailTitle').textContent = ENTRIES.length ? '未选中' : '没有插件';
      $('#detailSub').textContent = '';
      btn.disabled = true;
      btn.textContent = '停用';
      intentBadge.className = 'badge';
      intentBadge.textContent = '本地意图';
      if (sigBadge) { sigBadge.className = 'badge'; sigBadge.textContent = '签名'; }
      return;
    }
    $('#detailTitle').textContent = e.name || e.id;
    $('#detailSub').textContent = e.id + ' · v' + (e.version || '?') + ' · ' + (e.type || '?');
    const disabled = intentOf(e.id) === 'disabled';
    btn.disabled = false;
    btn.textContent = disabled ? '启用' : '停用';
    intentBadge.className = 'badge ' + (disabled ? '' : 'acc');
    intentBadge.textContent = disabled ? '已禁用（本地意图）' : '启用中（本地意图）';
    if (sigBadge) {
      const sig = sigOf(e);
      sigBadge.className = 'badge ' + (sig.tone === 'ok' ? 'ok' : sig.tone);
      sigBadge.textContent = sig.present ? sig.label : '缺签（unsigned 风险）';
      sigBadge.title = sig.message || sig.code;
    }
  }

  $('#btnToggle').addEventListener('click', () => {
    const e = entryOf(selected);
    if (!e) return;
    const next = intentOf(e.id) === 'disabled' ? 'enabled' : 'disabled';
    const saved = setIntent(e.id, next);
    render();
    toast(saved
      ? '已把 ' + (e.name || e.id) + ' 的本地意图写为 ' + next + '（' + LS_KEY + '）'
      : '写入 ' + LS_KEY + ' 失败，本次只改了页面状态');
  });

  /* ═══════════════════════════ 清单页 ═══════════════════════════ */
  function fieldRow(label, valueHtml) {
    return '<dt>' + esc(label) + '</dt><dd>' + valueHtml + '</dd>';
  }

  function enginesHtml(e) {
    const chk = e.engines_check || {};
    const eng = e.engines || {};
    const out = [];
    const line = (key, name) => {
      const c = chk[key];
      if (!c) {
        const declared = typeof eng[key] === 'string';
        return declared
          ? '<div class="line"><span class="mono">' + esc(name) + ' ' + esc(eng[key]) + '</span>'
            + '<span class="chip">未比较</span></div>'
          : '<div class="line"><span class="hint">' + esc(name) + ' 未声明</span></div>';
      }
      return '<div class="line"><span class="mono">' + esc(name) + ' ' + esc(c.range) + '</span>'
        + '<span class="badge ' + (c.satisfied ? 'ok' : 'bad') + '">' + (c.satisfied ? '满足' : '不满足') + '</span>'
        + '<span class="hint">宿主 ' + esc(c.against) + '</span></div>';
    };
    out.push(line('platform', 'platform'));
    out.push(line('registry', 'registry'));
    return out.join('') + '<div class="line"><span class="hint">比较规则：' + esc(HOST.version_rule || '') + '</span></div>';
  }

  function contributesHtml(e) {
    const c = e.contributes || {};
    const parts = [];
    if ((c.params || 0) > 0) parts.push('params ' + c.params + ' 条');
    if ((c.models || 0) > 0) parts.push('models ' + c.models + ' 条');
    if (c.node) parts.push('node ' + esc(c.node.id) + '（' + esc(c.node.stage) + '）');
    if (c.preset) parts.push('preset ' + esc(c.preset.name) + '（' + c.preset.values + ' 项，' + esc(c.preset.checksum) + '）');
    if (c.ui) parts.push('ui 主题 ' + c.ui.themes + ' / 面板 ' + c.ui.panels);
    if (!parts.length) parts.push('（contributes 为空）');
    const keys = (c.keys || []).length ? (c.keys || []).join(' / ') : '（无）';
    return '<div class="line">' + parts.join('<span class="hint"> · </span>') + '</div>'
      + '<div class="line"><span class="hint">键：' + esc(keys) + '</span></div>';
  }

  function signatureHtml(e) {
    const m = e.manifest || {};
    const s = m.signature || null;
    const sig = sigOf(e);
    if (!s) {
      return '<span class="chip warn">缺签</span> '
        + '<span class="hint">' + esc(sig.code) + ' · state=' + esc(e.state)
        + '（model/node/exec 缺签直接拒载；ui/preset 降级 unsigned）</span>';
    }
    const short = String(s.sig || '').slice(0, 16) + '…';
    return '<span class="mono">key_id ' + esc(s.key_id) + '</span>'
      + '<span class="chip ' + (sig.tone === 'ok' ? 'ok' : sig.tone) + '">' + esc(sig.label) + '</span>'
      + '<div class="line"><span class="hint">alg ' + esc(s.alg) + ' · sig ' + esc(short) + ' · ' + esc(sig.code) + '</span></div>';
  }

  function renderManifestTab(e) {
    const m = e.manifest || {};
    const missing = '<span class="chip warn">未声明</span>';
    const val = (v) => (typeof v === 'string' && v.length ? esc(v) : missing);
    const head = '<div class="panel">'
      + '<div class="panel-h">manifest 字段<span class="spacer"></span>'
      + (e.origin === 'fixture' ? '<span class="chip warn">样例·异常</span>' : '')
      + '<span class="hint">' + esc(e.dir) + '/plugin.json</span></div>'
      + '<div class="panel-b"><dl class="detail-kv">';
    const body = [
      fieldRow('schema', typeof m.schema === 'string' ? '<span class="mono">' + esc(m.schema) + '</span>' : missing),
      fieldRow('id', '<span class="mono">' + esc(m.id || e.id) + '</span>'),
      fieldRow('name', val(m.name)),
      fieldRow('version', '<span class="mono">' + esc(m.version || e.version || '') + '</span>'),
      fieldRow('type', val(m.type)),
      fieldRow('description', val(m.description)),
      fieldRow('author', val(m.author)),
      fieldRow('homepage', typeof m.homepage === 'string' ? '<a href="' + esc(m.homepage) + '">' + esc(m.homepage) + '</a>' : missing),
      fieldRow('engines', enginesHtml(e)),
      fieldRow('signature', signatureHtml(e)),
      fieldRow('contributes', contributesHtml(e))
    ].join('');
    const raw = '<details class="raw"><summary>manifest 原文（快照内，未经改写）</summary>'
      + '<pre class="code">' + esc(JSON.stringify(m, null, 2)) + '</pre></details>';
    return head + body + '</dl>' + raw + '</div></div>';
  }

  /* ═══════════════════════════ 权限页 ═══════════════════════════ */
  function renderPermTab(e) {
    const declared = Array.isArray(e.permissions_declared) ? e.permissions_declared : [];
    const unknown = Array.isArray(e.permissions_unknown) ? e.permissions_unknown : [];
    let rows = '';
    if (!declared.length) {
      rows = '<tr><td class="mono">（未声明）</td>'
        + '<td><span class="chip">未声明 → 默认拒绝</span></td>'
        + '<td class="wrap">manifest 没有 permissions 字段，loader 解析为 <span class="mono">[]</span>，全部按拒绝处理'
        + '（对应 warning <span class="mono">DEFAULT_DENY</span>）。</td></tr>';
    } else {
      for (const p of declared) {
        const isUnknown = unknown.indexOf(p) >= 0;
        const isExec = p === 'exec';
        const verdict = isUnknown
          ? '<span class="chip warn">未识别（忽略）</span>'
          : isExec
            ? '<span class="chip warn">隔离待复核</span>'
            : '<span class="chip ok">白名单内</span>';
        let note = PERM_NOTE[p] || '不在 permission 白名单内。';
        if (isUnknown) {
          note = '不在 PERMISSION_WHITELIST（' + WHITELIST.join(' / ') + '）内：loader 在权限解析阶段直接丢弃，不登记。';
        } else if (isExec) {
          note = 'loader 把该包登记为 <span class="mono">needs-review</span>，reason 写明「等待人工审核（不注入运行时）」；'
            + '参数不会进入运行时注册表。';
        }
        rows += '<tr><td class="mono">' + esc(p) + '</td><td>' + verdict + '</td><td class="wrap">' + note + '</td></tr>';
      }
    }
    const execHint = declared.indexOf('exec') >= 0
      ? '<p class="note hint"><b>权限是声明式标签，加载器不沙箱执行代码</b> —— 声明 exec 只把包登记为 needs-review，'
        + '宿主不会为它注入运行时、不分配显存、不发网络请求。</p>'
      : '';

    const wl = WHITELIST.map((p) => '<tr><td class="mono">' + esc(p) + '</td><td class="wrap">' + esc(PERM_NOTE[p] || '') + '</td></tr>').join('');

    return '<div class="panel">'
      + '<div class="panel-h">permissions 声明值<span class="spacer"></span>'
      + '<span class="num">' + declared.length + ' 条声明 · ' + unknown.length + ' 条未识别</span></div>'
      + '<div class="panel-b">'
      + '<p class="note hint">启停开关只写 localStorage 的 <span class="mono">' + LS_KEY + '</span>：'
      + '这里只记录本地启用意图，执行在 loader 侧 —— 页面不会真的加载或卸载任何插件，'
      + '注册表合并仍然只发生在 Node 侧的 plugins/loader.js。</p>'
      + '<table class="tbl fixed"><colgroup><col class="col-perm"><col class="col-verdict"><col></colgroup>'
      + '<thead><tr><th>权限</th><th>判定</th><th>依据</th></tr></thead><tbody>' + rows + '</tbody></table>'
      + execHint
      + '<p class="note">未声明 permissions 的包等于「全拒」：这个平台不存在隐式授权。</p>'
      + '</div></div>'
      + '<div class="panel">'
      + '<div class="panel-h">白名单（loader.PERMISSION_WHITELIST）<span class="spacer"></span>'
      + '<span class="num">' + WHITELIST.length + ' 条</span></div>'
      + '<div class="panel-b"><table class="tbl fixed"><colgroup><col class="col-perm"><col></colgroup>'
      + '<thead><tr><th>权限</th><th>语义</th></tr></thead><tbody>' + wl + '</tbody></table>'
      + '<p class="note">权限是声明式标签，加载器不沙箱执行代码：白名单只决定「这条声明是否被登记」，不产生任何运行时能力。</p>'
      + '</div></div>';
  }

  /* ═══════════════════════ ui 运行时（卡 ⑧：真渲染） ═══════════════════════
     真渲染的部分：
       1) 主题：把 themes[].tokens 逐个写进 document.documentElement.style，
          本页所有 var(--x) 立刻跟着变 —— 真的改，不是截图；
       2) 面板：按 slot 生成四列 dock，面板是真实 DOM（标题/来源/字段）。
     明确做不到的部分（页面上也写着）：app/ web/ canvas/ inspector/ 四个宿主页
     没有订阅插件主题与面板（那要改跨模块写域），所以跨模块 slot 只有登记。
     页面不写任何文件、不改 ui/tokens.css：主题只在本次会话内覆盖 CSS 变量，刷新即复位。 */
  const SLOTS = ['stage-sidebar', 'inspector-right', 'toolbar', 'export-dialog'];
  const SLOT_NOTE = {
    'stage-sidebar': '参数工作台左侧栏',
    'inspector-right': '检视器右栏',
    toolbar: '顶栏工具区',
    'export-dialog': '导出弹窗'
  };
  const HOSTS = ['app/', 'web/', 'canvas/', 'inspector/'];
  const SAFE_COLOR = /^(#[0-9a-f]{3,8}|rgba?\([\d.,\s%]+\))$/i;
  let appliedTheme = null;   // {plugin_id, id, tokens}
  let appliedProps = [];     // 已写进 documentElement 的 CSS 变量名

  function themeEntries() {
    const out = [];
    for (const e of uiPacks()) {
      for (const t of ((e.manifest.contributes.ui.themes) || [])) out.push({ entry: e, theme: t });
    }
    return out;
  }
  function panelEntries() {
    const out = [];
    for (const e of uiPacks()) {
      for (const p of ((e.manifest.contributes.ui.panels) || [])) out.push({ entry: e, panel: p });
    }
    return out;
  }

  function clearTheme() {
    for (const k of appliedProps) document.documentElement.style.removeProperty(k);
    appliedProps = [];
  }

  /** 应用主题：真的写 CSS 变量。只接受 --开头 的变量名与安全值（再防一遍 css 侧信道）。 */
  function applyTheme(pluginId, themeId) {
    const hit = themeEntries().find((x) => x.entry.id === pluginId && x.theme.id === themeId);
    if (!hit) { toast('找不到主题 ' + pluginId + '::' + themeId); return 0; }
    clearTheme();
    let n = 0;
    for (const [k, v] of Object.entries(hit.theme.tokens || {})) {
      if (!/^--[A-Za-z0-9_-]+$/.test(k) || typeof v !== 'string') continue;
      if (/url\s*\(|javascript:|@import|<\/?script/i.test(v)) continue;
      document.documentElement.style.setProperty(k, v);
      appliedProps.push(k);
      n += 1;
    }
    appliedTheme = { plugin_id: pluginId, id: themeId, tokens: n };
    render();
    toast('已应用主题「' + (hit.theme.title || themeId) + '」：' + n + ' 个 CSS 变量写进 :root（本页会话内生效）');
    return n;
  }

  function resetTheme() {
    const had = appliedTheme;
    clearTheme();
    appliedTheme = null;
    render();
    toast(had ? '已还原主题覆盖（' + had.id + '）' : '当前没有应用主题');
  }

  /** 面板卡：真实 DOM，字段值由参数工作台持有，这里只渲染 label/key/只读标记 */
  function panelCard(entry, panel) {
    const sig = sigOf(entry);
    const fields = (panel.fields || []).map((f) =>
      '<div class="field"><span class="lbl">' + esc(f.label || f.key) + '</span>'

      + (f.readonly ? '<span class="chip">只读</span>' : '')
      + '<span class="spacer"></span>'
      + '<span class="chip ' + (sig.present ? 'ok' : 'warn') + '">' + esc(sig.present ? sig.label : '缺签') + '</span>'
      + '</div>').join('');
    return '<div class="pcard">'
      + '<div class="pcard-h">' + esc(panel.title || panel.id)
      + '<span class="spacer"></span><span class="chip">' + esc(panel.id) + '</span></div>'
      + '<div class="pcard-b">' + (fields || '<span class="hint">面板没有字段</span>') + '</div>'
      + '<div class="pcard-f">来源 <span class="mono">' + esc(entry.id) + '</span> · state ' + esc(entry.state)
      + ' · 字段值由参数工作台持有，本页只读渲染</div>'
      + '</div>';
  }

  function renderUiTab() {
    const themes = themeEntries();
    const panels = panelEntries();

    const hostPanel = '<div class="panel">'
      + '<div class="panel-h">接线状态<span class="spacer"></span>'

      + (appliedTheme ? '主题已应用：' + esc(appliedTheme.id) : '未应用主题') + '</span></div>'
      + '<div class="panel-b"><dl class="detail-kv">'
      + fieldRow('本页真渲染', '<span class="chip ok">主题 → :root CSS 变量</span> <span class="chip ok">面板 → slot dock（四列）</span>')
      + fieldRow('跨模块宿主', '<span class="chip warn">登记不渲染</span> <span class="hint">'
        + esc(HOSTS.join(' · ')) + ' 尚未订阅插件主题/面板（要改跨模块写域）</span>')
      + fieldRow('数据来源', '<span class="mono">plugins/snapshot.json</span>'
        + ' <span class="hint">entries[].manifest.contributes.ui + entries[].state；页面不二次判断</span>')
      + '</dl></div></div>';

    const cards = themes.length ? themes.map(function (x) {
      const on = !!appliedTheme && appliedTheme.plugin_id === x.entry.id && appliedTheme.id === x.theme.id;
      const sig = sigOf(x.entry);
      const sws = Object.entries(x.theme.tokens || {}).slice(0, 8).map(function (kv) {
        const color = SAFE_COLOR.test(String(kv[1])) ? String(kv[1]) : '';
        return '<span class="sw" title="' + esc(kv[0] + ': ' + kv[1]) + '">'
          + '<i' + (color ? ' style="background-color:' + esc(color) + '"' : '') + '></i>' + esc(kv[0]) + '</span>';
      }).join('');
      return '<div class="themecard' + (on ? ' on' : '') + '">'
        + '<div class="th"><span class="nm">' + esc(x.theme.title || x.theme.id) + '</span>'
        + '<span class="chip ' + (sig.tone === 'ok' ? 'ok' : 'warn') + '">' + esc(x.entry.state) + '</span></div>'
        + '<div class="sws">' + sws + '</div>'
        + '<div class="ops">'
        + '<button class="btn' + (on ? '' : ' acc') + '" type="button"'
        + ' data-theme-apply="' + esc(x.entry.id + '::' + x.theme.id) + '"' + (on ? ' disabled' : '') + '>'
        + (on ? '已应用' : '应用主题') + '</button>'
        + (on ? '<button class="btn" type="button" data-theme-reset="1">还原</button>' : '')
        + '</div>'
        + '<div class="pcard-f">' + esc(x.entry.id) + ' · ' + Object.keys(x.theme.tokens || {}).length + ' 个 token</div>'
        + '</div>';
    }).join('') : '<div class="zero"><span class="hint">没有可用的 ui 主题包（packs/ 里没有 state=active|unsigned 的 ui 类插件）</span></div>';

    const slotHtml = SLOTS.map(function (slot) {
      const mine = panels.filter(function (x) { return x.panel.slot === slot; });
      const body = mine.length
        ? mine.map(function (x) { return panelCard(x.entry, x.panel); }).join('')
        : '<div class="zero"><span class="hint">该 slot 没有面板</span></div>';
      return '<section class="slot"><div class="slot-h"><span class="mono">' + esc(slot) + '</span>'
        + '<span class="hint">' + esc(SLOT_NOTE[slot] || '') + '</span>'

    return hostPanel
      + '<div class="panel"><div class="panel-h">主题（themes[]）<span class="spacer"></span>'
      + '<span class="num">' + themes.length + ' 个</span></div>'
      + '<div class="panel-b"><div class="themes">' + cards + '</div>'
      + '<p class="note">点「应用主题」= 把 token 写进 <span class="mono">document.documentElement.style</span>，本页配色立刻改变；'
      + '「还原」清除覆盖。不写文件、不改 <span class="mono">ui/tokens.css</span>，刷新即复位。</p></div></div>'
      + '<div class="panel"><div class="panel-h">slot dock（panels[]）<span class="spacer"></span>'
      + '<span class="num">' + panels.length + ' 块面板</span></div>'
      + '<div class="panel-b"><div class="slots">' + slotHtml + '</div>'
      + '<p class="note">四列是<b>真实容器</b>：面板按 <span class="mono">slot</span> 字段挂进来。'
      + '宿主页（<span class="mono">' + esc(HOSTS.join(' / ')) + '</span>）尚未订阅 → 那里标「登记不渲染」。</p>'
      + '</div></div>';
  }


  /* ═══════════════════════════ 校验页 ═══════════════════════════ */
  function problemTable(rows) {
    return '<table class="tbl fixed"><colgroup><col class="col-code"><col class="col-path"><col></colgroup>'
      + '<thead><tr><th>code</th><th>path</th><th>message</th></tr></thead><tbody>'

        + '<td class="mono">' + esc(r.code) + '</td>'
