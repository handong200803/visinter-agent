<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地服务 · VisInter-Agent v0.1</title>
<style>
/*__TOKENS__*/
/*__UI__*/
/*__SKIN__*/

/* ── 本模块私有样式：只放服务控制台特有的几块，通用件一律用 module-ui.css ── */
.topbar .live { display: inline-flex; align-items: center; gap: 6px; }
.health { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp2); }
@media (max-width: 1180px) { .health { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* 本地服务面板的一块读数卡：半透明白 0.06 + 1px 冷灰边 + 黑阴影托底 + 顶部内亮线，
   与骨架的 .panel 同一套配方，只是圆角档位和内部排版不同 */
.stat {
  padding: var(--sp2) var(--sp2) var(--sp1);
  border: 1px solid var(--line); border-radius: var(--r3);
  background-color: var(--panel);
  background-image: var(--sheen); background-repeat: no-repeat;
  -webkit-backdrop-filter: var(--glass-blur-lite); backdrop-filter: var(--glass-blur-lite);
  box-shadow: var(--shadow-pop), var(--shadow-inset);
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease),
              transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
/* 读数卡成组出现，hover 走三件套（提亮 + 亮边 + 上浮 3px + 冷光） */
.health .stat:hover {
  background-color: var(--glass-hover);
  border-color: var(--glass-line-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop), var(--shadow-inset), 0 0 20px var(--glow-cool);
}
.stat .k { font-size: var(--fz-xs); color: var(--text-dim2); letter-spacing: .3px; }
.stat .v { margin-top: 2px; font-size: var(--fz-l); color: var(--text); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: var(--fz-xs); color: var(--text-dim); margin-left: 3px; }
.stat .n { margin-top: 2px; font-size: var(--fz-xs); color: var(--text-dim2); }

.method { display: inline-block; min-width: 42px; padding: 0 5px; text-align: center;
  font: var(--fz-xs)/17px var(--mono); border: 1px solid var(--line2); border-radius: var(--r); color: var(--text-dim); }
.method.post { color: var(--acc); border-color: var(--acc-dim); }
.route-path { font-family: var(--mono); font-size: var(--fz-s); color: var(--text); }
tr.sel td { background: var(--acc-fill); }
tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--acc); }

.try { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp3); }
@media (max-width: 1180px) { .try { grid-template-columns: minmax(0, 1fr); } }
.try textarea { width: 100%; height: 120px; }
.res { max-height: 260px; }
.res-meta { display: flex; align-items: center; gap: var(--sp2); margin-bottom: var(--sp1); font-size: var(--fz-xs); color: var(--text-dim); }

.chain2 { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
.chain2 .n { padding: 2px 7px; border: 1px solid var(--line2); border-radius: var(--r); font: var(--fz-xs)/1.6 var(--mono); color: var(--text-dim); }
.chain2 .n.term { border-color: var(--ok); color: var(--ok); }
.chain2 .a { color: var(--text-dim2); padding: 0 5px; font-size: var(--fz-xs); }
.trans { font-size: var(--fz-xs); color: var(--text-dim); }
.trans b { color: var(--text); font-weight: 500; }

.sse { max-height: 240px; }
/* 日志 / 响应体：.glass-well 口径 —— 膜内凹槽（bg-deep + 内描边），不叠 backdrop-filter */
.res, .sse {
  background-color: var(--bg-deep);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  overflow: auto;
}
.progress { display: flex; align-items: center; gap: var(--sp2); }
.progress .bar { flex: 1; }
.tag { font: var(--fz-xs)/1.6 var(--mono); color: var(--text-dim2); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }

/* ── 窄屏（≤900）：读数卡不再上浮，一格一行；侧栏由骨架改成贴边条带 ── */
@media (max-width: 900px) {
  .health { grid-template-columns: minmax(0, 1fr); }
  .health .stat:hover { transform: none; box-shadow: var(--shadow-pop), var(--shadow-inset); }
  .try { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="btn mini ghost" data-backlink href="../app/index.html" title="返回平台工作台（各模块页共用的回程路）">← 工作台</a>
    <div class="brand"><b>本地服务</b><span>VisInter-Agent v0.1</span></div>
    <span class="crumbs">工作台<i>/</i>服务</span>
    <span class="spacer"></span>
    <span class="live" id="liveBadge"><span class="dot off"></span><span id="liveText">探测中</span></span>
    <button class="btn" id="btnReload" title="重新探测 /api/health（2.5s 超时）">重连</button>
  </header>

  <div class="body" style="--col:300px">
    <aside class="aside">
      <div class="aside-h">视图<span class="spacer"></span><span id="navHint">快照</span></div>
      <div class="aside-b">
        <div class="list" id="nav"></div>
        <div class="sect">后端</div>
        <div class="list" id="envList"></div>
      </div>
    </aside>

    <main class="main">
      <div class="main-h">
        <h2 id="vTitle">概览</h2>
        <span class="sub" id="vSub"></span>
        <span class="spacer"></span>
        <span class="badge" id="vBadge"></span>
      </div>
      <div class="main-b" id="view"></div>
      <div class="main-f" id="viewFoot"></div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="footSrc"></span>
    <span class="spacer"></span>
    <span id="footRight"></span>
  </footer>
</div>

<script>
/*__SNAP__*/
(function () {
  'use strict';

  var S = window.__SNAP || {};
  var BASE = location.protocol === 'file:' ? ((S.server && S.server.baseUrl) || 'http://127.0.0.1:8388') : location.origin;
  var ROUTES = (S.routes || []).slice();
  var VIEWS = [
    { id: 'overview', name: '概览', svg: 'M3 3h6v6H3zM9 9h4v4H9zM3 11h4v4H3z' },
    { id: 'routes', name: '端点', svg: 'M3 4h10M3 8h10M3 12h6' },
    { id: 'jobs', name: '队列', svg: 'M3 3h10M3 7h10M3 11h10' },
    { id: 'devices', name: '设备档', svg: 'M3 4h10v6H3zM5 12h6' },
    { id: 'contract', name: '契约', svg: 'M4 2h5l3 3v7H4zM9 2v3h3' }
  ];

  var st = {
    online: null, health: null, error: null, view: 'overview',
    route: (S.routes && S.routes.length) ? 0 : -1,
    jobs: [], job: null, timer: null, sse: null, log: [], tryBody: null, tryRes: null, busy: false
  };

  function $(id) { return document.getElementById(id); }

  function se(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function svg(path, size) {
    var s = size || 14;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" '
      + 'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + path + '"/></svg>';
  }

  function num(v, unit) {
    return '<span class="num">' + se(v) + '</span>' + (unit ? ' <span class="hint">' + se(unit) + '</span>' : '');
  }

  /* ── HTTP ───────────────────────────────────────────────────────── */

  function call(path, init, ms) {
    var opt = init || {};
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    if (ctl) opt.signal = ctl.signal;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms || 2500) : null;
    var t0 = Date.now();
    return fetch(BASE + path, opt).then(function (r) {
      if (timer) clearTimeout(timer);
      return r.text().then(function (txt) {
        var body = null;
        try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = { raw: String(txt).slice(0, 1200) }; }
        return { status: r.status, ok: r.ok, ms: Date.now() - t0, body: body };
      });
    }, function (e) {
      if (timer) clearTimeout(timer);
      var err = new Error(e && e.name === 'AbortError' ? '请求超时' : '连接失败（后端未启动？）');
      err.code = 'E_OFFLINE';
      throw err;
    });
  }

  function probe() {
    $('liveText').textContent = '探测中';
    return call('/api/health', null, 2500).then(function (r) {
      if (!r.ok) throw new Error('health 返回 ' + r.status);
      st.online = true; st.health = r.body; st.error = null;
      paintLive();
      if (st.view === 'overview' || st.view === 'jobs') paint();
      return r.body;
    }).catch(function (e) {
      st.online = false; st.health = null; st.error = e.code ? e.code + ' · ' + e.message : '连接失败';
      paintLive();
      if (st.view === 'overview' || st.view === 'jobs') paint();
    });
  }

  function paintLive() {
    var dot = $('liveBadge').querySelector('.dot');
    if (st.online === null) { dot.className = 'dot off'; $('liveText').textContent = '探测中'; return; }
    if (!st.online) { dot.className = 'dot off'; $('liveText').textContent = '未连接'; return; }
    var h = st.health || {};
    dot.className = 'dot ok';
    $('liveText').textContent = '在线 · v' + (h.version || '?') + ' · comfy ' + ((h.comfy && h.comfy.mode) || '?');
    $('liveText').title = 'pid ' + (h.pid || '?') + ' · uptime ' + (h.uptime_sec != null ? h.uptime_sec + 's' : '?');
  }

  /* ── 侧栏 ───────────────────────────────────────────────────────── */

  function paintNav() {
    $('nav').innerHTML = VIEWS.map(function (v) {
      return '<div class="row" role="button" tabindex="0" data-view="' + v.id + '" aria-selected="' + (st.view === v.id) + '">'
        + '<span class="ico">' + svg(v.svg) + '</span>'
        + '<span class="t">' + v.name + '</span>'
        + '<span class="s">' + (v.id === 'routes' ? ROUTES.length : v.id === 'devices' ? ((S.catalog && S.catalog.count) || 0) : '') + '</span></div>';
    }).join('');

    var srv = S.server || {};
    $('envList').innerHTML = [
      ['端口', srv.port || '?'],
      ['宿主', srv.host || '?'],
      ['基址', BASE.replace(/^http:\/\//, '')],
      ['启动', (srv.start || 'node tools/serve.mjs')],
      ['版本', (S.service && S.service.version) || '?']
    ].map(function (kv) {
      return '<div class="row" style="cursor:default;grid-template-columns:56px minmax(0,1fr)">'
        + '<span class="s">' + se(kv[0]) + '</span><span class="t mono" style="font-size:var(--fz-xs)" title="' + se(kv[1]) + '">' + se(kv[1]) + '</span></div>';
    }).join('');
  }

  /* ── 视图：概览 ─────────────────────────────────────────────────── */

  function stat(k, v, unit, note) {
    return '<div class="stat"><div class="k">' + se(k) + '</div><div class="v">' + se(v)
      + (unit ? '<small>' + se(unit) + '</small>' : '') + '</div>'
      + (note ? '<div class="n">' + se(note) + '</div>' : '') + '</div>';
  }

  function viewOverview() {
    var h = st.health;
    if (st.online === null) return '<div class="empty"><b>正在探测后端</b><span>GET ' + se(BASE) + '/api/health · 2.5s 超时</span></div>';
    if (!st.online) {
      return '<div class="empty"><b>后端未启动</b>'
        + '<span>本页其余部分仍可读：端点表、状态机、错误码都来自构建期契约快照 ' + se(S.generatedAt || '') + '。</span>'
        + '<span>启动方式：<span class="mono">node tools/serve.mjs</span>（PORT / HOST 可覆盖，默认 ' + se((S.server && S.server.port) || 8388) + ' / 127.0.0.1）</span>'
        + '<span class="hint">失败原因：' + se(st.error || '未知') + '</span></div>'
        + '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">离线快照里的接口规模</div><div class="panel-b">'
        + '<div class="health">' + stat('接口', ROUTES.length, '条')
        + stat('状态', (S.stateMachine && S.stateMachine.states.length) || 0, '个')
        + stat('设备档', (S.catalog && S.catalog.count) || 0, '档')
        + stat('参数', (S.registry && S.registry.params) || 0, '个') + '</div></div></div>';
    }
    var comfy = h.comfy || {};
    var reg = h.registry || {};
    var disk = h.disk || {};
    var jobs = h.jobs || {};
    var diskTxt = disk.free_gib != null ? disk.free_gib : (disk.free_mib != null ? Math.round(disk.free_mib / 1024 * 10) / 10 : '—');
    var diskNote = disk.mount ? (disk.mount + (disk.total_gib != null ? ' · 共 ' + disk.total_gib + ' GB' : '')) : '';
    return '<div class="health">'
      + stat('服务版本', h.version || '?', '', 'node ' + (h.node || '?'))
      + stat('运行时长', h.uptime_sec != null ? h.uptime_sec : '?', 's', 'pid ' + (h.pid || '?') + ' · ' + (h.platform || '') + '/' + (h.arch || ''))
      + stat('ComfyUI', comfy.reachable ? '可达' : '不可达', '', comfy.reachable ? (comfy.base || '') : '模式 mock · ' + ((comfy.detail && comfy.detail.code) || '连不上'))
      + stat('磁盘余量', diskTxt, 'GB', diskNote)
      + stat('参数注册表', reg.params != null ? reg.params : '?', '个', (reg.stages || 0) + ' 板块 · v' + (reg.version || '?'))
      + stat('联动规则', (h.rules && h.rules.count) || 0, '条', 'v' + ((h.rules && h.rules.version) || '?'))
      + stat('设备档', (h.catalog && h.catalog.devices) || 0, '档', 'v' + ((h.catalog && h.catalog.version) || '?'))
      + stat('队列', jobs.total != null ? jobs.total : '?', '个', '并发 ' + (jobs.concurrency != null ? jobs.concurrency : '?') + ' · 运行 ' + (jobs.running || 0))
      + '</div>'
      + '<div class="grid2" style="margin-top:var(--sp3)">'
      + '<div class="panel"><div class="panel-h">队列近况<span class="spacer"></span><button class="btn mini" id="btnQuickJobs">刷新</button></div>'
      + '<div class="panel-b"><div class="health" style="grid-template-columns:repeat(3,minmax(0,1fr))">'
      + stat('总任务', jobs.total != null ? jobs.total : '?', '')
      + stat('排队', jobs.queued || 0, '')
      + stat('运行', jobs.running || 0, '')
      + stat('成功', jobs.succeeded || 0, '')
      + stat('失败', jobs.failed || 0, '')
      + stat('取消', jobs.canceled || 0, '')
      + '</div><div class="hint" style="margin-top:var(--sp2)">任务落盘：<span class="mono">' + se(jobs.dir || '') + '</span>；并发上限 ' + se(jobs.concurrency) + '。</div></div></div>'
      + '<div class="panel"><div class="panel-h">快速试调（真请求）</div><div class="panel-b">'
      + '<div style="display:flex;flex-wrap:wrap;gap:var(--sp2)">'
      + '<button class="btn mini" data-quick="/api/params">GET /api/params</button>'
      + '<button class="btn mini" data-quick="/api/devices">GET /api/devices</button>'
      + '<button class="btn mini" data-quick="/api/health">GET /api/health</button>'
      + '</div><div id="quickOut" style="margin-top:var(--sp2)"><div class="hint">点一个接口，本页直接发请求并把原始 JSON 显示在这里。</div></div></div></div>'
      + '</div>'
      + '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">实时值（/api/health 原始口径）</div>'
      + '<div class="panel-b"><dl class="kv">'
      + kv('service', h.service) + kv('comfy.base', comfy.base) + kv('comfy.mode', comfy.mode)
      + kv('jobs.dir', jobs.dir) + kv('registry.updated', reg.updated)
      + '</dl></div></div>';
  }

  function kv(k, v) {
    return '<dt>' + se(k) + '</dt><dd class="mono">' + se(v == null ? '—' : String(v)) + '</dd>';
  }

  /* ── 视图：端点 ─────────────────────────────────────────────────── */

  function viewRoutes() {
    var r = st.route >= 0 ? ROUTES[st.route] : null;
    var rows = ROUTES.map(function (x, i) {
      return '<tr data-route="' + i + '" class="' + (i === st.route ? 'sel' : '') + '" style="cursor:pointer">'
        + '<td class="nowrap"><span class="method' + (x.method === 'POST' ? ' post' : '') + '">' + se(x.method) + '</span></td>'
        + '<td class="route-path">' + se(x.path) + '</td>'
        + '<td class="right num">' + se(x.status || '') + '</td>'
        + '<td class="hint" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + se(x.purpose) + '">' + se(x.purpose) + '</td>'
        + '<td>' + (x.sse ? '<span class="badge">SSE</span>' : '') + '</td></tr>';
    }).join('');

    var detail = '';
    if (r) {
      var need = (r.pathParams || []).slice();
      var fillable = need.length === 0 || (st.jobs.length > 0);
      var sample = r.sampleBody == null ? '' : JSON.stringify(r.sampleBody, null, 2);
      var body = st.tryBody != null ? st.tryBody : sample;
      detail = '<div class="panel" style="margin-top:var(--sp3)">'
        + '<div class="panel-h">' + se(r.method) + ' ' + se(r.path) + '<span class="spacer"></span>'
        + (need.length ? '<span class="badge warn">路径参数 ' + se(need.join(', ')) + '</span>' : '')
        + '<button class="btn mini acc" id="btnTry"' + (fillable ? '' : ' disabled title="先刷新队列拿到任务 id"') + '>试一下</button></div>'
        + '<div class="panel-b"><div class="try">'
        + '<div><div class="hint" style="margin-bottom:4px">请求体' + (r.method === 'GET' ? '（GET 无请求体）' : '（示例来自契约快照）') + '</div>'
        + '<textarea class="textarea" id="tryBody"' + (r.method === 'GET' ? ' disabled' : '') + ' placeholder="' + (r.method === 'GET' ? '无' : '{}') + '">' + se(body) + '</textarea>'
        + '<div class="hint" style="margin-top:4px">' + se(r.notes || '') + '</div></div>'
        + '<div><div class="hint" style="margin-bottom:4px">响应</div><div id="tryOut">'
        + (st.tryRes ? renderTry(st.tryRes) : '<div class="empty" style="padding:var(--sp2)">还没调用。</div>') + '</div></div>'
        + '</div></div></div>';
    }

    return '<div class="panel"><div class="panel-h">接口表<span class="spacer"></span><span class="tag">' + ROUTES.length + ' 条 · 源 server/snapshot.json</span></div>'
      + '<table class="tbl"><thead><tr><th>方法</th><th>路径</th><th class="right">码</th><th>用途</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      + detail;
  }

  function renderTry(res) {
    var cls = res.ok ? 'ok' : 'bad';
    var body = res.body == null ? '（空响应体）' : JSON.stringify(res.body, null, 2);
    return '<div class="res-meta"><span class="badge ' + cls + '">' + se(res.status) + '</span>'
      + '<span class="num">' + se(res.ms) + '</span> <span class="hint">ms</span>'
      + '<span class="hint">' + (res.ok ? '成功' : '错误（code 原样显示）') + '</span></div>'
      + '<pre class="code res">' + se(body.length > 4000 ? body.slice(0, 4000) + '\n…（已截断，完整 ' + body.length + ' 字符）' : body) + '</pre>';
  }

  function tryCall() {
    var r = st.route >= 0 ? ROUTES[st.route] : null;
    if (!r || st.busy) return;
    var path = r.path;
    var need = (r.pathParams || []);
    if (need.length) {
      var id = st.jobs.length ? st.jobs[0].id : null;
      if (!id) { st.tryRes = { ok: false, status: '—', ms: 0, body: { error: { code: 'NO_TARGET_ID', message: '队列里没有任务，先提交一个再试路径参数接口' } } }; paint(); return; }
      need.forEach(function (p) { path = path.replace(':' + p, id).replace('{' + p + '}', id).replace('[' + p + ']', id); });
      // 快照里的路径是 /api/jobs/:id 这种形态；上一步已把 :id 换掉
      if (path.indexOf(':') >= 0 || path.indexOf('[') >= 0) path = path.replace(/[:\[][A-Za-z_]+\]?/g, id);
    }
    var opt = { method: r.method };
    var txt = $('tryBody') ? $('tryBody').value.trim() : '';
    if (r.method !== 'GET' && txt) {
      opt.headers = { 'Content-Type': 'application/json' };
      opt.body = txt;
    }
    st.busy = true; st.tryRes = null; paint();
    call(path, opt, 8000).then(function (res) {
      st.busy = false; st.tryRes = res; paint();
    }).catch(function (e) {
      st.busy = false;
      st.tryRes = { ok: false, status: '—', ms: 0, body: { error: { code: e.code || 'E_FAIL', message: e.message } } };
      paint();
    });
  }

  /* ── 视图：队列 ─────────────────────────────────────────────────── */

  function viewJobs() {
    if (!st.online) {
      return '<div class="empty"><b>后端未连接，队列不可读</b>'
        + '<span>队列状态只存在于服务进程里，快照不保存运行时任务（快照保存的是字段与状态机）。</span>'
        + '<span>启动 <span class="mono">node tools/serve.mjs</span> 后点顶部「重连」。</span></div>'
        + '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">状态机（契约）</div><div class="panel-b">' + smHtml() + '</div></div>';
    }
    var rows = st.jobs.map(function (j) {
      var p = j.progress || {};
      var badge = stateBadge(j.state);
      return '<tr data-job="' + se(j.id) + '" style="cursor:pointer" class="' + (st.job && st.job.id === j.id ? 'sel' : '') + '">'
        + '<td class="mono nowrap">' + se(j.id) + '</td>'
        + '<td>' + badge + '</td>'
        + '<td class="num right">' + se(p.percent != null ? p.percent : 0) + '%</td>'
        + '<td class="hint">' + se(p.stage || '') + '</td>'
        + '<td class="nowrap hint">' + se(j.device || '') + '</td>'
        + '<td class="nowrap hint">' + se((j.createdAt || '').replace('T', ' ').slice(0, 19)) + '</td>'
        + '<td class="right hint">' + (j.durationMs != null ? (j.durationMs / 1000).toFixed(1) + 's' : '—') + '</td></tr>';
    }).join('');

    var detail = '';
    if (st.job) {
      var j = st.job;
      detail = '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">任务 ' + se(j.id)
        + '<span class="spacer"></span>'
        + (j.state === 'queued' || j.state === 'running' ? '<button class="btn mini" id="btnCancel">取消任务</button>' : '')
        + '<button class="btn mini" id="btnSse"' + (st.sse ? ' disabled' : '') + '>订阅事件</button>'
        + '<button class="btn mini ghost" id="btnCloseJob">关闭</button></div>'
        + '<div class="panel-b"><div class="progress"><span class="tag">' + se(j.state) + '</span>'
        + '<span class="bar' + (j.state === 'succeeded' ? ' ok' : j.state === 'failed' ? ' bad' : '') + '"><i style="width:' + Math.max(0, Math.min(100, (j.progress && j.progress.percent) || 0)) + '%"></i></span>'
        + '<span class="num">' + ((j.progress && j.progress.percent) || 0) + '%</span></div>'
        + '<dl class="kv" style="margin-top:var(--sp2)">'
        + kv('device', j.device) + kv('attempt', j.attempt) + kv('createdAt', j.createdAt)
        + kv('startedAt', j.startedAt) + kv('finishedAt', j.finishedAt)
        + kv('error', j.error ? JSON.stringify(j.error) : '—')
        + kv('images', (j.images || []).length + ' 张')
        + '</dl>'
        + (st.log.length ? '<div class="hint" style="margin-top:var(--sp2)">事件流（最多 200 行）</div><pre class="code sse">' + se(st.log.join('\n')) + '</pre>' : '')
        + '</div></div>';
    }

    return '<div class="panel"><div class="panel-h">任务队列<span class="spacer"></span>'
      + '<span class="tag">' + (st.jobs.length ? st.jobs.length + ' 个 · 3s 轮询' : '0 个 · 3s 轮询') + '</span></div>'
      + (st.jobs.length
        ? '<table class="tbl"><thead><tr><th>id</th><th>状态</th><th class="right">进度</th><th>阶段</th><th>设备</th><th>创建</th><th class="right">耗时</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="panel-b"><div class="empty"><b>队列是空的</b><span>提交方式：外壳里点「开始渲染」，或在本页「端点」页试调 <span class="mono">POST /api/jobs</span>。</span><span class="hint">任务落盘目录：' + se((S.jobs && S.jobs.dir) || '（见 /api/health 的 jobs.dir）') + '</span></div></div>')
      + '</div>' + detail;
  }

  function stateBadge(s) {
    var map = { queued: '', running: 'acc', succeeded: 'ok', failed: 'bad', canceled: 'warn' };
    return '<span class="badge ' + (map[s] || '') + '"><span class="dot ' + (s === 'succeeded' ? 'ok' : s === 'failed' ? 'bad' : s === 'canceled' ? 'warn' : s === 'running' ? 'acc' : 'off') + '"></span>' + se(s) + '</span>';
  }

  /* ── 视图：设备档 ───────────────────────────────────────────────── */

  function viewDevices() {
    var devs = (S.catalog && S.catalog.devices) || [];
    if (!devs.length) return '<div class="empty"><b>快照里没有设备档</b><span>检查 server/snapshot.json 的 catalog 字段。</span></div>';
    var rows = devs.map(function (d) {
      return '<tr><td class="mono nowrap">' + se(d.id) + '</td><td>' + se(d.name) + '</td>'
        + '<td class="right num">' + se(d.vram_mib) + '</td><td class="right num">' + se(d.usable_mib) + '</td>'
        + '<td class="right num">' + se(d.usable_ratio != null ? (d.usable_ratio * 100).toFixed(1) + '%' : '—') + '</td>'
        + '<td class="right num">' + se(d.watts != null ? d.watts : '—') + '</td>'
        + '<td class="hint">' + se(d.provenance || '') + '</td></tr>';
    }).join('');
    return '<div class="panel"><div class="panel-h">设备档（spec/models.catalog.json）<span class="spacer"></span><span class="tag">' + devs.length + ' 档</span></div>'
      + '<table class="tbl"><thead><tr><th>档</th><th>名称</th><th class="right">显存 MiB</th><th class="right">可用 MiB</th><th class="right">可用比</th><th class="right">功耗 W</th><th>来源</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      + '<div class="main-f" style="border:0;background:transparent;padding:var(--sp2) 0">'
      + '<span class="hint">' + se((S.catalog && S.catalog.note) || '') + '</span></div>'
      + (st.online ? '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">实时探测（GET /api/devices）</div><div class="panel-b"><button class="btn" id="btnDev">调用</button><div id="devOut" style="margin-top:var(--sp2)"></div></div></div>' : '');
  }

  /* ── 视图：契约 ─────────────────────────────────────────────────── */

  function smHtml() {
    var sm = S.stateMachine || { states: [], transitions: [] };
    var chain = sm.states.map(function (s) {
      var term = (sm.terminal || []).indexOf(s) >= 0;
      return '<span class="n' + (term ? ' term' : '') + '">' + se(s) + '</span>';
    }).join('<span class="a">→</span>');
    var trans = (sm.transitions || []).map(function (t) {
      return '<div class="trans"><b>' + se(t.from) + ' → ' + se(t.to) + '</b> · ' + se(t.trigger)
        + (t.source ? ' <span class="tag">' + se(t.source) + '</span>' : '') + '</div>';
    }).join('');
    return '<div class="chain2">' + chain + '</div><div style="margin-top:var(--sp2)">' + trans + '</div>';
  }

  function viewContract() {
    var err = S.errors || {};
    var codes = (err.codes || []).map(function (c) { return '<span class="badge mono">' + se(c) + '</span>'; }).join(' ');
    var sm = (err.statusMap || {});
    var smRows = Object.keys(sm).map(function (k) { return '<div class="trans"><b>' + se(k) + '</b> → ' + se(sm[k]) + '</div>'; }).join('');
    return '<div class="grid2">'
      + '<div class="panel"><div class="panel-h">任务状态机</div><div class="panel-b">' + smHtml()
      + '<div class="hint" style="margin-top:var(--sp2)">终态：' + se(((S.stateMachine && S.stateMachine.terminal) || []).join(' / ')) + '</div></div></div>'
      + '<div class="panel"><div class="panel-h">错误形状</div><div class="panel-b"><pre class="code">' + se(err.shape || '—') + '</pre>'
      + '<div class="hint" style="margin-top:var(--sp2)">状态码映射</div>' + smRows + '</div></div>'
      + '</div>'
      + '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">错误码（' + ((err.codes || []).length) + ' 个）</div><div class="panel-b">' + codes + '</div></div>'
      + '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">请求体与限额</div><div class="panel-b"><dl class="kv">'
      + kv('maxBodyBytes', (S.limits && S.limits.maxBodyBytes)) + kv('说明', (S.limits && S.limits.note))
      + kv('CORS', JSON.stringify((S.service && S.service.cors) || {}))
      + kv('作业字段', ((S.jobs && S.jobs.fields) || []).join(', '))
      + '</dl></div></div>'
      + '<div class="panel" style="margin-top:var(--sp3)"><div class="panel-h">快照来源</div><div class="panel-b"><dl class="kv">'
      + kv('schema', S.schema) + kv('generatedAt', S.generatedAt) + kv('generator', S.generator) + kv('source', S.source)
      + '</dl></div></div>';
  }

  /* ── 渲染调度 ───────────────────────────────────────────────────── */

  var TITLES = {
    overview: ['概览', '后端健康与关键计数'],
    routes: ['端点', '契约表 + 真实试调'],
    jobs: ['队列', '任务状态与事件流'],
    devices: ['设备档', '显存账本'],
    contract: ['契约', '状态机 / 错误码 / 限额']
  };

  function paint() {
    var v = st.view;
    $('vTitle').textContent = TITLES[v][0];
    $('vSub').textContent = TITLES[v][1];
    $('vBadge').className = 'badge ' + (st.online ? 'ok' : st.online === null ? '' : 'warn');
    $('vBadge').textContent = st.online ? '在线' : st.online === null ? '探测中' : '离线快照';
    paintNav();
    $('view').innerHTML = v === 'overview' ? viewOverview()
      : v === 'routes' ? viewRoutes()
      : v === 'jobs' ? viewJobs()
      : v === 'devices' ? viewDevices() : viewContract();
    bindView();
    $('viewFoot').innerHTML = v === 'routes'
      ? '试调是本页直接发到 ' + se(BASE) + ' 的真实请求（CORS 由后端 Access-Control-Allow-Origin:* 放行）；路径参数用队列第一个任务 id 填充。'
      : v === 'jobs'
        ? '队列只在校验后端在线时可读；事件流走 SSE（' + se('/api/jobs/<id>/events') + '），关闭视图即断开。'
        : v === 'devices'
          ? '设备档来自 spec/models.catalog.json 的构建期快照；可用显存是标称值，不是运行时探测。'
          : v === 'contract'
            ? '契约来自静态解析 server/*.js，不依赖后端是否在跑；字段名与错误码以代码为准。'
            : '健康检查每次请求都会 force 探测 ComfyUI（2.5s 超时）；不可达时 mode=mock，队列仍会跑真实状态机。';
    paintLive();
  }

  function bindView() {
    [].forEach.call($('nav').querySelectorAll('[data-view]'), function (row) {
      row.addEventListener('click', function () { st.view = row.getAttribute('data-view'); st.tryRes = null; paint(); });
      row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { st.view = row.getAttribute('data-view'); paint(); } });
    });

    [].forEach.call($('view').querySelectorAll('[data-route]'), function (tr) {
      tr.addEventListener('click', function () {
        st.route = Number(tr.getAttribute('data-route'));
        st.tryBody = null; st.tryRes = null; paint();
      });
    });

    var bTry = $('btnTry');
    if (bTry) bTry.addEventListener('click', tryCall);

    var bQj = $('btnQuickJobs');
    if (bQj) bQj.addEventListener('click', function () { bQj.disabled = true; refreshJobs(); setTimeout(function () { bQj.disabled = false; }, 800); });

    [].forEach.call($('view').querySelectorAll('[data-quick]'), function (b) {
      b.addEventListener('click', function () {
        var path = b.getAttribute('data-quick');
        b.disabled = true;
        $('quickOut').innerHTML = '<div class="hint">请求中 ' + se(path) + ' …</div>';
        call(path, null, 6000).then(function (r) {
          $('quickOut').innerHTML = renderTry(r);
        }).catch(function (e) {
          $('quickOut').innerHTML = '<div class="empty" style="padding:var(--sp2)">失败：' + se(e.code || '') + ' · ' + se(e.message) + '</div>';
        }).then(function () { b.disabled = false; });
      });
    });

    var bDev = $('btnDev');
    if (bDev) bDev.addEventListener('click', function () {
      bDev.disabled = true;
      call('/api/devices', null, 4000).then(function (r) {
        $('devOut').innerHTML = renderTry(r);
      }).catch(function (e) {
        $('devOut').innerHTML = '<div class="empty" style="padding:var(--sp2)">失败：' + se(e.code || '') + ' · ' + se(e.message) + '</div>';
      }).then(function () { bDev.disabled = false; });
    });

    [].forEach.call($('view').querySelectorAll('[data-job]'), function (tr) {
      tr.addEventListener('click', function () { openJob(tr.getAttribute('data-job')); });
    });

    var bCancel = $('btnCancel');
    if (bCancel) bCancel.addEventListener('click', function () {
      bCancel.disabled = true;
      call('/api/jobs/' + encodeURIComponent(st.job.id) + '/cancel', { method: 'POST' }, 4000)
        .then(function (r) { st.log.push('cancel → ' + r.status + ' ' + JSON.stringify(r.body).slice(0, 200)); refreshJobs(); })
        .catch(function (e) { st.log.push('cancel 失败 ' + (e.code || '') + ' ' + e.message); paint(); });
    });

    var bSse = $('btnSse');
    if (bSse) bSse.addEventListener('click', subscribe);

    var bClose = $('btnCloseJob');
    if (bClose) bClose.addEventListener('click', function () { closeSse(); st.job = null; st.log = []; paint(); });
  }

  /* ── 队列数据与事件流 ───────────────────────────────────────────── */

  function refreshJobs() {
    if (!st.online) return;
    call('/api/jobs?limit=50', null, 3000).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      st.jobs = (r.body && r.body.jobs) || [];
      if (st.job) {
        var cur = st.jobs.filter(function (j) { return j.id === st.job.id; })[0];
        if (cur) st.job = Object.assign({}, st.job, cur);
      }
      if (st.view === 'jobs') paint();
    }).catch(function (e) {
      st.online = false; st.error = e.code ? e.code + ' · ' + e.message : '连接断开';
      paintLive(); paint();
    });
  }

  function openJob(id) {
    call('/api/jobs/' + encodeURIComponent(id), null, 4000).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      st.job = r.body; st.log = [];
      closeSse();
      paint();
    }).catch(function (e) {
      st.log = ['取任务详情失败：' + (e.code || '') + ' ' + e.message];
      paint();
    });
  }

  function subscribe() {
    if (!st.job || typeof EventSource !== 'function') return;
    closeSse();
    var url = BASE + '/api/jobs/' + encodeURIComponent(st.job.id) + '/events';
    var es = new EventSource(url);
    st.sse = es;
    es.onmessage = function (ev) {
      st.log.push(String(ev.data).slice(0, 300));
      if (st.log.length > 200) st.log.splice(0, st.log.length - 200);
      paint();
    };
    es.addEventListener('done', function (ev) {
      st.log.push('done ' + String(ev.data).slice(0, 200));
      closeSse(); refreshJobs();
    });
    es.onerror = function () {
      st.log.push('事件流中断（后端关闭或任务结束）；已停止接收。');
      closeSse(); paint();
    };
  }

  function closeSse() {
    if (st.sse) { try { st.sse.close(); } catch (e) { /* 已关闭 */ } st.sse = null; }
  }

  /* ── 启动 ───────────────────────────────────────────────────────── */

  function boot() {
    var srv = S.server || {};
    $('footSrc').textContent = '数据来源 server/snapshot.json · 生成于 ' + (S.generatedAt || '?')
      + ' · 后端 ' + BASE + ' · 端口来自 ' + (srv.start || 'tools/serve.mjs');
    $('footRight').innerHTML = '接口 <span class="num">' + ROUTES.length + '</span> · 状态机 <span class="num">'
      + ((S.stateMachine && S.stateMachine.states.length) || 0) + '</span> · 错误码 <span class="num">'
      + ((S.errors && S.errors.codes && S.errors.codes.length) || 0) + '</span>';

    $('btnReload').addEventListener('click', function () {
      probe().then(function () { if (st.online) refreshJobs(); });
    });

    // 视图切换动画一律不做；轮询只在可见且停留在队列视图时跑
    st.timer = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      if (st.view === 'jobs' && st.online) refreshJobs();
    }, 3000);

    window.addEventListener('beforeunload', function () { clearInterval(st.timer); closeSse(); });

    paint();
    probe().then(function () { if (st.online) refreshJobs(); });
  }

  boot();
})();
</script>
</body>
</html>
